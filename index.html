function effCalc(units){
  var R={};EVT.forEach(function(e){R[e.k]={n:0,grp:{},m:{}};EFM.forEach(function(f){R[e.k].m[f.k]=[[],[],[]];});});
  units.forEach(function(u){
    var by=u.by,ks=Object.keys(by).sort();if(!ks.length)return;
    var n0=dayNum(ks[0]),n1=dayNum(ks[ks.length-1]);
    var val=function(n,k){
      if(n<n0||n>n1)return null;var r=by[isoDay(n)];
      if(k==='dead')return r?r.dead:0;
      return r?(k==='fdm'?r.fdm:k==='wpp'?r.wpp:k==='tmin'?r.tmin:k==='tmax'?r.tmax:null):null;
    };
    var base=function(n,k){var a=[];for(var i=n-4;i<=n-2;i++){var v=val(i,k);if(v!=null)a.push(v);}return a.length>=2?mean(a):null;};
    /* 그 일이 없었다면 나왔을 값: 앞(2~4일 전)과 뒤(3~5일 후) 평균을 이은 선 위의 값. 뒤 자료가 없으면 앞 5일 추세로 예상 */
    var expect=function(n,k,off){
      var pre=base(n,k),post=null,pa=[];for(var i=n+3;i<=n+5;i++){var v=val(i,k);if(v!=null)pa.push(v);}if(pa.length>=2)post=mean(pa);
      if(pre!=null&&post!=null)return pre+(post-pre)*(off+3)/7;
      var xy=[];for(var j=n-6;j<=n-2;j++){var w=val(j,k);if(w!=null)xy.push([j,w]);}
      return xy.length>=3?linPred(xy,n+off):pre;
    };
    var test=function(ek,n){
      var r=by[isoDay(n)];
      if(ek==='rot')return !!(r&&r.rot>0);
      if(ek==='hk')return !!(r&&r.hk>0);
      if(ek==='cold'){var v=val(n,'tmin'),b=base(n,'tmin');return v!=null&&b!=null&&v<=b-2;}
      if(ek==='hot'){var v2=val(n,'tmax'),b2=base(n,'tmax');return v2!=null&&b2!=null&&v2>=b2+2;}
      if(ek==='sick'){var v3=val(n,'dead'),b3=base(n,'dead');return v3!=null&&b3!=null&&v3>=3&&v3>=2*b3&&v3-b3>=3;}
      return false;
    };
    for(var n=n0+4;n<=n1;n++){
      EVT.forEach(function(e){
        if(!test(e.k,n)||(e.run&&test(e.k,n-1)))return;
        var r=R[e.k],gp=r.grp[u.grp]||(r.grp[u.grp]={name:u.gname,color:u.color,n:0,m:{}});
        r.n++;gp.n++;
        EFM.forEach(function(f){
          [-1,0,1].forEach(function(off,i){var b=expect(n,f.k,off);if(b==null)return;var o=chgOf(f.k,val(n+off,f.k),b);if(o){r.m[f.k][i].push(o.d);if(off===0)(gp.m[f.k]=gp.m[f.k]||[]).push(o.d);}});
        });
      });
    }
  });
  return R;
}
var EFTH={fdm:5,wpp:5,dead:1,tmin:1};
function effTxt(k,v){
  var sig=Math.abs(v)>=EFTH[k],t=k==='dead'?fmtN(Math.abs(Math.round(v*10)/10))+'수':k==='tmin'?Math.abs(v).toFixed(1)+'℃':Math.abs(v).toFixed(0)+'%';
  return {sig:sig,cls:chgCls(k,v,sig),t:sig?(v>0?'▲':'▼')+t:'≈'};
}
function effCell(k,arr,tag){
  if(!arr||!arr.length)return '<'+tag+' class="c0">–</'+tag+'>';
  var o=effTxt(k,mean(arr));return '<'+tag+'><b class="'+o.cls+'">'+o.t+'</b></'+tag+'>';
}
function effSentence(ek,r){
  var lab={fdm:'급이',wpp:'급수',dead:'폐사',tmin:'최저온도'},bits=[],pre=[],rec=false;
  var sp=function(k,v){var o=effTxt(k,v);return lab[k]+' <span class="'+o.cls+'">'+o.t+'</span>';};
  ['fdm','wpp','dead','tmin'].forEach(function(k){
    if((ek==='cold'||ek==='hot')&&k==='tmin')return;if(ek==='sick'&&k==='dead')return;
    var a=r.m[k][1];if(!a.length)return;var v=mean(a);if(Math.abs(v)<EFTH[k])return;bits.push(sp(k,v));
    if(k==='fdm'||k==='wpp'){var nx=r.m[k][2];if(nx.length&&Math.abs(mean(nx))<Math.abs(v)/2)rec=true;}
  });
  ['fdm','wpp'].forEach(function(k){var a=r.m[k][0];if(a.length&&Math.abs(mean(a))>=EFTH[k])pre.push(sp(k,mean(a)));});
  if(ek==='cold'||ek==='hot'){var t=r.m.tmin[1];if(t.length)bits.unshift(sp('tmin',mean(t)));}
  return (pre.length?'전날부터 '+pre.join(', ')+' → ':'')+(bits.length?'당일 '+bits.join(', '):'당일 눈에 띄는 변화 없음')+(rec?' · 다음날 거의 회복':'');
}

function xlTotals(c,data,hs){

    var wb=XLSX.utils.book_new(),used={};
    sheets.forEach(function(sh){
      var nm=xlSheetName(sh.name),k=nm,n=2;while(used[k]){k=xlSheetName(nm.slice(0,28)+' '+n);n++;}used[k]=1;
      var ws=XLSX.utils.aoa_to_sheet(sh.aoa);

      XLSX.utils.book_append_sheet(wb,ws,k);
    });
    var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    var name=cycles.length===1?'worklog_'+cycles[0].stockDate+'.xlsx':'worklog_'+cycles.length+'cycles_'+todayStr()+'.xlsx';
    try{await S.dl.save({filename:name,data:out});toast('엑셀 파일을 저장했습니다');$('bkBox').innerHTML='';}
    catch(e){if(!(e&&e.code==='declined'))fail('파일을 저장하지 못했습니다. 다시 시도하세요.');}
  }catch(e){fail('엑셀을 만들지 못했습니다. 다시 시도하세요.');handleErr(e);}
  finally{if(btn)btn.disabled=false;}
}

function dl(req){
  return new Promise(function(res,rej){
    try{
      var blob=(req.data instanceof Blob)?req.data:new Blob([req.data],{type:'application/octet-stream'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=req.filename;

      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);
      res({status:'saved'});
    }catch(e){rej({code:'unavailable',message:String(e)});}
  });

/* 읽기 사용량 세기: 이 기기가 서버에서 읽은 기록 줄 수를 세어 몇 분마다 usage/{날짜} 문서에 합산한다 (추정치) */
var LIM=50000,pend=0,pendDay=null;
function dayKey(){try{return new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});}catch(e){return new Date().toISOString().slice(0,10);}}
pendDay=dayKey();
try{var sv=JSON.parse(localStorage.getItem('wl-usage')||'null');if(sv&&sv.n>0&&sv.day){pend=sv.n;pendDay=sv.day;}}catch(e){}
function persist(){try{localStorage.setItem('wl-usage',JSON.stringify({day:pendDay,n:pend}));}catch(e){}}
function isOwnerNow(){return !CFG.ownerEmail||!!(fuser&&fuser.email&&normMail(fuser.email)===normMail(CFG.ownerEmail));}
function flush(){
  if(!pend||!fdb||!fuser)return;
  var n=pend,day=pendDay;pend=0;persist();
  var role=isOwnerNow()?'owner':'staff',inc=function(x){return (firebase.firestore.FieldValue&&firebase.firestore.FieldValue.increment)?firebase.firestore.FieldValue.increment(x):x;};
  var by={};by[role]=inc(n);
  try{fdb.doc('usage/'+day).set({total:inc(n),by:by,upd:Date.now()},{merge:true}).catch(function(){pend+=n;persist();});}
  catch(e){pend+=n;persist();}
}
function count(n){
  if(!(n>0))return;
  var k=dayKey();if(k!==pendDay){flush();pendDay=k;}
  pend+=n;persist();
}
function cntSnap(sn,listen,fr){
  try{
    if(!sn||(sn.metadata&&(sn.metadata.fromCache||sn.metadata.hasPendingWrites)))return;
    /* 폰 저장을 켜면 처음 받은 서버 결과가 '바뀐 것만' 담길 수 있어, 리스너마다 처음 한 번은 전체 줄 수로 세어 넉넉하게 추정한다 */
    if(sn.docs!==undefined){var first=!!(fr&&fr.v);if(fr)fr.v=false;count(listen&&sn.docChanges&&!first?sn.docChanges().length:sn.size);}else count(1);
  }catch(e){}
}
function wrap(o){
  if(!o||typeof o!=='object')return o;
  return new Proxy(o,{get:function(t,k){
    var v=t[k];
    if(typeof v!=='function')return v;
    if(k==='get')return function(){var r=v.apply(t,arguments);return (r&&r.then)?r.then(function(sn){cntSnap(sn,false);return sn;}):r;};
    if(k==='onSnapshot')return function(){
      var a=Array.prototype.slice.call(arguments);
      var fr={v:true};for(var i=0;i<a.length;i++){if(typeof a[i]==='function'){(function(f,j){a[j]=function(sn){cntSnap(sn,true,fr);return f.apply(this,arguments);};})(a[i],i);break;}}
      return v.apply(t,a);
    };
    return function(){
      var r=v.apply(t,arguments);
      return (r&&typeof r==='object'&&!r.then&&(typeof r.onSnapshot==='function'||typeof r.get==='function'))?wrap(r):r;
    };
  }});
}
window.__usage={limit:LIM,day:dayKey,pend:function(){return pend;},flush:flush};
setInterval(flush,120000);
document.addEventListener('visibilitychange',function(){if(document.hidden)flush();});
window.addEventListener('pagehide',flush);

window.claude={use:function(name){
  if(name==='db')return Promise.resolve(fdb);
  if(name==='downloads')return Promise.resolve({save:dl});
  if(name==='user')return Promise.resolve({
    id:function(){return Promise.resolve(fuser?fuser.uid:null);},
    can:function(){return Promise.resolve(true);},
    isOwner:function(){return !CFG.ownerEmail||!!(fuser&&fuser.email&&normMail(fuser.email)===normMail(CFG.ownerEmail));}
  });
  return Promise.resolve(null);
}};
if(!CFG.projectId||!CFG.apiKey||/^여기/.test(CFG.apiKey)){
  showLogin('Firebase 설정이 아직 입력되지 않았습니다. (firebase-config)');$('lgBtn').disabled=true;return;
}
if(typeof firebase==='undefined'){showLogin('Firebase를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 열어 주세요.');$('lgBtn').disabled=true;return;}
firebase.initializeApp(CFG);
/* 폰(브라우저)에 기록을 저장해 두는 설정: 잠깐 끊겼다 다시 이어질 때 바뀐 기록만 받고, 인터넷이 없어도 저장된 기록은 보인다. 지원하지 않는 브라우저는 그냥 지금처럼 동작한다 */
try{var fs0=firebase.firestore();var pp=fs0.enablePersistence({synchronizeTabs:true});if(pp&&pp.catch)pp.catch(function(){});}catch(e){}
var auth=firebase.auth();
auth.onAuthStateChanged(function(u){
  if(u){
    fuser=u;fdb=wrap(firebase.firestore());
    $('login').hidden=true;$('fbOut').hidden=false;$('whoami').textContent=u.email||'';
    if(!started){started=true;if(window.__appInit)window.__appInit();}
  }else{
    if(started){location.reload();return;}
    showLogin('');
  }
});
$('loginForm').addEventListener('submit',function(e){
  e.preventDefault();$('lgBtn').disabled=true;$('lgErr').textContent='';
  auth.signInWithEmailAndPassword($('lgEmail').value.trim(),$('lgPw').value).catch(function(err){showLogin(errKo(err));});
});
$('fbOut').addEventListener('click',function(){auth.signOut();});
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
/* 화면을 옆으로 밀어 탭 넘기기: 왼쪽으로 밀면 다음 탭, 오른쪽으로 밀면 앞 탭.
   그래프·옆으로 스크롤되는 표·입력칸 위에서는 작동하지 않는다 */
(function(){
  var sx=0,sy=0,st=0,ok=false;
  function blocked(el){
    for(var n=el;n&&n!==document.body;n=n.parentElement){
      if(n.id==='gwrap'||n.id==='gsvg'||n.classList&&(n.classList.contains('tabs')||n.classList.contains('gzoom')))return true;
      var tg=n.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return true;
      if(n.scrollWidth>n.clientWidth+4){var ov=getComputedStyle(n).overflowX;if(ov==='auto'||ov==='scroll')return true;}
    }
    return false;
  }
  document.addEventListener('touchstart',function(e){
    ok=false;if(e.touches.length!==1)return;
    var t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();
    ok=!!document.querySelector('.tab')&&!blocked(e.target)&&sx>16&&sx<window.innerWidth-16;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!ok)return;ok=false;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Date.now()-st>800||Math.abs(dx)<80||Math.abs(dy)>Math.abs(dx)*0.5)return;
    var sel=window.getSelection&&String(window.getSelection());if(sel)return;
    var tabs=Array.prototype.filter.call(document.querySelectorAll('.tab'),function(b){return !b.hidden&&b.offsetParent!==null;});
    var i=-1;tabs.forEach(function(b,k){if(b.getAttribute('aria-selected')==='true')i=k;});
    if(i<0)return;
    var j=dx<0?i+1:i-1;if(j<0||j>=tabs.length)return;
    tabs[j].click();
    var v=document.querySelector('main');
    if(v&&v.animate&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))
      v.animate([{transform:'translateX('+(dx<0?40:-40)+'px)',opacity:.4},{transform:'none',opacity:1}],{duration:180,easing:'ease-out'});
  },{passive:true});
})();
})();
</script>
