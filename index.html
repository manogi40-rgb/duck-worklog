<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e6b58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="작업일지">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>오리농장 작업일지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 손으로 쓰는 세로 화면. 위에 입식 제목, 가운데 동별 카드, 아래 고정 탭(입력·기록·평균) */
:root{
  --bg:#eef3f0; --surface:#ffffff; --surface2:#e3ece7; --ink:#14221d; --muted:#586b63; --line:#cbd8d1;
  --accent:#0e6b58; --accent-ink:#ffffff; --warn:#a9650c; --bad:#b4372e; --good:#1f7a3f;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-display:"Do Hyeon","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1614; --surface:#16211e; --surface2:#1f2e2a; --ink:#e4efea; --muted:#93a8a0; --line:#2b3d37;
    --accent:#52c7a8; --accent-ink:#06231b; --warn:#e0a24a; --bad:#f0857c; --good:#6fd08e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211e; --surface2:#1f2e2a; --ink:#e4efea; --muted:#93a8a0; --line:#2b3d37;
  --accent:#52c7a8; --accent-ink:#06231b; --warn:#e0a24a; --bad:#f0857c; --good:#6fd08e; color-scheme:dark;
}
/* 그래프 색: 범주형 1~5번 순서(검증된 팔레트), 외부 센서는 중립색 점선 */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--grid:#e1e0d9;--axis:#c3c2b7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--grid:#2c2c2a;--axis:#383835}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--grid:#2c2c2a;--axis:#383835}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:15px/1.5 var(--font-body);
  padding-block:0 92px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:980px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-direction:column;gap:10px;padding-top:14px;padding-bottom:12px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cyc{display:flex;align-items:baseline;gap:10px;min-width:0;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer}
.cyc-title{font-family:var(--font-display);font-size:clamp(20px,6vw,27px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#newBtn{flex:none;padding:0 9px;font-size:14px}
#newBtn .ico{--is:22px !important;margin-right:3px}
@media (max-width:380px){#newBtn .nt{display:none}#newBtn::before{content:"+";font-size:22px;font-weight:800;margin-right:2px;line-height:1}#newBtn .ico{margin-right:0}}
.cyc-age{font-size:14px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 11px;white-space:nowrap}
.caret{color:var(--muted)}
.notice{margin:0;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.notice.bad{border-color:var(--bad)}

.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pane{display:flex;flex-direction:column;gap:14px}
.pane[hidden]{display:none}
.state{padding:28px 18px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.state h2{margin:0;color:var(--ink);font-family:var(--font-display);font-weight:400;font-size:22px}
.state p{margin:0;max-width:34ch}

.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar input[type=date]{flex:1 1 150px;min-width:0;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:17px}
.datebar .btn{padding:0 14px}
.todobox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tdcol{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tdcol h3{margin:0;font-size:14px;color:var(--muted);font-weight:700}
.tdlist{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.tdi{display:flex;align-items:flex-start;gap:6px;padding:3px 0;font-size:14px}
.tdi input{width:22px;height:22px;flex:none;margin:1px 0 0}
.tdt{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.4}
.tdt small{display:block;color:var(--muted);font-size:11px}
.tdi.done .tdt{text-decoration:line-through;color:var(--muted)}
.tdx{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px;min-height:28px}
.tdadd{display:flex;gap:6px}
.tdadd input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 8px;font-size:15px}
.tdadd .btn{padding:0 10px;min-height:40px}
.envbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0 2px;font-size:15px}
.envbar[hidden],.envh[hidden]{display:none}
.envbar .wx{font-size:20px;font-weight:700}.envbar .wx .ico{margin-right:6px}
.envbar .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.mm{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}.mm b{font-size:18px;font-variant-numeric:tabular-nums}
.envh{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 2px;padding:6px 10px;border-radius:10px;background:var(--bg);font-size:14px}
.tdadd{flex-direction:column}.tdadd input{flex:none;width:100%;box-sizing:border-box}.tdadd .btn{width:100%}
.tdempty{color:var(--muted);font-size:13px}
.rotd{fill:var(--surface);stroke-width:2.5;pointer-events:none}
.tdhist[hidden]{display:none}
.tdbar{display:flex;justify-content:flex-end;margin-top:6px}
.tdbar .btn{min-height:36px;font-size:14px;padding:0 12px}
.tdhist{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;margin-top:6px;display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto}
.tdhist .tdi .tdt{text-decoration:line-through;color:var(--muted)}
.tdhist .tdt small{text-decoration:none}
.tdundo{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font-size:12px;padding:4px 8px;white-space:nowrap}
.sumline{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted)}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}

.houses{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.house{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.house-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.house-head h3{margin:0;line-height:1}
.house-head .hn{display:inline-block;font-family:var(--font-display);font-weight:800;font-size:42px;line-height:1.05;border-left:12px solid var(--hc,var(--accent));padding-left:10px;letter-spacing:-.5px}
.house-now{text-align:right;color:var(--muted);font-size:13px;line-height:1.3}
.house-now b{display:block;font-family:var(--font-display);font-weight:400;font-size:25px;color:var(--ink);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-label{display:flex;flex-direction:column;min-width:0}
.row-label span{font-weight:700;display:inline-flex;align-items:center;gap:6px}
.row-label .ico{--is:30px}
.row-label small{color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:flex;gap:6px;flex:0 0 auto}
.qin,.tin,.hin,.kin,.memo,.wfield input,.nfield input{border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:18px;padding:0 12px}
.qin{width:112px;height:46px;text-align:right;font-variant-numeric:tabular-nums}
.sign{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.sign.neg{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.temps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.temps label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.tl{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.tl .ico{--is:24px}
.tin,.hin{width:100%;height:46px;text-align:right;font-variant-numeric:tabular-nums}
.hums{margin-top:8px}
.works{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:10px 0 4px}
.ftrow{display:flex;gap:16px;flex-wrap:wrap;padding:0 0 2px}
.ftsum{color:var(--muted);font-size:13px;padding:0 0 6px}
.ck{display:flex;align-items:center;gap:8px;min-height:44px;font-size:16px}
.ck input{width:24px;height:24px;margin:0}
.hkl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.kin{width:96px;height:44px;text-align:right;font-variant-numeric:tabular-nums}
.kin:disabled{opacity:.45}
.memo{width:100%;min-height:68px;padding:10px 12px;resize:vertical;font-size:16px;line-height:1.45}
.memo-label{font-size:13px;color:var(--muted);margin-bottom:-6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.chip.neg{color:var(--bad)}
.chip small{color:var(--muted)}
.chip button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.wide{grid-column:1/-1}
.wfield{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.wfield span{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.wfield input{width:130px;height:46px;text-align:right;font-variant-numeric:tabular-nums}
.hint,.state p{white-space:pre-wrap;overflow-wrap:anywhere}
.hint{margin:0;color:var(--muted);font-size:13px}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:420px}
.tbl th,.tbl td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:13px;color:var(--muted);font-weight:500}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl td.memo-row{white-space:normal;text-align:left;color:var(--muted);font-size:13px;padding-top:0}
.datebtn{background:none;border:0;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;line-height:1.25;font-weight:700;color:var(--accent)}
.datebtn small{color:var(--muted);font-weight:400}
.bad{color:var(--bad)}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* 그림(아이콘): 배경이 투명한 작은 그림을 글자 옆에 쓴다 */

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
var AREAS=[253,363,363,416,140];            /* 동별 면적: 배분 계산에만 사용, 화면에는 표시하지 않음 */
var SUM=AREAS.reduce(function(a,b){return a+b;},0);
var SERVICE=0.02;
var HOUSES=[1,2,3,4,5];
var FT=[{k:'crumble',label:'크럼블'},{k:'early',label:'전기'},{k:'late',label:'후기'}];
function ftLabel(k){var o=FT.filter(function(x){return x.k===k;})[0];return o?o.label:'';}
function ftKey(k){return ftLabel(k)?k:'none';}
var TYPES=[{k:'cull',label:'도태',int:true},{k:'dead',label:'폐사',int:true},{k:'feed',label:'사료 입고',int:false}];
var FIELDS=[{f:'tm',w:'tm',label:'아침'},{f:'tn',w:'tn',label:'점심'},{f:'te',w:'te',label:'저녁'}];
var HFIELDS=[{f:'hm',w:'tm',label:'아침'},{f:'hn',w:'tn',label:'점심'},{f:'he',w:'te',label:'저녁'}];
var ALLF=FIELDS.concat(HFIELDS);
function fieldsFor(m){return m==='humi'?HFIELDS:FIELDS;}
function isEnv(m){return m==='temp'||m==='humi';}

function $(id){return document.getElementById(id);}
function fmt(n,d){return Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d||0,minimumFractionDigits:d||0});}
function fmtN(n){return fmt(n,Number.isInteger(Math.round(n*10)/10)&&Math.abs(n-Math.round(n))<0.05?0:1);}
function fmtT(v){return v==null?'–':v.toFixed(1);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function isNum(v){return typeof v==='number'&&isFinite(v);}
function mean(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
function todayStr(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});}
function dayNum(s){var p=s.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/86400000);}
function addDays(s,n){return new Date((dayNum(s)+n)*86400000).toISOString().slice(0,10);}
function dot(s){return s.replace(/-/g,'.');}
function ageOf(c,d){return dayNum(d)-dayNum(c.stockDate)+1;}

var S={db:null,user:null,uid:null,canWrite:true,cycles:[],ready:false,cid:null,date:todayStr(),tab:'home',editId:null,delId:null,restore:null,dl:null,settings:null,imp:null,stale:false,cyclesDef:false,sync:{e:true,d:true},g:{ship:{},shipPending:{},mode:'house',metric:'temp',win:'all',cum:false,off:{},table:false,scope:'all',sel:[],color:{},cache:{},pending:{},selInit:false},
  entries:new Map(),days:new Map(),filter:'all',unsubs:[],inKey:null,avgKey:null,status:'저장소 연결 중…',step:'start',dbg:{}};
var VER='v14';
function dbgTxt(){var d=S.dbg,k,o=[VER];for(k in d)o.push(k+':'+d[k]);return o.join(' · ');}

function cyc(){for(var i=0;i<S.cycles.length;i++){if(S.cycles[i].id===S.cid)return S.cycles[i];}return null;}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

var toastTimer=null;
function IC(k,sz){return '<span class="ico i-'+k+'" aria-hidden="true"'+(sz?' style="--is:'+sz+'px"':'')+'></span>';}
function EM(ch){return '<span class="em" aria-hidden="true">'+ch+'</span>';}
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},1600);}
function notice(msg,bad){var n=$('notice');if(!msg){n.hidden=true;return;}n.textContent=msg;n.className='notice'+(bad?' bad':'');n.hidden=false;}
function handleErr(e){
  var code=e&&e.code;
  if(code==='invalid_argument'||code==='permission-denied'){S.canWrite=false;notice('이 계정으로는 입력할 수 없습니다. 관리자에게 계정 등록을 요청하세요.',true);updateRO();}
  else if(code==='quota_exceeded'){notice('저장 공간이 가득 찼습니다. 지난 입식 기록을 삭제한 뒤 다시 시도하세요.',true);}
  else if(code==='revoked'){notice('접근 권한이 바뀌어 더 이상 저장할 수 없습니다.',true);}
  else{toast('저장하지 못했습니다. 다시 시도하세요.');}
}

/* ---------- 입식 배분: 총 마릿수 × 1.02 를 동 면적 비례로 나눔 ---------- */
function allocate(total){
  var target=Math.round(total*(1+SERVICE));
  var raw=AREAS.map(function(a){return target*a/SUM;});
  var fl=raw.map(Math.floor);
  var rem=target-fl.reduce(function(a,b){return a+b;},0);
  var order=raw.map(function(r,i){return [r-fl[i],i];}).sort(function(a,b){return b[0]-a[0];});
  for(var k=0;k<rem;k++){fl[order[k][1]]++;}
  return fl;
}

/* ---------- 집계 ---------- */
function agg(){
  var out={tot:{},byDate:{},dates:new Set(),ft:{crumble:0,early:0,late:0,none:0}};
  HOUSES.forEach(function(h){out.tot[h]={cull:0,dead:0,feed:0};});
  S.entries.forEach(function(e){
    var h=e.h;if(!out.tot[h])return;var q=Number(e.q)||0;
    out.tot[h][e.t]+=q;
    if(e.t==='feed')out.ft[ftKey(e.ft)]+=q;
    var d=out.byDate[e.d]||(out.byDate[e.d]={});
    var x=d[h]||(d[h]={cull:0,dead:0,feed:0});x[e.t]+=q;out.dates.add(e.d);
  });
  S.days.forEach(function(v){if(v&&v.d)out.dates.add(v.d);});
  return out;
}
function dayDoc(cid,d,h){return S.days.get(cid+'_'+d+'_'+h)||null;}
function headsOf(c,h){return Number(c.heads&&c.heads[h])||0;}

/* ---------- 구독 ---------- */
function subscribeCycle(cid){
  S.unsubs.forEach(function(u){try{u();}catch(e){}});S.unsubs=[];
  S.entries=new Map();S.days=new Map();S.inKey=null;S.avgKey=null;S.settle=null;S.stKey=null;
  S.sync={e:false,d:false};
  if(!cid||!S.db)return;
  var onErr=function(e){handleErr(e);};
  /* 아직 확정되지 않은 빈 결과는 무시하고, 확정된 결과만 화면에 반영한다 */
  var apply=function(key,store){return function(s2){
    if(cid!==S.cid)return;
    if(s2.empty&&s2.metadata&&s2.metadata.fromCache)return;
    var m=new Map();s2.docs.forEach(function(d){m.set(d.id,d.data());});
    S[store]=m;S.sync[key]=true;render();
  };};
  var onE=apply('e','entries'),onD=apply('d','days');
  S.unsubs.push(S.db.collection('entries').where('c','==',cid).onSnapshot(onE,onErr));
  S.unsubs.push(S.db.collection('days').where('c','==',cid).onSnapshot(onD,onErr));
  var onS=function(sn){
    if(cid!==S.cid)return;
    if(!sn.exists&&sn.metadata&&sn.metadata.fromCache)return;
    S.settle=sn.exists?Object.assign({},sn.data()):null;
    if(S.tab==='settle')refreshSettle();
  };
  if(isOwner()){S.unsubs.push(S.db.doc('settle/'+cid).onSnapshot(onS,onErr));
  S.db.doc('settle/'+cid).get().then(onS).catch(function(){});}
  S.db.collection('entries').where('c','==',cid).get().then(onE).catch(function(){});
  S.db.collection('days').where('c','==',cid).get().then(onD).catch(function(){});
}
function selectCycle(cid){
  S.cid=cid;if(cid)lsSet('wl-cid',cid);
  subscribeCycle(cid);render();
}
function onCycles(snap,fromGet){
  /* 확정되지 않은 빈 목록은 "입식 없음"으로 보여주지 않는다
     (단, get() 으로 두 번 연속 비어 있다고 확인되면 정말 비어 있는 것) */
  if(snap.empty&&snap.metadata&&snap.metadata.fromCache){
    if(fromGet){S.emptyGets=(S.emptyGets||0)+1;}
    if(!(fromGet&&S.emptyGets>=2))return;
  }
  S.cycles=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;}).sort(function(a,b){return String(b.stockDate).localeCompare(String(a.stockDate));});
  S.ready=true;S.stale=false;S.cyclesDef=true;
  if(!isOwner()&&S.cycles.length&&S.cycles[0].id!==S.cid){selectCycle(S.cycles[0].id);}
  try{lsSet('wl-cyc',JSON.stringify(S.cycles.slice(0,30)));}catch(e){}
  if(!cyc()){
    var pref=lsGet('wl-cid');var next=null;
    for(var i=0;i<S.cycles.length;i++){if(S.cycles[i].id===pref){next=pref;break;}}
    if(!next&&S.cycles.length)next=S.cycles[0].id;
    selectCycle(next);
  }else{
    if(S.cid&&S.db&&!S.unsubs.length)subscribeCycle(S.cid);
    render();
  }
}
/* 입식 목록 색인: 컬렉션 조회가 응답하지 않는 기기에서도 문서 단위 읽기로 목록을 복구한다 */
function idxChange(fn){
  if(!S.db)return Promise.resolve();
  return S.db.doc('settings/index').get().then(function(sn){
    var ids=(sn.exists&&sn.data().ids)||[];ids=ids.slice();
    var next=fn(ids);
    return S.db.doc('settings/index').set({ids:next,updatedAt:Date.now()});
  }).catch(function(){});
}
function idxAdd(id){return idxChange(function(ids){if(ids.indexOf(id)<0)ids.push(id);return ids;});}
function idxDel(id){return idxChange(function(ids){return ids.filter(function(x){return x!==id;});});}
function loadIndex(){
  if(!S.db||S.cyclesDef)return;
  withTimeout(S.db.doc('settings/index').get(),8000).then(function(sn){
    if(sn===TO){S.dbg.색인='시간초과';return;}
    if(S.cyclesDef)return;
    if(!sn.exists){S.dbg.색인='없음';return;}
    var ids=sn.data().ids||[];S.dbg.색인=ids.length+'건';if(!ids.length)return;
    return Promise.all(ids.map(function(id){
      return withTimeout(S.db.doc('cycles/'+id).get(),8000).then(function(d){
        if(d===TO){S.dbg.문서='시간초과';return null;}if(!d.exists){S.dbg.문서='없음';return null;}var o=Object.assign({},d.data());o.id=d.id;return o;
      }).catch(function(){return null;});
    })).then(function(list){
      list=list.filter(Boolean);
      if(S.cyclesDef||!list.length)return;
      onCycles({empty:false,metadata:{fromCache:false},docs:list.map(function(o){var id=o.id;return {id:id,data:function(){var c=Object.assign({},o);delete c.id;return c;}};})},false);
    });
  }).catch(function(e){S.dbg.색인='오류 '+((e&&(e.code||e.message))||'?');});
}
function loadCycles(n){
  if(S.cyclesDef||!S.db)return;
  loadIndex();
  withTimeout(S.db.collection('cycles').get(),8000)
    .then(function(snap){if(snap===TO){S.dbg.목록='시간초과';}else{S.dbg.목록=snap.docs.length+'건'+(snap.metadata&&snap.metadata.fromCache?'(캐시)':'');onCycles(snap,true);}})
    .catch(function(e){S.dbg.목록='오류 '+((e&&(e.code||e.message))||'?');handleErr(e);})
    .then(function(){
      if(S.cyclesDef)return;
      if(n<10)setTimeout(function(){loadCycles(n+1);},4000);
      else if(!S.ready){S.status='저장소에 연결하지 못했습니다. 인터넷 연결을 확인하고 화면을 새로고침하세요.';render();}
    });
}

var chain={},pend={},stamp={};
function saveDayField(h,f,val){
  if(!S.db||!S.cid||!S.canWrite)return;
  if(overAge()){toast('7주령(49일령)까지만 입력할 수 있습니다');return;}
  var date=S.date,cid=S.cid,key=cid+'_'+date+'_'+h;
  var base=Object.assign({c:cid,d:date,h:h},S.days.get(key)||{},pend[key]||{});

  var n=(stamp[key]=(stamp[key]||0)+1);

    .then(function(){if(stamp[key]===n)delete pend[key];toast('저장됨');})
    .catch(function(e){handleErr(e);});
}

var TD_KEEP=12*3600000; /* 완료 후 목록에 남는 시간: 12시간 */
var TODO_SIDES=[{k:'o2s',label:'사장 → 직원',em:'👔'},{k:'s2o',label:'직원 → 사장',em:'👷'}];
function todoMine(side){return isOwner()?side==='o2s':side==='s2o';}
function todoShell(){

  }).join('')+'</div><div class="tdbar"><button type="button" class="btn" data-act="td-hist" id="tdHistBtn">'+EM('✅')+'완료한 메모 보기</button></div><div class="tdhist" id="tdHist" hidden></div></div>';

function tdDate(ms){var d=new Date(ms);return (d.getMonth()+1)+'.'+d.getDate();}
function renderTodos(){
  var list=S.todos||[],now=Date.now();
  TODO_SIDES.forEach(function(sd){
    var box=document.querySelector('[data-tdlist="'+sd.k+'"]');if(!box)return;
    var mine=todoMine(sd.k),items=list.filter(function(t){return t.side===sd.k&&(!t.done||(t.doneAt&&now-t.doneAt<TD_KEEP));});
    items.sort(function(a,b){
      if(!!a.done!==!!b.done)return a.done?1:-1;
      return a.done?(b.doneAt||0)-(a.doneAt||0):(b.at||0)-(a.at||0);
    });
    box.innerHTML=items.length?items.map(function(t){
      return '<div class="tdi'+(t.done?' done':'')+'"><input type="checkbox" data-td="'+esc(t.id)+'"'+(t.done?' checked':'')+' aria-label="완료 체크">'+

        ((mine||isOwner())?'<button type="button" class="tdx" data-act="td-del" data-id="'+esc(t.id)+'" aria-label="메모 삭제">×</button>':'')+'</div>';
    }).join(''):'<div class="tdempty">메모 없음</div>';
  });

function mergeTodos(){
  var m=new Map();
  [S.todosU,S.todosR].forEach(function(mp){if(mp)mp.forEach(function(v,k){m.set(k,v);});});
  S.todos=Array.from(m.values());renderTodos();
}
function tdMap(sn){var m=new Map();sn.docs.forEach(function(d){var o=Object.assign({},d.data());o.id=d.id;m.set(d.id,o);});return m;}
function startTodos(){
  if(S.todoOn||!S.db)return;S.todoOn=true;S.todos=[];
  setInterval(renderTodos,5*60000); /* 켜 둔 채로도 12시간이 지나면 목록에서 빠지게 */
  /* 미완료 메모 + 완료 후 12시간 이내 메모만 불러온다(그보다 오래된 완료 메모는 '완료한 메모 보기'에서) */
  S.db.collection('todos').where('done','==',false).onSnapshot(function(sn){
    if(sn.empty&&sn.metadata&&sn.metadata.fromCache)return;
    S.todosU=tdMap(sn);mergeTodos();
  },function(e){});
  S.db.collection('todos').where('doneAt','>',Date.now()-TD_KEEP).onSnapshot(function(sn){
    if(sn.empty&&sn.metadata&&sn.metadata.fromCache)return;
    S.todosR=tdMap(sn);mergeTodos();
  },function(e){});
}
function addTodo(side){

function toggleTodo(id,v){

  S.db.doc('todos/'+id).update({done:!!v,doneAt:v?Date.now():null,doneBy:isOwner()?'owner':'staff'}).catch(handleErr);

/* ---- 그날 날씨 · 당일 최고/최저 온습도 (표시 전용)
   다른 프로그램(농장관리앱, 라즈베리파이 등)이 env/{YYYY-MM-DD} 문서에 아래 모양으로 넣어 주면 입력 탭에 나타난다.
   {wx:'clear|partly|cloudy|rain|shower|snow|fog|storm|wind' 또는 '자유 글씨', out:{tmax,tmin,hmax,hmin}, 1:{tmax,tmin,hmax,hmin}, … 5:{…}}  (모두 선택, 있는 것만 표시) */
var WX={clear:['☀️','맑음'],partly:['⛅','구름 조금'],cloudy:['☁️','흐림'],rain:['🌧️','비'],shower:['🌦️','소나기'],snow:['❄️','눈'],fog:['🌫️','안개'],storm:['⛈️','뇌우'],wind:['💨','바람 강함']};
function envNum(v,d){return (typeof v==='number'&&isFinite(v))?v.toFixed(d):null;}
function envMM(o){
  if(!o)return '';
  var tx=envNum(o.tmax,1),tn=envNum(o.tmin,1),hx=envNum(o.hmax,0),hn=envNum(o.hmin,0),out='';
  if(tx!=null||tn!=null)out+='<span class="mm">'+IC('temp',26)+'<span>최고 <b>'+(tx==null?'–':tx)+'</b>℃</span><span>최저 <b>'+(tn==null?'–':tn)+'</b>℃</span></span>';
  if(hx!=null||hn!=null)out+='<span class="mm">'+IC('humi',26)+'<span>최고 <b>'+(hx==null?'–':hx)+'</b>%</span><span>최저 <b>'+(hn==null?'–':hn)+'</b>%</span></span>';
  return out;
}
function renderEnv(){
  var rec=(S.env||{})[S.date],D=rec&&rec.data,bar=$('envBar');
  if(bar){
    var w='';
    if(D&&D.wx){var k=WX[D.wx];w=k?'<span class="wx">'+k[0]+' '+k[1]+'</span>':'<span class="wx">'+IC('weather',30)+esc(String(D.wx))+'</span>';}
    var o=D&&D.out?envMM(D.out):'';
    if(w||o){bar.innerHTML=w+(o?'<span class="lbl">외부</span>'+o:'');bar.hidden=false;}else{bar.innerHTML='';bar.hidden=true;}
  }
  document.querySelectorAll('[data-envh]').forEach(function(el){
    var x=D&&D[el.dataset.envh],h=x&&typeof x==='object'?envMM(x):'';
    if(h){el.innerHTML=h;el.hidden=false;}else{el.innerHTML='';el.hidden=true;}
  });
}
function loadEnv(force){
  var d=S.date;if(!S.db||!d)return;
  S.env=S.env||{};var r=S.env[d];
  if(!force&&r&&Date.now()-r.at<600000){return;}

    S.env[d]={at:Date.now(),data:sn&&sn.exists?Object.assign({},sn.data()):null};

    });

    var dd=dayDoc(S.cid,S.date,h)||{};

    card.querySelector('[data-chips]').innerHTML=list.map(function(x){
      var lab=TYPES.filter(function(t){return t.k===x.e.t;})[0];
      var q=Number(x.e.q)||0;

      return '<span class="chip'+(q<0?' neg':'')+'">'+esc(lab?lab.label:x.e.t)+(x.e.t==='feed'&&ftLabel(x.e.ft)?'('+ftLabel(x.e.ft)+')':'')+' '+(q>0?'+':'')+fmtN(q)+'<small>'+tm+'</small>'+

  $('sumline').innerHTML='<span class="hint">입력은 '+MAXAGE+'일령(7주령, '+dot(maxDateOf(c))+')까지</span><span>전체 '+dot(S.date)+' 기준 <b>'+fmt(nowAll)+'</b>수 / 입식 '+fmt(initAll)+'수</span>'+
    '<span>오늘 도태 <b>'+fmtN(tdC)+'</b></span><span>폐사 <b>'+fmtN(tdD)+'</b></span><span>사료 <b>'+fmtN(tdF)+'</b> kg</span>'+

/* 작업(로터리·왕겨) 집계 */
function workTally(hs){
  var o={rot:0,hk:0,kg:0,by:{}};
  S.days.forEach(function(dd){
    if(!dd||dd.h===0||hs.indexOf(dd.h)<0)return;
    var b=o.by[dd.h]||(o.by[dd.h]={rot:0,hk:0,kg:0});
    if(dd.rot===true){o.rot++;b.rot++;}
    if(dd.hk===true){o.hk++;b.hk++;var k=Number(dd.hkg)||0;o.kg+=k;b.kg+=k;}
  });
  return o;
}
function workText(dd){
  if(!dd)return '';
  var a=[];if(dd.rot===true)a.push('로터리');
  if(dd.hk===true)a.push('왕겨'+(Number(dd.hkg)>0?' '+fmtN(Number(dd.hkg))+'kg':''));
  return a.join(', ');
}

function weekHTML(c,A){
  var hs=selHouses();
  var maxAge=Math.max(1,ageOf(c,todayStr()));
  A.dates.forEach(function(d){var a=ageOf(c,d);if(a>=1)maxAge=Math.max(maxAge,a);});
  var nW=Math.min(7,Math.ceil(maxAge/7));
  var rows=[];
  for(var wk=1;wk<=nW;wk++){
    var lo=(wk-1)*7+1,hi=wk*7,cull=0,dead=0,feed=0,has=false,T={tm:[],tn:[],te:[],hm:[],hn:[],he:[]};
    A.dates.forEach(function(d){
      var a=ageOf(c,d);if(a<lo||a>hi)return;
      hs.forEach(function(h){
        var x=(A.byDate[d]||{})[h];if(x){cull+=x.cull;dead+=x.dead;feed+=x.feed;has=true;}
        var dd=dayDoc(S.cid,d,h);
        if(dd)ALLF.forEach(function(f){if(isNum(dd[f.f])){T[f.f].push(dd[f.f]);has=true;}});
      });
    });
    rows.push('<tr><td>'+wk+'주차<br><small class="hint">'+lo+'~'+hi+'일령</small></td>'+
      (has?'<td>'+fmtN(cull)+'</td><td>'+fmtN(dead)+'</td><td><b>'+fmtN(cull+dead)+'</b></td><td>'+fmtN(feed)+'</td><td>'+fmtT(mean(T.tm))+' · '+fmtT(mean(T.tn))+' · '+fmtT(mean(T.te))+'</td><td>'+fmtT(mean(T.hm))+' · '+fmtT(mean(T.hn))+' · '+fmtT(mean(T.he))+'</td>':'<td>–</td><td>–</td><td>–</td><td>–</td><td>–</td><td>–</td>')+'</tr>');
  }
  return '<table class="tbl"><thead><tr><th>'+IC('calendar')+'주차</th><th>'+IC('cull')+'도태</th><th>'+IC('dead')+'폐사</th><th>'+IC('cull')+'합산</th><th>'+IC('feed')+'사료 입고(kg)</th><th>'+IC('temp')+'온도 평균 아·점·저</th><th>'+IC('humi')+'습도 평균</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>';
}

function renderNMonths(){
  var tb=$('nMon'),dt=$('nDate');if(!tb||!dt)return;
  var cur=readNMonths(),d=dt.value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){tb.innerHTML='';return;}
  var mk=monthKeys({stockDate:d});
  tb.innerHTML=mk.map(function(k){
    return '<tr><td>'+Number(k.slice(5,7))+'월<small>'+dimOf(k)+'일</small></td>'+
      '<td><input class="sfld sm" type="text" inputmode="decimal" autocomplete="off" data-nm="fuel:'+k+'" placeholder="0" aria-label="'+k+' 연료 보조금"></td>'+
      '<td><input class="sfld sm" type="text" inputmode="decimal" autocomplete="off" data-nm="litter:'+k+'" placeholder="0" aria-label="'+k+' 깔짚 보조금"></td></tr>';
  }).join('');
  Object.keys(cur).forEach(function(key){var el=tb.querySelector('[data-nm="'+key+'"]');if(el&&cur[key]!=='')el.value=cur[key];});
}
function readTerms(){
  var out={},bad=false;
  var one=function(id,k){var v=numOrNull($(id).value);if(v!==null&&(!isFinite(v)||v<0)){bad=true;return;}if(v!==null)out[k]=v;};
  one('nLive','live');one('nChick','chick');one('nFeed','feed');one('nFeedLate','feedLate');one('nEco','eco');one('nOther','otherSub');
  var fu={},li={};
  document.querySelectorAll('#nMon [data-nm]').forEach(function(e){
    var m=e.dataset.nm.split(':'),v=numOrNull(e.value);
    if(v!==null&&(!isFinite(v)||v<0)){bad=true;return;}
    if(v!==null)(m[0]==='fuel'?fu:li)[m[1]]=v;
  });
  if(Object.keys(fu).length)out.fuel=fu;if(Object.keys(li).length)out.litter=li;
  return {terms:out,bad:bad};
}
function clearTerms(){
  ['nLive','nChick','nFeed','nFeedLate','nEco','nOther'].forEach(function(id){var e=$(id);if(e)e.value='';});
  var tb=$('nMon');if(tb)tb.innerHTML='';renderNMonths();
}
function fillTerms(t){
  t=t||{};
  [['nLive','live'],['nChick','chick'],['nFeed','feed'],['nFeedLate','feedLate'],['nEco','eco'],['nOther','otherSub']].forEach(function(x){var e=$(x[0]);if(e)e.value=isNum(t[x[1]])?String(t[x[1]]):'';});
  renderNMonths();
  ['fuel','litter'].forEach(function(f){
    var m=t[f]||{};Object.keys(m).forEach(function(k){var e=document.querySelector('#nMon [data-nm="'+f+':'+k+'"]');if(e&&isNum(m[k]))e.value=String(m[k]);});
  });
}
var DEF_KEYS=[['nLive','live'],['nChick','chick'],['nFeed','feed'],['nFeedLate','feedLate'],['nEco','eco'],['nOther','otherSub']];
function fillFrom(t){
  DEF_KEYS.forEach(function(x){var e=$(x[0]);if(e&&e.value===''&&isNum(t[x[1]]))e.value=String(t[x[1]]);});
}
async function prefillTerms(){
  if(!S.db||S.editId||!isOwner()||!S.defsLoaded)return;
  if(S.defs&&DEF_KEYS.some(function(x){return isNum(S.defs[x[1]]);})){fillFrom(S.defs);return;}
  try{
    var r=await S.db.collection('settle').get(),best=null;
    r.docs.forEach(function(d){
      var x=d.data();if(!x||!x.terms)return;
      var oc=cycleById(d.id),sd=oc?oc.stockDate:'';
      if(!best||sd>best.sd)best={sd:sd,t:x.terms};
    });
    if(!best||S.editId)return;
    fillFrom(best.t);
  }catch(e){}
}
async function saveTermsFor(cid,terms){
  var sn=await S.db.doc('settle/'+cid).get();
  var d=sn.exists?Object.assign({},sn.data()):{};
  d.c=cid;d.terms=terms;
  await S.db.doc('settle/'+cid).set(d);
}

var QUOTA=50000;
function refreshUsage(){
  var U=window.__usage;if(!S.db||!U)return;
  S.db.doc('usage/'+U.day()).get().then(function(sn){
    var d=sn.exists?sn.data():{};
    S.usage={day:U.day(),total:Number(d.total)||0,by:d.by||{}};renderUsage();
  }).catch(function(){});
}
function renderUsage(){
  var U=window.__usage,u=S.usage;if(!U||!u)return;
  var pend=U.pend(),tot=(u.day===U.day()?u.total:0)+pend,pct=tot/QUOTA*100,hot=pct>=90;
  var qn=$('quotaNote');
  if(qn){
    if(hot){qn.textContent=(pct>=100?'오늘 읽기 한도(5만 건)를 넘긴 것으로 추정됩니다':'오늘 읽기 한도의 90%를 넘었습니다')+' (약 '+fmt(Math.round(tot))+' / '+fmt(QUOTA)+'). 한도를 넘으면 한국 시간 오후 5시경 초기화될 때까지 기록을 불러오지 못할 수 있으니 새로고침·입식 비교를 줄여 주세요.';qn.hidden=false;}
    else qn.hidden=true;
  }
  var box=$('usageBox');if(!box)return;
  if(!isOwner()){box.hidden=true;return;}
  var by=u.by||{},ow=Number(by.owner)||0,st=Number(by.staff)||0;
  box.hidden=false;
  box.innerHTML='<h2>'+IC('stats')+'오늘 읽기 사용량 <span class="hint">(추정)</span></h2>'+
    '<div style="height:10px;border-radius:6px;background:var(--line);overflow:hidden"><div style="height:100%;width:'+Math.min(100,pct).toFixed(1)+'%;background:'+(hot?'var(--bad)':'var(--accent)')+'"></div></div>'+
    '<div><b>약 '+fmt(Math.round(tot))+'</b> / '+fmt(QUOTA)+' 건 ('+pct.toFixed(1)+'%)</div>'+
    '<p class="hint" style="margin:0">사장님 '+fmt(ow)+' · 직원 '+fmt(st)+' · 아직 올리지 않은 이 기기분 '+fmt(pend)+'</p>'+
    '<p class="hint" style="margin:0">모든 기기가 읽은 기록 수를 합친 추정값이며, 한국 시간 오후 5시경 0부터 다시 시작합니다. 90%를 넘으면 맨 위에 경고가 뜹니다. 정확한 값은 Firebase 콘솔의 사용량 탭에서 확인하세요.</p>';

function saveCycle(){
  var err=$('nErr'),date=$('nDate').value,t=parseTotal(),btn=$('nSave'),note=($('nNote').value||'').trim();
  err.hidden=true;
  if(!date){err.textContent='입식일을 선택하세요.';err.hidden=false;return;}
  if(!isFinite(t)||t<100){err.textContent='총 마릿수를 숫자로 입력하세요. 예: 25000';err.hidden=false;return;}
  if(!S.db){err.textContent='저장소에 연결되지 않았습니다. 인터넷 연결을 확인하세요.';err.hidden=false;return;}
  var tr=readTerms();if(tr.bad){err.textContent='정산 단가는 0 이상의 숫자로 입력하세요.';err.hidden=false;return;}
  if(S.editId){
    var old=cycleById(S.editId);if(!old){cancelEdit();return;}
    var patch={stockDate:date,note:note};
    if(t!==Number(old.total)){var al=allocate(t),hh={};al.forEach(function(n,i){hh[i+1]=n;});patch.total=t;patch.heads=hh;}
    btn.disabled=true;
    var eid=S.editId,wt=S.termsReady;
    S.db.doc('cycles/'+eid).update(patch)
      .then(function(){return wt?saveTermsFor(eid,tr.terms):null;})
      .then(function(){toast('수정됨');cancelEdit();})
      .catch(function(e){err.textContent='수정하지 못했습니다. 권한을 확인하고 다시 시도하세요.';err.hidden=false;handleErr(e);})
      .then(function(){btn.disabled=!S.canWrite;});
    return;
  }
  var id=date.replace(/-/g,'')+'_'+t;
  if(cycleById(id)){err.textContent='같은 입식일과 마릿수의 기록이 이미 있습니다.';err.hidden=false;return;}
  var a=allocate(t),heads={};a.forEach(function(n,i){heads[i+1]=n;});
  btn.disabled=true;
  S.db.doc('cycles/'+id).get().then(function(sn){
    if(sn.exists)throw {code:'dup'};
    return S.db.doc('cycles/'+id).set({stockDate:date,total:t,heads:heads,note:note,serviceRate:SERVICE,expectedWeight:null,createdAt:Date.now()})
      .then(function(){
        if(isOwner()){
          var dd=Object.assign({},S.defs||{});
          DEF_KEYS.forEach(function(x){if(isNum(tr.terms[x[1]]))dd[x[1]]=tr.terms[x[1]];});
          dd.updatedAt=Date.now();S.defs=dd;
          S.db.doc('settings/defaults').set(dd).catch(function(){});
        }
      })
      .then(function(){return isOwner()&&Object.keys(tr.terms).length?S.db.doc('settle/'+id).set({c:id,terms:tr.terms}):null;});
  })
    .then(function(){
      idxAdd(id);S.ready=true;
      $('nTotal').value='';$('nNote').value='';updatePrev();clearTerms();S.prefilled=false;S.date=date>todayStr()?date:todayStr();
      if(!cycleById(id)){S.cycles.unshift({id:id,stockDate:date,total:t,heads:heads,note:note});}
      S.tab='input';selectCycle(id);window.scrollTo(0,0);toast('입식 등록됨');
    })
    .catch(function(e){
      if(e&&e.code==='dup'){err.textContent='같은 입식일과 마릿수의 입식이 이미 등록되어 있습니다. 목록에서 선택하세요.';err.hidden=false;return;}
      err.textContent='등록하지 못했습니다. 권한을 확인하고 다시 시도하세요.';err.hidden=false;handleErr(e);
    })
    .then(function(){btn.disabled=!S.canWrite;});
}
async function runChunks(items,fn,size,onProg){
  for(var i=0;i<items.length;i+=size){
    await Promise.all(items.slice(i,i+size).map(fn));
    if(onProg)onProg(Math.min(i+size,items.length),items.length);
  }
}
async function deleteCycle(cid){
  if(!cid||!S.db)return;
  try{
    toast('삭제하는 중…');
    var r=await Promise.all([S.db.collection('entries').where('c','==',cid).get(),S.db.collection('days').where('c','==',cid).get()]);
    await runChunks(r[0].docs,function(d){return S.db.doc('entries/'+d.id).delete();},8);
    await runChunks(r[1].docs,function(d){return S.db.doc('days/'+d.id).delete();},8);
    try{await S.db.doc('settle/'+cid).delete();}catch(e){}
    await S.db.doc('cycles/'+cid).delete();
    idxDel(cid);
    S.delId=null;
    if(cid===S.cid){lsSet('wl-cid','');S.cycles=S.cycles.filter(function(c){return c.id!==cid;});selectCycle(S.cycles.length?S.cycles[0].id:null);}
    toast('삭제됨');
  }catch(e){handleErr(e);}
  render();
}
/* 출하 백업: 출하 마릿수·중량이 입력되면 그 시점에 한 번만 저장소에 파일로 남긴다 (예전 일령별 백업은 있으면 목록에만 표시) */
var BK_AGES=[7,14,21,28,35,42];
function bkDate(c,age){return isoDay(dayNum(c.stockDate)+age-1);}
function bkJson(c,asOf){
  var cy=Object.assign({},c);delete cy.id;cy.id=c.id;
  var ents=[],days=[];
  S.entries.forEach(function(d,id){if(d&&String(d.d)<=asOf)ents.push({id:id,data:Object.assign({},d)});});
  S.days.forEach(function(d,id){if(d&&String(d.d)<=asOf)days.push({id:id,data:Object.assign({},d)});});
  return JSON.stringify({app:'duck-worklog',version:1,exportedAt:new Date().toISOString(),asOf:asOf,cycle:cy,settle:S.settle||null,entries:ents,days:days},null,1);
}
async function cleanLegacyBackups(){
  if(!S.db||!isOwner()||!S.canWrite)return;
  var n=0;
  try{
    for(var i=0;i<S.cycles.length;i++){
      for(var j=0;j<BK_AGES.length;j++){
        var ref=S.db.doc('backups/'+S.cycles[i].id+'_'+BK_AGES[j]);
        var sn=await withTimeout(ref.get(),8000);
        if(sn!==TO&&sn.exists){await ref.delete();n++;}
      }
    }
  }catch(e){S.bkClean=false;return;}

/* ---------- 정산 ---------- */
var MAXAGE=49;
function maxDateOf(c){return addDays(c.stockDate,MAXAGE-1);}
function overAge(){var c=cyc();return !!(c&&ageOf(c,S.date)>MAXAGE);}
function nz(v){return isNum(v)?v:0;}
function numOrNull(v){var r=String(v==null?'':v).trim().replace(/,/g,'');if(r==='')return null;var n=Number(r);return isFinite(n)?n:NaN;}
function won(x){return fmt(Math.round(x))+'원';}
function sdoc(){return S.settle||{};}
var ASUB=[
  {k:'hot',name:'혹서기 사육관리비지원',rate:200,desc:'출하일이 7/1~8/31'},
  {k:'wfuel',name:'동절기 연료비지원',rate:150,desc:'입식일이 11/1~다음해 2/28, 이 기간 최대 2파트'},
  {k:'annual',name:'동절기 사육농가 연중사육비지원',rate:50,desc:'입식일이 3/1~10/31'}
];
function asubJudge(c,k,shipDate){
  var md=String(c.stockDate||'').slice(5),ok=null,why='';
  if(k==='hot'){
    if(!shipDate)return {ok:null,why:'출하일을 입력하면 판정합니다'};
    var sm=shipDate.slice(5);ok=sm>='07-01'&&sm<='08-31';
    why='출하일 '+dot(shipDate)+(ok?' → 7/1~8/31 해당':' → 7/1~8/31 아님');
  }else if(k==='wfuel'){
    var inW=md>='11-01'||md<='02-28';
    if(!inW){ok=false;why='입식일 '+dot(c.stockDate)+' → 11/1~2/28 아님';}
    else{
      var key=function(x){var y=Number(String(x).slice(0,4)),m=Number(String(x).slice(5,7));return m>=11?y:y-1;};
      var sk=key(c.stockDate);
      var peers=S.cycles.filter(function(o){var m2=String(o.stockDate).slice(5);return (m2>='11-01'||m2<='02-28')&&key(o.stockDate)===sk;})
        .sort(function(a,b){return String(a.stockDate).localeCompare(String(b.stockDate));});
      var rank=0;peers.forEach(function(o,i){if(o.id===c.id)rank=i+1;});
      ok=rank>=1&&rank<=2;
      why='이 동절기 '+rank+'번째 입식'+(ok?'':' (최대 2파트까지)');
    }
  }else{
    ok=md>='03-01'&&md<='10-31';
    why='입식일 '+dot(c.stockDate)+(ok?' → 3/1~10/31 해당':' → 3/1~10/31 아님');
  }
  return {ok:ok,why:why};
}
function subv(kind,n){var m=S.sub&&S.sub[kind];return m?m[n]:undefined;}
function monthKeys(c){
  var out=[],end=maxDateOf(c),cur=c.stockDate.slice(0,7);
  for(var i=0;i<4;i++){
    out.push(cur);
    var y=Number(cur.slice(0,4)),m=Number(cur.slice(5,7))+1;if(m>12){m=1;y++;}
    var nx=y+'-'+p2(m);if(nx+'-01'>end)break;cur=nx;
  }
  return out;
}
function dimOf(mk){return new Date(Date.UTC(Number(mk.slice(0,4)),Number(mk.slice(5,7)),0)).getUTCDate();}
function periodDaysIn(mk,c,endDate){
  if(!endDate)return 0;
  var dim=dimOf(mk),a=c.stockDate>mk+'-01'?c.stockDate:mk+'-01',z=endDate<mk+'-'+p2(dim)?endDate:mk+'-'+p2(dim);
  var n=dayNum(z)-dayNum(a)+1;return n>0?n:0;
}
function calcSettle(c){
  var d=sdoc(),sh=d.ship||{},tm=d.terms||{},r={};
  var ws=(Array.isArray(sh.weights)?sh.weights:[]).filter(isNum);
  r.W=ws.reduce(function(x,y){return x+y;},0);r.nVeh=ws.length;
  r.heads=isNum(sh.heads)&&sh.heads>0?sh.heads:null;
  r.shipDate=/^\d{4}-\d{2}-\d{2}$/.test(sh.date||'')&&sh.date>=c.stockDate?sh.date:null;
  r.age=r.shipDate?ageOf(c,r.shipDate):null;
  var A=agg(),feed=0;HOUSES.forEach(function(h){feed+=A.tot[h].feed;});
  r.ft=A.ft;r.feed=feed;r.total=Number(c.total)||0;
  r.surv=(r.heads&&r.total>0)?r.heads/r.total*100:null;
  r.avgW=(r.heads&&r.W>0)?r.W/r.heads:null;
  r.fph=r.heads?feed/r.heads:null;
  r.fcr=r.W>0?feed/r.W:null;
  r.live=r.W*nz(tm.live);
  r.eco=nz(tm.eco)*(r.heads||0);
  r.other=nz(tm.otherSub)*(r.heads||0);
  r.asub=ASUB.map(function(a){
    var j=asubJudge(c,a.k,r.shipDate),mode=(d.asub&&d.asub[a.k])||'auto',ok=j.ok,why=j.why;
    if(mode==='on'){ok=true;why+=' · 직접 적용으로 설정';}
    else if(mode==='off'){ok=false;why+=' · 직접 미적용으로 설정';}
    return {k:a.k,name:a.name,rate:a.rate,desc:a.desc,mode:mode,ok:ok,why:why,amt:ok?a.rate*(r.heads||0):0};
  });
  r.asubTotal=r.asub.reduce(function(x,a){return x+a.amt;},0);
  r.months=monthKeys(c).map(function(mk){
    var dim=dimOf(mk),days=periodDaysIn(mk,c,r.shipDate);
    var mn=Number(mk.slice(5,7)),gf=subv('fuel',mn),gl=subv('litter',mn);
    var fa=isNum(gf)?gf:nz(tm.fuel&&tm.fuel[mk]),la=isNum(gl)?gl:nz(tm.litter&&tm.litter[mk]);
    return {mk:mk,dim:dim,days:days,fa:fa,la:la,fp:0,lp:0};
  });
  r.pdays=r.months.reduce(function(x,m){return x+m.days;},0);
  r.months.forEach(function(m){m.fp=r.pdays>0?m.fa*m.days/r.pdays:0;m.lp=r.pdays>0?m.la*m.days/r.pdays:0;});
  r.fuelU=r.months.reduce(function(x,m){return x+m.fp;},0);
  r.litterU=r.months.reduce(function(x,m){return x+m.lp;},0);
  r.fuel=r.fuelU*(r.heads||0);
  r.litter=r.litterU*(r.heads||0);
  r.income=r.live+r.eco+r.other+r.asubTotal+r.fuel+r.litter;
  r.chick=r.total*nz(tm.chick);
  r.pEarly=nz(tm.feed);r.lateFall=!isNum(tm.feedLate);r.pLate=r.lateFall?r.pEarly:tm.feedLate;
  r.kgEarly=A.ft.crumble+A.ft.early;r.kgLate=A.ft.late;r.kgNone=A.ft.none;
  r.feedCost=(r.kgEarly+r.kgNone)*r.pEarly+r.kgLate*r.pLate;
  var etc=Array.isArray(d.etc)?d.etc:[];
  r.etc=etc.reduce(function(x,e){return x+nz(e&&e.amt);},0);
  r.jajoMode=(d.fc&&d.fc.jajo)||'on';r.jajoRate=10;
  r.jajo=r.jajoMode==='off'?0:r.jajoRate*(r.heads||0);
  r.cost=r.chick+r.feedCost+r.jajo+r.etc;
  r.net=r.income-r.cost;
  r.netNoEtc=r.net+r.etc;
  return r;
}

function settleChange(t){
  var k=t.dataset.sk||'',v=t.value,m;
  var num=function(){var n=numOrNull(v);if(n!==null&&(!isFinite(n)||n<0)){toast('숫자로 입력하세요');refreshSettle();return {bad:true};}return {v:n};};
  if((m=k.match(/^sub:(fuel|litter):(\d+)$/))){var sv=num();if(sv.bad)return;saveSub(m[1],Number(m[2]),sv.v);return;}
  if(k==='fc:jajo'){saveSettle(function(d){d.fc=d.fc||{};if(v==='on')delete d.fc.jajo;else d.fc.jajo=v;});return;}
  if((m=k.match(/^asub:(hot|wfuel|annual)$/))){var ak=m[1];saveSettle(function(d){d.asub=d.asub||{};if(v==='auto')delete d.asub[ak];else d.asub[ak]=v;});return;}
  if(k==='ship.date'){saveSettle(function(d){d.ship=d.ship||{};d.ship.date=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';});return;}
  if(k==='ship.heads'){var a=num();if(a.bad)return;saveSettle(function(d){d.ship=d.ship||{};d.ship.heads=a.v;});return;}
  if(/^terms\.(live|chick|feed|feedLate|eco|otherSub)$/.test(k)){var f=k.slice(6),b=num();if(b.bad)return;saveSettle(function(d){d.terms=d.terms||{};d.terms[f]=b.v;});return;}
  if((m=k.match(/^w:(\d+)$/))){var i=Number(m[1]),c2=num();if(c2.bad)return;saveSettle(function(d){d.ship=d.ship||{};d.ship.weights=d.ship.weights||[];d.ship.weights[i]=c2.v;});return;}
  if((m=k.match(/^(fuel|litter):(\d{4}-\d{2})$/))){var kind=m[1],mk=m[2],e=num();if(e.bad)return;saveSettle(function(d){d.terms=d.terms||{};d.terms[kind]=d.terms[kind]||{};d.terms[kind][mk]=e.v;});return;}
  if((m=k.match(/^em:(\d+)$/))){var j=Number(m[1]);saveSettle(function(d){d.etc=d.etc||[];d.etc[j]=Object.assign({},d.etc[j]||{},{memo:v.trim()});});return;}
  if((m=k.match(/^ea:(\d+)$/))){var j2=Number(m[1]),g=numOrNull(v);if(isNaN(g)){toast('금액을 숫자로 입력하세요');refreshSettle();return;}saveSettle(function(d){d.etc=d.etc||[];d.etc[j2]=Object.assign({},d.etc[j2]||{},{amt:g});});return;}
}
async function copyTerms(){
  var c=cyc();if(!c||!S.db||!S.canWrite)return;
  try{
    var r=await S.db.collection('settle').get(),best=null;
    r.docs.forEach(function(d){
      var x=d.data();if(d.id===c.id||!x||!x.terms)return;
      var oc=cycleById(d.id),sd=oc?oc.stockDate:'';
      if(!best||sd>best.sd)best={sd:sd,t:x.terms};
    });
    if(!best){toast('복사할 다른 입식의 단가가 없습니다');return;}
    saveSettle(function(d){var t=Object.assign({},d.terms||{});['live','chick','feed','feedLate','eco','otherSub'].forEach(function(k){if(best.t[k]!==undefined)t[k]=best.t[k];});d.terms=t;});
    toast('이전 입식의 단가를 복사했습니다 (월별 보조금은 제외)');
  }catch(e){handleErr(e);}
}

/* 파일 읽기 */
function readBuf(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsArrayBuffer(file);});}
function parseTs(x){
  if(typeof x==='number'&&typeof XLSX!=='undefined'&&XLSX.SSF){
    var o=XLSX.SSF.parse_date_code(x);if(!o)return null;
    return {d:o.y+'-'+p2(o.m)+'-'+p2(o.d),m:o.H*60+o.M};
  }
  var m=String(x==null?'':x).match(/^\s*(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})[ T]+(\d{1,2}):(\d{2})/);
  if(!m)return null;
  return {d:m[1]+'-'+p2(m[2])+'-'+p2(m[3]),m:Number(m[4])*60+Number(m[5])};
}
function parseSheet(buf){
  if(typeof XLSX==='undefined')throw new Error('nolib');
  var wb=XLSX.read(buf,{type:'array'});
  var ws=wb.Sheets[wb.SheetNames[0]];
  var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  var out=[];
  rows.forEach(function(r){
    var t=parseTs(r[0]);if(!t)return;
    if(r[1]===null||r[1]==='')return;
    var v=Number(r[1]);if(!isFinite(v))return;
    var hv=(r[2]===null||r[2]===''||r[2]===undefined)?null:Number(r[2]);
    if(hv!==null&&(!isFinite(hv)||hv<0||hv>100))hv=null;
    out.push({d:t.d,m:t.m,v:v,hv:hv});
  });
  return out;
}
/* 집계: 동별·날짜별 시간대 값(온도 아침 최저·점심/저녁 최고, 습도 평균). 구간의 70% 미만만 기록된 시간대는 건너뜀 */
function aggregateRows(rows,win,minDate){
  var seen={},by={};
  rows.forEach(function(r){
    if(r.h==null)return;
    var k=r.id+'|'+r.d+'|'+r.m;if(seen[k])return;seen[k]=1;
    var hh=by[r.h]||(by[r.h]={}),dd=hh[r.d]||(hh[r.d]={ids:{},pts:[]});
    dd.ids[r.id]=1;dd.pts.push(r);
  });
  var out=[];
  Object.keys(by).forEach(function(h){Object.keys(by[h]).forEach(function(d){
    if(d<minDate)return;
    var dd=by[h][d],nS=Object.keys(dd.ids).length,vals={},cov={};
    ['m','n','e'].forEach(function(k){
      var st=win[k][0]*60,en=win[k][1]*60;
      var pts=dd.pts.filter(function(p){return p.m>=st&&p.m<en;});
      var need=(en-st)*nS,c=need>0?pts.length/need:0;cov[k]=c;
      /* 온도: 같은 시각에 센서가 여럿이면 평균해 동의 값으로 보고, 아침은 최저점·점심과 저녁은 최고점 */
      var bm={};pts.forEach(function(p){(bm[p.m]||(bm[p.m]=[])).push(p.v);});
      var hv2=Object.keys(bm).map(function(mm){return mean(bm[mm]);});
      vals[WKEY[k]]=(c>=0.7&&hv2.length)?Math.round((k==='m'?Math.min.apply(null,hv2):Math.max.apply(null,hv2))*10)/10:null;
      var hp=pts.filter(function(p){return p.hv!=null;});
      vals[HKEY[k]]=(need>0&&hp.length/need>=0.7)?Math.round(mean(hp.map(function(p){return p.hv;}))*10)/10:null;
    });
    out.push({d:d,h:Number(h),vals:vals,cov:cov,ns:nS});
  });});
  out.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:(a.h||9)-(b.h||9);});
  return out;
}
async function handleImpFiles(files){
  var c=cyc();

  [0,1,2,3,4,5].forEach(function(h){st.sens[h].forEach(function(id){map[id]=h;});});
  var rows=[],info=[];
  for(var i=0;i<files.length;i++){
    var f=files[i],m=String(f.name).toUpperCase().match(/[0-9A-F]{12}/),id=m?m[0]:null;
    if(!id){info.push({name:f.name,err:'파일 이름에서 센서 번호(12자리)를 찾지 못했습니다.'});continue;}
    try{
      var data=parseSheet(await readBuf(f));
      var h=(id in map)?map[id]:null;
      if(!data.length){info.push({name:f.name,id:id,h:h,n:0,err:'온도 기록을 찾지 못했습니다.'});continue;}
      data.forEach(function(r){if(h!=null)rows.push({id:id,h:h,d:r.d,m:r.m,v:r.v,hv:r.hv});});

      info.push({name:f.name,err:(e&&e.message==='nolib')?'엑셀 읽는 도구를 불러오지 못했습니다. 새로고침 후 다시 시도하세요.':'파일을 읽지 못했습니다.'});

  S.imp={info:info,rows:rows,policy:'empty',cid:c?c.id:null};
  renderImp();
}

function impPlan(res){

    var ex=dayDoc(c.id,r.d,r.h)||{},w={};

/* ---------- 그래프 탭: 동·외부 겹쳐보기 / 입식(파트)별 겹쳐보기 ---------- */
var SER_ORDER=[1,2,3,4,5,0];
var MET={temp:{k:'temp',label:'온도',unit:'℃'},humi:{k:'humi',label:'습도',unit:'%'},dead:{k:'dead',label:'폐사',unit:'마리'},cull:{k:'cull',label:'도태',unit:'마리'},
  loss:{k:'loss',label:'폐사+도태',unit:'마리'},
  feed:{k:'feed',label:'사료 입고',unit:'kg'},fpp:{k:'fpp',label:'마리당 사료',unit:'kg/마리'},drate:{k:'drate',label:'폐사율',unit:'%'},fcr:{k:'fcr',label:'요구율(출하)',unit:''}};
var MET_H=['temp','humi','dead','cull','loss','feed','fpp','drate'],MET_C=['temp','humi','dead','cull','loss','feed','fpp','drate','fcr'];
function lossOf(o){return (o?(Number(o.dead)||0)+(Number(o.cull)||0):0);}
var GH=null;
var ROT_M=['dead','cull','loss','drate'];
function hasRotMark(m){return ROT_M.indexOf(m)>=0;}
function gColor(h){return h===0?'var(--muted)':'var(--s'+h+')';}
function gSwatch(h){return h===0?'repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 8px)':'var(--s'+h+')';}
function winHours(){var st=settingsNow();return {tm:(st.win.m[0]+st.win.m[1])/2,tn:(st.win.n[0]+st.win.n[1])/2,te:(st.win.e[0]+st.win.e[1])/2};}
function isoDay(n){return new Date(n*86400000).toISOString().slice(0,10);}

/* 동·외부 겹쳐보기: 현재 선택한 입식 */
function houseSeries(c){
  var g=S.g,hours=winHours(),series=[];
  if(isEnv(g.metric)){
    SER_ORDER.forEach(function(h){
      var pts=[];
      S.days.forEach(function(dd){
        if(dd.h!==h||!dd.d)return;
        var a=ageOf(c,dd.d);if(a<1)return;
        fieldsFor(g.metric).forEach(function(f){
          if(g.win!=='all'&&g.win!==f.w)return;
          if(isNum(dd[f.f]))pts.push({x:a+(g.win==='all'?hours[f.w]/24:0.5),y:dd[f.f],d:dd.d,a:a,lab:f.label});
        });
      });
      pts.sort(function(p,q){return p.x-q.x;});
      series.push({key:String(h),name:hl(h),color:gColor(h),dash:h===0,sw:gSwatch(h),pts:pts});
    });
  }else{
    var A=agg(),dates=Array.from(A.dates).filter(function(d){return d>=c.stockDate;}).sort(),rotBy={};
    S.days.forEach(function(dd){if(dd&&dd.rot&&dd.d&&dd.h>=1)(rotBy[dd.h]=rotBy[dd.h]||{})[dd.d]=1;});
    [1,2,3,4,5].forEach(function(h){
      var pts=[],run=0;
      if(g.metric==='fpp'){
        pts=fppDaily(c,cycTotals(c,cycSrc(c.id),[h]),shipOf(c.id));
      }else if(g.metric==='drate'){
        if(dates.length)pts=drPts(c,cycTotals(c,cycSrc(c.id),[h]),rotBy[h],!!g.cum,dates[0],dates[dates.length-1]);
      }else if(dates.length){
        for(var n=dayNum(dates[0]);n<=dayNum(dates[dates.length-1]);n++){
          var d=isoDay(n),ho=((A.byDate[d]||{})[h])||{},v=g.metric==='loss'?lossOf(ho):(ho[g.metric]||0);run+=v;
          pts.push({x:ageOf(c,d)+0.5,y:g.cum?run:v,d:d,a:ageOf(c,d),lab:'',rot:!!(rotBy[h]&&rotBy[h][d])});
        }
      }
      series.push({key:String(h),name:hl(h),color:gColor(h),dash:false,sw:gSwatch(h),pts:pts});
    });
  }

}
/* 입식(파트)별 겹쳐보기 */
function cycLabel(c){

  if(!sd||sd<c.stockDate){var si=shipOf(c.id);sd=(si&&si.date&&si.date>=c.stockDate)?si.date:null;}

function shipFrom(doc){
  var sh=doc&&doc.ship;if(!sh)return null;
  var ws=(Array.isArray(sh.weights)?sh.weights:[]).filter(isNum),W=ws.reduce(function(x,y){return x+y;},0);
  return {date:/^\d{4}-\d{2}-\d{2}$/.test(sh.date||'')?sh.date:null,W:W,heads:isNum(sh.heads)?sh.heads:null};
}
/* 출하 정보: 현재 입식은 불러온 정산 문서, 다른 입식은 따로 불러온 값. undefined=불러오는 중, null=없음 */
function shipOf(cid){
  if(cid===S.cid&&S.settle)return shipFrom(S.settle);
  var v=S.g.ship[cid];return v;
}
function cycSrc(cid){
  if(cid===S.cid)return {entries:Array.from(S.entries.values()),days:Array.from(S.days.values())};
  return S.g.cache[cid]||null;
}
function scopeHs(){return S.g.scope==='all'?HOUSES:[Number(S.g.scope)];}
function cycTotals(c,src,hs){
  var init=0,by={},tot={cull:0,dead:0,feed:0},last=null;
  hs.forEach(function(h){init+=headsOf(c,h);});
  src.entries.forEach(function(e){
    if(!e||hs.indexOf(e.h)<0||!e.d||e.d<c.stockDate||tot[e.t]===undefined)return;
    var q=Number(e.q)||0,o=by[e.d]||(by[e.d]={cull:0,dead:0,feed:0});
    o[e.t]+=q;tot[e.t]+=q;if(!last||e.d>last)last=e.d;
  });
  return {init:init,by:by,tot:tot,last:last};
}
/* 마리당 사료(일별): 사료를 입고한 날부터 다음 입고 전날까지, 입고량을 날수로 나눠 그날 마릿수로 나눈다.
   마지막 입고는 출하일까지(출하일 포함) 쓴 것으로 본다. 출하 정보가 없으면 마지막 구간은 그리지 않는다. */
function fppDaily(c,T,si){
  var pts=[],fd=Object.keys(T.by).filter(function(d){return T.by[d].feed!==0;}).sort();
  var endDay=(si&&si.date)?si.date:null;
  if(endDay)fd=fd.filter(function(d){return d<=endDay;});
  if(!fd.length)return pts;
  var run={cull:0,dead:0},dn=Object.keys(T.by).sort(),idx=0,cumF=0;
  var headsAt=function(d){
    while(idx<dn.length&&dn[idx]<=d){run.cull+=T.by[dn[idx]].cull;run.dead+=T.by[dn[idx]].dead;idx++;}
    return T.init-run.cull-run.dead;
  };
  for(var i=0;i<fd.length;i++){
    var a=dayNum(fd[i]),b,qty=0;
    for(var j=0;j<fd.length;j++)if(fd[j]===fd[i])qty=T.by[fd[i]].feed;
    if(i+1<fd.length)b=dayNum(fd[i+1])-1;
    else if(endDay)b=dayNum(endDay);
    else break;
    if(b<a)b=a;
    var days=b-a+1,per=qty/days;
    for(var n=a;n<=b;n++){
      var d=isoDay(n),now=headsAt(d);
      cumF+=per;
      if(now>0){pts.push({x:ageOf(c,d)+0.5,y:cumF/now,s:per/now,d:d,a:ageOf(c,d),lab:''});}
    }
  }
  return pts;
}
/* 폐사율(일별/누계): 일별 = 그날 폐사 ÷ 전일 마릿수, 누계 = 누적 폐사 ÷ 입식 마릿수. 선택하지 않은 쪽은 괄호(st)로 같이 보여 준다. */
function drPts(c,T,rotD,cum,d0,d1){
  var pts=[],ks=Object.keys(T.by).sort();
  if(!(T.init>0))return pts;
  if(!d0&&ks.length){d0=ks[0];d1=ks[ks.length-1];}
  if(!d0)return pts;
  var run={cull:0,dead:0};
  for(var n=dayNum(d0);n<=dayNum(d1);n++){
    var d=isoDay(n),o=T.by[d]||{cull:0,dead:0},prev=T.init-run.cull-run.dead;
    run.cull+=o.cull;run.dead+=o.dead;
    if(!(prev>0))continue;
    var dr=o.dead/prev*100,cr=run.dead/T.init*100,a=ageOf(c,d);
    pts.push({x:a+0.5,y:cum?cr:dr,d:d,a:a,lab:'',rot:!!(rotD&&rotD[d]),st:cum?'당일 '+dr.toFixed(3)+'%':'누계 '+cr.toFixed(2)+'%'});
  }
  return pts;
}
function cycleSeriesPts(c,src,hs,g,hours){
  var pts=[];
  if(isEnv(g.metric)){
    var by={},FS=fieldsFor(g.metric);
    src.days.forEach(function(dd){
      if(!dd||!dd.d||dd.d<c.stockDate||hs.indexOf(dd.h)<0)return;
      FS.forEach(function(f){
        if(g.win!=='all'&&g.win!==f.w)return;
        if(isNum(dd[f.f])){var o=by[dd.d]||(by[dd.d]={});(o[f.f]=o[f.f]||[]).push(dd[f.f]);}
      });
    });
    Object.keys(by).forEach(function(d){FS.forEach(function(f){
      if(by[d][f.f])pts.push({x:ageOf(c,d)+(g.win==='all'?hours[f.w]/24:0.5),y:mean(by[d][f.f]),d:d,a:ageOf(c,d),lab:f.label});
    });});
    pts.sort(function(p,q){return p.x-q.x;});
    return pts;
  }
  var T=cycTotals(c,src,hs),dates=Object.keys(T.by).sort();
  if(!dates.length)return pts;
  var si=shipOf(c.id);
  if(g.metric==='fcr'){
    if(!si||!si.date||!(si.W>0))return pts;
    var fk=0;Object.keys(T.by).forEach(function(d){if(d<=si.date)fk+=T.by[d].feed;});
    if(fk>0)pts.push({x:ageOf(c,si.date)+0.5,y:fk/si.W,d:si.date,a:ageOf(c,si.date),lab:''});
    return pts;
  }
  if(g.metric==='fpp')return fppDaily(c,T,si);
  var rotD={};src.days.forEach(function(dd){if(dd&&dd.rot&&dd.d&&hs.indexOf(dd.h)>=0)rotD[dd.d]=1;});
  if(g.metric==='drate')return drPts(c,T,rotD,!!g.cum);
  var run={cull:0,dead:0,feed:0};
  for(var n=dayNum(dates[0]);n<=dayNum(dates[dates.length-1]);n++){
    var d=isoDay(n),o=T.by[d]||{cull:0,dead:0,feed:0},a=ageOf(c,d),y=null;
    run.cull+=o.cull;run.dead+=o.dead;run.feed+=o.feed;
    var now=T.init-run.cull-run.dead;
    if(g.metric==='loss')y=g.cum?(run.dead+run.cull):(o.dead+o.cull);
    else y=g.cum?run[g.metric]:o[g.metric];
    if(y!=null)pts.push({x:a+0.5,y:y,d:d,a:a,lab:'',rot:!!rotD[d]});
  }
  return pts;
}
function cycleSeries(){
  var g=S.g,hs=scopeHs(),hours=winHours(),out=[];
  g.sel.forEach(function(cid){
    var c=cycleById(cid),src=cycSrc(cid);if(!c)return;
    var col='var(--s'+g.color[cid]+')';
    out.push({key:cid,name:cycLabel(c),color:col,dash:false,sw:col,loading:!src||((g.metric==='fpp'||g.metric==='fcr')&&shipOf(cid)===undefined),pts:src?cycleSeriesPts(c,src,hs,g,hours):[]});
  });
  return out;
}
function ensureShip(cid){
  var g=S.g;if(!S.db)return;
  if(!(cid in g.ship)&&!g.shipPending[cid]&&!(cid===S.cid&&S.settle)){
    g.shipPending[cid]=true;
    S.db.doc('settle/'+cid).get().then(function(sn){g.ship[cid]=sn.exists?shipFrom(sn.data()):null;})
      .catch(function(){g.ship[cid]=null;})
      .then(function(){delete g.shipPending[cid];if(S.tab==='graph')renderGraph();});
  }
}
function ensureCmp(){
  var g=S.g;if(g.mode!=='cycle'||!S.db)return;
  g.sel.forEach(function(cid){
    ensureShip(cid);
    if(cid===S.cid||g.cache[cid]||g.pending[cid])return;
    g.pending[cid]=true;
    Promise.all([S.db.collection('entries').where('c','==',cid).get(),S.db.collection('days').where('c','==',cid).get()])
      .then(function(r){g.cache[cid]={entries:r[0].docs.map(function(d){return d.data();}),days:r[1].docs.map(function(d){return d.data();})};})
      .catch(function(){g.cache[cid]={entries:[],days:[],err:true};})
      .then(function(){delete g.pending[cid];if(S.tab==='graph')renderGraph();});
  });
}
function cmpPrepare(){
  var g=S.g,have={};S.cycles.forEach(function(c){have[c.id]=1;});
  g.sel=g.sel.filter(function(cid){return have[cid];});
  Object.keys(g.color).forEach(function(k){if(g.sel.indexOf(k)<0)delete g.color[k];});
  if(!g.sel.length&&!g.selInit){
    var ids=[];if(S.cid)ids.push(S.cid);
    S.cycles.forEach(function(c){if(ids.indexOf(c.id)<0)ids.push(c.id);});
    ids.slice(0,2).forEach(function(cid){cmpAdd(cid);});
    g.selInit=true;
  }
}
function cmpAdd(cid){
  var g=S.g,used={};Object.keys(g.color).forEach(function(k){used[g.color[k]]=1;});
  for(var sl=1;sl<=5;sl++){if(!used[sl]){g.color[cid]=sl;g.sel.push(cid);return true;}}
  return false;
}

function niceTicks(lo,hi,n){
  if(!(hi>lo))hi=lo+1;
  var raw=(hi-lo)/n,pow=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/pow;
  var step=(f<=1?1:f<=2?2:f<=5?5:10)*pow;
  var dec=step<1?Math.ceil(-Math.log10(step)-1e-9):0,out=[];
  for(var v=Math.floor(lo/step)*step;v<=Math.ceil(hi/step)*step+step*1e-6;v+=step)out.push(Number(v.toFixed(dec)));
  return {ticks:out,dec:dec};
}

      if(hasRotMark(g.metric))s.pts.forEach(function(p){if(p.rot)svg+='<circle class="rotd" cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="5.5" style="stroke:'+s.color+'"/>';});
      if(s.pts.length===1)svg+='<circle cx="'+sx(s.pts[0].x).toFixed(1)+'" cy="'+sy(s.pts[0].y).toFixed(1)+'" r="4" style="fill:'+s.color+'"/>';
    });
    svg+='<line id="gcur" class="gcur" y1="'+T+'" y2="'+(T+ph)+'" style="display:none"/><g id="gdots"></g>'+
      '<rect id="ghit" x="'+L+'" y="'+T+'" width="'+pw+'" height="'+ph+'" fill="transparent"/>';
    body='<div class="gwrap" id="gwrap"><svg class="gsvg" id="gsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+m.label+' 비교 그래프. 자세한 값은 표 보기에서 확인할 수 있습니다.">'+svg+'</svg><div class="gtip" id="gtip" style="display:none"></div></div>';
    GH={vis:vis,m:m,sx:sx,sy:sy,W:W,H:H,L:L,R:R,T:T,ph:ph,pw:pw,xmin:xmin,xmax:xmax,cm:cm};
  }
  pane.innerHTML='<div class="card">'+ctl+legend+cap+body+(cm&&S.cycles.length>=2?cycSummaryHTML():'')+'</div>';
  if(GH)bindGraphHover();
}
function bindGraphHover(){
  var svg=$('gsvg'),hit=$('ghit'),cur=$('gcur'),dots=$('gdots'),tip=$('gtip'),wrap=$('gwrap');
  if(!svg||!GH)return;
  var G=GH,xsU=[],seen={};
  G.vis.forEach(function(s){s.pts.forEach(function(p){var k=p.x.toFixed(4);if(!seen[k]){seen[k]=1;xsU.push(p.x);}});});
  function move(e){
    var r=svg.getBoundingClientRect(),k=G.W/r.width;
    var px=(e.clientX-r.left)*k,xv=G.xmin+(px-G.L)/G.pw*(G.xmax-G.xmin);
    var best=xsU[0],bd=Infinity;
    xsU.forEach(function(x){var d=Math.abs(x-xv);if(d<bd){bd=d;best=x;}});
    var rows=[],head=null,dh='';
    G.vis.forEach(function(s){
      for(var i=0;i<s.pts.length;i++){
        var p=s.pts[i];
        if(Math.abs(p.x-best)<1e-9){
          rows.push({s:s,p:p});if(!head)head=p;
          dh+='<circle cx="'+G.sx(p.x).toFixed(1)+'" cy="'+G.sy(p.y).toFixed(1)+'" r="4.5" style="fill:'+s.color+';stroke:var(--surface);stroke-width:2"/>';
          break;
        }
      }
    });
    if(!head)return;
    var cx=G.sx(best);
    cur.setAttribute('x1',cx.toFixed(1));cur.setAttribute('x2',cx.toFixed(1));cur.style.display='';
    dots.innerHTML=dh;
    tip.innerHTML='<b>'+head.a+'일령'+(G.cm?'':' · '+head.d.slice(5).replace('-','.'))+(head.lab?' '+head.lab:'')+'</b>'+
      rows.map(function(x){return '<div><span><i style="background:'+x.s.sw+'"></i>'+x.s.name+'</span><span>'+gVal(G.m,x.p.y)+gSub(x.p)+(G.m.k==='drate'?'':' '+G.m.unit)+(x.p.rot?' · 로터리':'')+'</span></div>';}).join('');
    tip.style.display='';
    var cssX=cx/k,tw=tip.offsetWidth,left=cssX+12;
    if(left+tw>wrap.clientWidth)left=cssX-12-tw;
    tip.style.left=Math.max(0,left)+'px';
  }
  function leave(){cur.style.display='none';dots.innerHTML='';tip.style.display='none';}
  hit.addEventListener('pointermove',move);
  hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',leave);
}

async function xlGetData(cid){
  if(cid===S.cid)return {entries:Array.from(S.entries.values()),days:Array.from(S.days.values())};
  var r=await Promise.all([S.db.collection('entries').where('c','==',cid).get(),S.db.collection('days').where('c','==',cid).get()]);
  return {entries:r[0].docs.map(function(d){return d.data();}),days:r[1].docs.map(function(d){return d.data();})};

function xlTotals(c,data,hs){
  var tot={cull:0,dead:0,feed:0},init=0;
  hs.forEach(function(h){init+=headsOf(c,h);});
  data.entries.forEach(function(e){
    if(hs.indexOf(e.h)<0||!e.d||e.d<c.stockDate||tot[e.t]===undefined)return;
    tot[e.t]+=Number(e.q)||0;
  });
  var now=init-tot.cull-tot.dead,w=Number(c.expectedWeight)||0,r2=function(v){return Math.round(v*100)/100;};
  return {init:init,cull:tot.cull,dead:tot.dead,feed:tot.feed,now:now,w:w,
    rate:init>0?r2(tot.dead/init*100):null,fpp:now>0?r2(tot.feed/now):null,fcr:(now>0&&w>0)?r2(tot.feed/(now*w)):null};
}
/* 선택한 내용만으로 시트 자료(2차원 배열)를 만든다 */
function xlBuild(cycles,datas,opt){
  var sheets=[],hs=opt.houses.filter(function(h){return h>0;}),r1=function(v){return Math.round(v*10)/10;};
  if(opt.info){
    var head=['입식일','총 마릿수','입식수(서비스 포함)'].concat(HOUSES.map(function(h){return h+'동 입식수';})).concat(['예상 중량(kg)','비고']);
    var rows=cycles.map(function(c){
      return [c.stockDate,Number(c.total)||0,HOUSES.reduce(function(a,h){return a+headsOf(c,h);},0)].concat(HOUSES.map(function(h){return headsOf(c,h);})).concat([Number(c.expectedWeight)||null,c.note||'']);
    });
    sheets.push({name:'입식 정보',aoa:[head].concat(rows)});
  }
  if(opt.sum&&cycles.length>1){
    var head2=['입식일','입식 마릿수','도태 누계','폐사 누계','폐사율(%)','현재 마릿수','사료 입고 누계(kg)','마리당 사료(kg)','예상 중량(kg)','사료요구율'];
    var rows2=cycles.map(function(c,i){var t=xlTotals(c,datas[i],hs);return [c.stockDate,t.init,t.cull,t.dead,t.rate,t.now,t.feed,t.fpp,t.w||null,t.fcr];});
    sheets.push({name:'입식 비교',aoa:[head2].concat(rows2)});
  }
  cycles.forEach(function(c,i){
    var tag=c.stockDate.slice(2).replace(/-/g,''),data=datas[i];
    if(opt.count||opt.temp||opt.note){
      var m={},row=function(d,h){var k=d+'|'+h;return m[k]||(m[k]={d:d,h:h,cull:null,dead:null,feed:null,tm:null,tn:null,te:null,hm:null,hn:null,he:null,memo:''});};
      if(opt.count)data.entries.forEach(function(e){
        if(hs.indexOf(e.h)<0||!e.d||e.d<c.stockDate||['cull','dead','feed'].indexOf(e.t)<0)return;
        var r=row(e.d,e.h);r[e.t]=(r[e.t]||0)+(Number(e.q)||0);
      });
      data.days.forEach(function(dd){
        if(!dd||!dd.d||dd.d<c.stockDate||opt.houses.indexOf(dd.h)<0)return;
        if(opt.temp)ALLF.forEach(function(f){if(isNum(dd[f.f]))row(dd.d,dd.h)[f.f]=dd[f.f];});
        if(opt.note&&dd.h>0&&dd.memo&&String(dd.memo).trim())row(dd.d,dd.h).memo=String(dd.memo).trim();
      });
      var list=Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.h||9)-(b.h||9);});
      var head3=['날짜','일령','동'].concat(opt.count?['도태','폐사','사료 입고(kg)']:[]).concat(opt.temp?['아침 ℃','점심 ℃','저녁 ℃','아침 %','점심 %','저녁 %']:[]).concat(opt.note?['비고']:[]);
      var rows3=list.map(function(r){
        return [r.d,ageOf(c,r.d),hl(r.h)].concat(opt.count?[r.cull,r.dead,r.feed]:[]).concat(opt.temp?[r.tm,r.tn,r.te,r.hm,r.hn,r.he]:[]).concat(opt.note?[r.memo||null]:[]);
      });
      sheets.push({name:'일별 기록 '+tag,aoa:[head3].concat(rows3)});
    }
    if(opt.sum){
      var head4=['동','입식 마릿수','도태 누계','폐사 누계','폐사율(%)','현재 마릿수','사료 입고 누계(kg)','마리당 사료(kg)','예상 중량(kg)','사료요구율'];
      var rows4=hs.map(function(h){var t=xlTotals(c,data,[h]);return [hl(h),t.init,t.cull,t.dead,t.rate,t.now,t.feed,t.fpp,t.w||null,t.fcr];});
      if(hs.length>1){var ta=xlTotals(c,data,hs);rows4.push(['선택한 동 전체',ta.init,ta.cull,ta.dead,ta.rate,ta.now,ta.feed,ta.fpp,ta.w||null,ta.fcr]);}
      sheets.push({name:'동별 요약 '+tag,aoa:[head4].concat(rows4)});
    }
  });
  return sheets;
}
async function doExport(){
  var err=$('xErr');err.hidden=true;
  var fail=function(m){err.textContent=m;err.hidden=false;};
  var ids=xlChecked('xc'),what=xlChecked('xw'),houses=xlChecked('xh').map(Number);
  var opt={info:what.indexOf('info')>=0,count:what.indexOf('count')>=0,temp:what.indexOf('temp')>=0,note:what.indexOf('note')>=0,sum:what.indexOf('sum')>=0,houses:houses};
  if(!ids.length)return fail('내보낼 입식을 하나 이상 선택하세요.');
  if(!what.length)return fail('포함할 내용을 하나 이상 선택하세요.');
  if(opt.count||opt.note||opt.sum){
    if(!houses.some(function(h){return h>0;})&&!opt.temp&&!opt.info)return fail('동을 하나 이상 선택하세요.');
  }
  if(!houses.length&&(opt.count||opt.temp||opt.note||opt.sum))return fail('동을 하나 이상 선택하세요.');
  if(typeof XLSX==='undefined')return fail('엑셀 파일을 만드는 도구를 불러오지 못했습니다. 화면을 새로고침한 뒤 다시 시도하세요.');
  if(!S.dl)return fail('이 기기에서는 파일 저장을 사용할 수 없습니다.');
  var btn=document.querySelector('#bkBox [data-act="xl-go"]');if(btn)btn.disabled=true;
  try{
    toast('엑셀 만드는 중…');
    var cycles=S.cycles.filter(function(c){return ids.indexOf(c.id)>=0;}).sort(function(a,b){return a.stockDate<b.stockDate?-1:1;});
    var datas=[];for(var i=0;i<cycles.length;i++){datas.push(await xlGetData(cycles[i].id));}
    var sheets=xlBuild(cycles,datas,opt);
    if(!sheets.length)return fail('선택한 조건에 맞는 내용이 없습니다. 내용이나 동을 다시 선택하세요.');
    var wb=XLSX.utils.book_new(),used={};
    sheets.forEach(function(sh){
      var nm=xlSheetName(sh.name),k=nm,n=2;while(used[k]){k=xlSheetName(nm.slice(0,28)+' '+n);n++;}used[k]=1;
      var ws=XLSX.utils.aoa_to_sheet(sh.aoa);
      ws['!cols']=sh.aoa[0].map(function(h,ci){var w=String(h).length*2+2;sh.aoa.slice(1,40).forEach(function(r){var l=String(r[ci]==null?'':r[ci]).length;if(l>w)w=l;});return {wch:Math.min(Math.max(w,8),40)};});
      XLSX.utils.book_append_sheet(wb,ws,k);
    });
    var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    var name=cycles.length===1?'worklog_'+cycles[0].stockDate+'.xlsx':'worklog_'+cycles.length+'cycles_'+todayStr()+'.xlsx';
    try{await S.dl.save({filename:name,data:out});toast('엑셀 파일을 저장했습니다');$('bkBox').innerHTML='';}
    catch(e){if(!(e&&e.code==='declined'))fail('파일을 저장하지 못했습니다. 다시 시도하세요.');}
  }catch(e){fail('엑셀을 만들지 못했습니다. 다시 시도하세요.');handleErr(e);}
  finally{if(btn)btn.disabled=false;}
}

}

var TO='__timeout__';

        if(S.user){

  }catch(e){S.db=null;}
  if(!S.db){S.ready=true;render();return;}
  if(!S.canWrite)notice('이 계정은 입력 권한이 없습니다. 관리자에게 문의하세요.',false);
  S.status='입식 목록 불러오는 중…';render();
  try{
    S.db.doc('settings/main').onSnapshot(function(d){
      S.settings=d.exists?d.data():null;
    },function(e){});
  }catch(e){}
  if(isOwner()){try{
    S.db.collection('settle').onSnapshot(function(sn){
      if(sn.empty&&sn.metadata&&sn.metadata.fromCache)return;
      var m={};sn.docs.forEach(function(d){var x=d.data();if(x&&x.ship)m[d.id]={date:x.ship.date||'',ready:shipReady(x)};});
      S.shipMap=m;if($('cycList'))fillList();renderHeader();
    },function(e){});
  }catch(e){}}
  if(isOwner()){try{
    S.db.doc('settings/defaults').onSnapshot(function(d){
      if(!d.exists&&d.metadata&&d.metadata.fromCache)return;
      S.defs=d.exists?d.data():null;S.defsLoaded=true;
      if($('homeForm')&&!S.editId)prefillTerms();
    },function(e){S.defsLoaded=true;});
  }catch(e){}}
  if(isOwner()){try{
    S.db.doc('settings/subsidy').onSnapshot(function(d){
      if(!d.exists&&d.metadata&&d.metadata.fromCache)return;
      S.sub=d.exists?d.data():null;
      if(S.tab==='settle')refreshSettle();
      fillNSub();
    },function(e){});
  }catch(e){}}
  try{
    S.db.collection('cycles').onSnapshot(function(sn){S.dbg.실시간=sn.docs.length+'건'+(sn.metadata&&sn.metadata.fromCache?'(캐시)':'');onCycles(sn);},function(e){S.dbg.실시간='오류 '+((e&&(e.code||e.message))||'?');handleErr(e);});
  }catch(e){handleErr(e);}
  loadCycles(0);
  startTodos();refreshUsage();setInterval(function(){if(!document.hidden)refreshUsage();},300000);setInterval(function(){if(!document.hidden&&S.tab==='input')loadEnv();},600000);
  setTimeout(function(){
    if(!S.ready){S.status='저장소 응답이 늦습니다. 자동으로 다시 시도하는 중…';render();}
  },8000);
  var tick=setInterval(function(){
    if(S.ready){clearInterval(tick);return;}
    S.status='저장소 응답이 늦습니다. 자동으로 다시 시도하는 중…\n['+dbgTxt()+']';render();
  },3000);
}

/* 읽기 사용량 세기: 이 기기가 서버에서 읽은 기록 줄 수를 세어 몇 분마다 usage/{날짜} 문서에 합산한다 (추정치) */
var LIM=50000,pend=0,pendDay=null;

function isOwnerNow(){return !CFG.ownerEmail||!!(fuser&&fuser.email&&normMail(fuser.email)===normMail(CFG.ownerEmail));}
function flush(){
  if(!pend||!fdb||!fuser)return;
  var n=pend,day=pendDay;pend=0;persist();
  var role=isOwnerNow()?'owner':'staff',inc=function(x){return (firebase.firestore.FieldValue&&firebase.firestore.FieldValue.increment)?firebase.firestore.FieldValue.increment(x):x;};
  var by={};by[role]=inc(n);
  try{fdb.doc('usage/'+day).set({total:inc(n),by:by,upd:Date.now()},{merge:true}).catch(function(){pend+=n;persist();});}
  catch(e){pend+=n;persist();}
}
function count(n){
  if(!(n>0))return;

}
function cntSnap(sn,listen,fr){
  try{
    if(!sn||(sn.metadata&&(sn.metadata.fromCache||sn.metadata.hasPendingWrites)))return;
    /* 폰 저장을 켜면 처음 받은 서버 결과가 '바뀐 것만' 담길 수 있어, 리스너마다 처음 한 번은 전체 줄 수로 세어 넉넉하게 추정한다 */
    if(sn.docs!==undefined){var first=!!(fr&&fr.v);if(fr)fr.v=false;count(listen&&sn.docChanges&&!first?sn.docChanges().length:sn.size);}else count(1);
  }catch(e){}
}
function wrap(o){
  if(!o||typeof o!=='object')return o;
  return new Proxy(o,{get:function(t,k){
    var v=t[k];
    if(typeof v!=='function')return v;
    if(k==='get')return function(){var r=v.apply(t,arguments);return (r&&r.then)?r.then(function(sn){cntSnap(sn,false);return sn;}):r;};
    if(k==='onSnapshot')return function(){
      var a=Array.prototype.slice.call(arguments);
      var fr={v:true};for(var i=0;i<a.length;i++){if(typeof a[i]==='function'){(function(f,j){a[j]=function(sn){cntSnap(sn,true,fr);return f.apply(this,arguments);};})(a[i],i);break;}}
      return v.apply(t,a);
    };
    return function(){
      var r=v.apply(t,arguments);
      return (r&&typeof r==='object'&&!r.then&&(typeof r.onSnapshot==='function'||typeof r.get==='function'))?wrap(r):r;
    };
  }});
}
