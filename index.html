<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="작업일지">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>오리농장 작업일지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Oxanium:wght@500;600;700&display=swap">
<style>
/* 레이아웃: 한 손으로 쓰는 세로 화면. 위에 입식 제목, 가운데 동별 카드, 아래 고정 탭(입력·기록·평균) */
:root{
  /* 야간 관제실: 깊은 청록 슬레이트 바탕 + 놋쇠빛 포인트(축사 모니터 앱과 같은 색) */
  --bg:#0C1215; --surface:#141D22; --surface2:#1A262D; --ink:#EEF3F2; --muted:#93A5AC; --line:#2A3A43;
  --accent:#D9B36C; --accent-ink:#1B1408; --warn:#FFA53D; --bad:#FF6B6B; --good:#45D98A; --water:#4FB4FF;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-display:"Oxanium","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  /* 동별 색(그래프·동 카드 윗줄·바로가기 공통): 1~5동 */
  --s1:#4C8DFF;--s2:#FF8A4C;--s3:#2FD39A;--s4:#F5CF3F;--s5:#F07FB0;--s6:#A98BFF;--grid:#22313A;--axis:#3A4C56;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:15px/1.5 var(--font-body);
  padding-block:0 92px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:980px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-direction:column;gap:10px;padding-top:14px;padding-bottom:12px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cyc{display:flex;align-items:baseline;gap:10px;min-width:0;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer}
.cyc-title{font-family:var(--font-display);font-size:clamp(20px,6vw,27px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cyc-age{font-size:14px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 11px;white-space:nowrap}
.caret{color:var(--muted)}
.notice{margin:0;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.notice.bad{border-color:var(--bad)}

.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pane{display:flex;flex-direction:column;gap:14px}
.pane[hidden]{display:none}
.state{padding:28px 18px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.state h2{margin:0;color:var(--ink);font-family:var(--font-display);font-weight:400;font-size:22px}
.state p{margin:0;max-width:34ch}

.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar input[type=date]{flex:1 1 150px;min-width:0;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:17px}
.datebar .btn{padding:0 14px}
.todobox{display:grid;grid-template-columns:1fr;gap:8px}
.tdcol{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tdcol h3{margin:0;font-size:14px;color:var(--muted);font-weight:700}
.tdlist{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.tdi{display:flex;align-items:flex-start;gap:6px;padding:3px 0;font-size:14px}
.tdi input{width:22px;height:22px;flex:none;margin:1px 0 0}
.tdt{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.4}
.tdt small{display:block;color:var(--muted);font-size:11px}
.tdi.done .tdt{text-decoration:line-through;color:var(--muted)}
.tdx{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px;min-height:28px}
.tdadd{display:flex;gap:6px}
.tdadd input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 8px;font-size:15px}
.tdadd .btn{padding:0 10px;min-height:40px}
.envbar{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0 2px;font-size:15px}
.envbar[hidden]{display:none}
.envl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.envbar .wx{font-size:20px;font-weight:700}.envbar .wx .ico{margin-right:6px}
.envbar .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.mm{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}.mm b{font-size:18px;font-variant-numeric:tabular-nums}
.wxc{display:flex;gap:4px;align-items:center;white-space:nowrap;font-size:13px}.wxc .wxi{font-size:22px}.wxs{font-size:12px;color:var(--muted);white-space:nowrap}
.tdadd{flex-direction:column}.tdadd input{flex:none;width:100%;box-sizing:border-box}.tdadd .btn{width:100%}
.tdempty{color:var(--muted);font-size:13px}
.rotd{fill:var(--surface);stroke-width:2.5;pointer-events:none}
.tdhist[hidden]{display:none}
.tdbar{display:flex;justify-content:flex-end;margin-top:6px}
.tdbar .btn{min-height:36px;font-size:14px;padding:0 12px}
.tdhist{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;margin-top:6px;display:flex;flex-direction:column;gap:4px;max-height:320px;overflow:auto}
.tdhist .tdi .tdt{text-decoration:line-through;color:var(--muted)}
.tdhist .tdt small{text-decoration:none}
.tdundo{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font-size:12px;padding:4px 8px;white-space:nowrap}
.sumline{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted)}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}

.houses{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.house{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.house-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.house-head h3{margin:0;line-height:1}
.house-head .hn{display:inline-block;font-family:var(--font-display);font-weight:800;font-size:42px;line-height:1.05;border-left:12px solid var(--hc,var(--accent));padding-left:10px;letter-spacing:-.5px}
.house-now{text-align:right;color:var(--muted);font-size:13px;line-height:1.3}
.house-now b{display:block;font-family:var(--font-display);font-weight:400;font-size:25px;color:var(--ink);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-label{display:flex;flex-direction:column;min-width:0}
.row-label span{font-weight:700;display:inline-flex;align-items:center;gap:6px}
.row-label .ico{--is:30px}
.row-label small{color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:flex;gap:6px;flex:0 0 auto}
.qin,.tin,.hin,.kin,.memo,.wfield input,.nfield input{border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:18px;padding:0 12px}
.qin{width:112px;height:46px;text-align:right;font-variant-numeric:tabular-nums}
.sign{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.sign.neg{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.temps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.temps .tp{display:flex;align-items:center;gap:3px;min-width:0}
.temps .tp .ico{--is:26px;flex:none}
.temps .tp input{flex:1;min-width:0;width:100%;padding:0 4px;font-size:17px;text-align:center}
.temps .tp i{font-style:normal;color:var(--muted);font-weight:700}
.temps label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.tl{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.tl .ico{--is:24px}
.tin,.hin{width:100%;height:46px;text-align:right;font-variant-numeric:tabular-nums}
.hums{margin-top:8px}
.works{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:10px 0 4px}
.ftrow{display:flex;gap:16px;flex-wrap:wrap;padding:0 0 2px}
.ftsum{color:var(--muted);font-size:13px;padding:0 0 6px}
.ck{display:flex;align-items:center;gap:8px;min-height:44px;font-size:16px}
.ck input{width:24px;height:24px;margin:0}
.hkl[hidden]{display:none}
.fdt input{width:100%;height:42px;text-align:right;padding:0 6px;font-size:17px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.fdt td,.fdt th{padding:4px 3px;text-align:center}
.feedcard .wfield{margin:8px 0}
#fdet .ftrow{margin:4px 0 8px}
.falrow{display:flex;align-items:center;gap:8px;padding:2px 0 8px;font-size:14px;color:var(--muted)}
.falrow[hidden]{display:none}
.fat{color:var(--accent,#1f7a5a);font-size:15px}
.ftmain{margin:2px 0 8px}
.falrow .btn{flex:none;min-height:44px;padding:0 12px;margin-left:auto}
.falrow input{flex:1;max-width:120px;height:44px;text-align:right;padding:0 8px;font-size:18px;border:2px solid var(--accent,#1f7a5a);border-radius:8px;background:#fff}
.fmemo{display:block;margin-top:10px;font-size:14px;color:var(--muted)}
.fmemo textarea{display:block;width:100%;margin-top:4px;padding:8px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit}
.hkl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.kin{width:96px;height:44px;text-align:right;font-variant-numeric:tabular-nums}
.kin:disabled{opacity:.45}
.memo{width:100%;min-height:68px;padding:10px 12px;resize:vertical;font-size:16px;line-height:1.45}
.memo-label{font-size:13px;color:var(--muted);margin-bottom:-6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.chip.neg{color:var(--bad)}
.chip small{color:var(--muted)}
.chip button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.wide{grid-column:1/-1}
.krow{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px;margin-bottom:8px}
.kc{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.kc span{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.kc b{display:block;font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.25;font-variant-numeric:tabular-nums}
.kc small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
#kpis.kpis{display:block}
.kc .ico{--is:22px;margin-right:2px;display:inline-block;vertical-align:middle}
.vset{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.vset .big{font-family:var(--font-display);font-weight:400;font-size:21px}
.vset .ico{--is:28px;margin-right:4px;vertical-align:middle}
.wfield{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.wfield span{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.wfield input{width:130px;height:46px;text-align:right;font-variant-numeric:tabular-nums}
.hint,.state p{white-space:pre-wrap;overflow-wrap:anywhere}
.hint{margin:0;color:var(--muted);font-size:13px}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:420px}
.tbl th,.tbl td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:13px;color:var(--muted);font-weight:500}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl td.memo-row{white-space:normal;text-align:left;color:var(--muted);font-size:13px;padding-top:0}
.datebtn{background:none;border:0;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;line-height:1.25;font-weight:700;color:var(--accent)}
.datebtn small{color:var(--muted);font-weight:400}
.bad{color:var(--bad)}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* 그림(아이콘): 배경이 투명한 작은 그림을 글자 옆에 쓴다 */

.tab{flex:1;min-width:0;min-height:62px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font-weight:700;font-size:12.5px;padding:2px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab .ico{--is:28px;opacity:.72;filter:saturate(.75)}
.tab[aria-selected=true] .ico{opacity:1;filter:none}
.tab[aria-selected=true]{color:var(--accent);border-top-color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}
.sheet{position:fixed;inset:0;background:rgba(10,20,17,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:14px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px}
.panelhead{display:flex;justify-content:space-between;align-items:center}
.cyc-list{display:flex;flex-direction:column;gap:8px}
.cyc-item{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left}
.cyc-item[aria-current=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cyc-item span{color:var(--muted);font-size:13px}
.nform{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.nfield{display:flex;flex-direction:column;gap:4px;font-weight:700}
.nfield input{height:48px;font-weight:400}
.prev{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.prev div{background:var(--bg);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.prev div span{color:var(--muted)}
.err{margin:0;color:var(--bad);font-size:14px}
.tbl.sum{min-width:0}.tbl.sum th,.tbl.sum td{padding:8px 8px;white-space:nowrap}.tbl.sum th:first-child,.tbl.sum td:first-child{min-width:112px;font-size:13px;position:sticky;left:0;background:var(--surface)}
.nnote{width:100%;min-height:68px;padding:10px 12px;resize:vertical;font:400 16px/1.45 var(--font-body);border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.gctl{display:flex;flex-direction:column;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.lg[aria-pressed=false]{opacity:.45}
.sw{display:inline-block;width:16px;height:3px;border-radius:2px}
.gwrap{position:relative}
.gsvg{display:block;width:100%;height:auto;touch-action:pan-y}
.gsvg text{fill:var(--muted);font-size:11px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.gl{stroke:var(--grid);stroke-width:1}
.ga{stroke:var(--axis);stroke-width:1}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gcur{stroke:var(--axis);stroke-width:1}
.gtip{position:absolute;top:6px;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.18);min-width:128px;z-index:5}
.gtip b{display:block;margin-bottom:4px}
.gtip div{display:flex;align-items:center;gap:10px;justify-content:space-between;font-variant-numeric:tabular-nums}
.gtip span{display:flex;align-items:center;gap:6px}
.gtip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.srow b{font-family:var(--font-display);font-weight:400;font-size:20px}
.sin{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 8px;font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:0;text-transform:uppercase;width:100%;min-width:0}
.wrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wrow b{width:44px;font-family:var(--font-display);font-weight:400;font-size:20px}
.win{width:72px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.flist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.flist div{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.flist .ok{color:var(--good);font-weight:700}
.flist .no{color:var(--bad);font-weight:700}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;align-items:center;gap:10px;min-height:44px}
.radios input{width:22px;height:22px}
.mute{color:var(--muted)}
.tbl td small{display:block;color:var(--muted);font-size:11px}
.cyc-card{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cyc-card[aria-current=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cyc-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.cyc-main b{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cyc-main span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.cyc-main b .cyc-age{font-family:var(--font-body);font-size:14px;color:var(--accent-ink)}
.cyc-main b .badge{color:var(--accent-ink);font-size:12px}
.badge{font-family:var(--font-body);font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 9px}
.cyc-btns{display:flex;gap:8px;flex-wrap:wrap}
.cyc-btns .btn{min-height:42px;padding:0 14px;flex:1 1 auto}
.confirm{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bk{width:100%;min-height:150px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink)}
.sd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;min-height:48px}
.sd-row .s{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.sfld{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0 10px;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.sd-row .sfld{width:150px}
.sfld.sm{width:104px}
select.sfld{text-align:left;padding-right:4px}
.frow{display:flex;align-items:center;gap:8px}.frow .fname{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:48px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;color:var(--ink)}
.frow .fname b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frow .fname small{color:var(--muted);font-weight:400}
#sdFiles{display:flex;flex-direction:column;gap:8px}
.fview{align-items:center}.fview .panel{border-radius:16px;max-height:94%}.fview img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.vrow{display:flex;align-items:center;gap:8px}.vrow>span:first-child{width:56px;font-weight:700}.vrow .sfld{flex:1}.vrow .u{color:var(--muted)}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 112px auto;gap:8px;align-items:center}.erow .sfld:first-child{text-align:left}
.tbl.stmt{min-width:0}.tbl.stmt td:first-child{white-space:normal}.tbl.stmt td{vertical-align:top}
.tbl.stmt td:nth-child(n+2){text-align:right;white-space:nowrap}
.tbl.stmt td:nth-child(3){color:var(--muted)}
.tbl.stmt tr.net td:nth-child(3){color:var(--ink)}
.tbl.stmt tr.sec td{background:var(--surface2);font-weight:700;color:var(--ink);padding:6px 8px}
.tbl.stmt tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.tbl.stmt tr.net td{font-weight:700;font-size:18px;background:var(--bg)}
.tbl.mon{min-width:520px}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.seg button{transition:background .12s,color .12s}}

/* ===== v15 테마: 축사 모니터(스마트팜)와 같은 야간 관제실 느낌 — 어두운 청록 바탕 + 놋쇠색 포인트, 큰 글씨 ===== */
html{background:var(--bg)}
body{font-size:17px;line-height:1.45;padding-bottom:calc(124px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
h2,h3{text-wrap:balance}
main h2,.card h2,.panel h2,.state h2{font-weight:700 !important;letter-spacing:-.01em}
#login h1{font-weight:700 !important}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.kpi b,.kc b,.house-now b,.vset .big,.cyc-main b,.srow b,.wrow b{font-weight:600}

/* 맨 위: 농장 로고 · 입식 제목 · 큰 일령 */
.top{padding-top:12px;padding-bottom:10px;gap:8px}
.titlebar{gap:12px}
.cyc{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:0;color:var(--ink)}
.logo{width:48px;height:48px;border-radius:14px;flex:none;object-fit:cover;background:var(--surface2);border:1px solid var(--line)}
.cyc-txt{display:grid;min-width:0;gap:1px}
.cyc-title{font-weight:700;font-size:clamp(20px,5.8vw,27px);letter-spacing:-.01em}
.cyc-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agebox{flex:none;text-align:right;line-height:1}
.agebox[hidden]{display:none}
.agebox b{display:block;font-family:var(--font-display);font-weight:700;font-size:38px;color:var(--accent);font-variant-numeric:tabular-nums}
.agebox span{font-size:13px;color:var(--muted);font-weight:600}
.notice{border-radius:14px}
.notice.bad{background:rgba(255,107,107,.12);color:#FFD5D5}

/* 버튼 · 카드 · 입력칸 */
.btn{min-height:50px;border-radius:14px;background:var(--surface2);font-size:16px}
.btn:active,.sign:active,.hjump button:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:rgba(255,107,107,.1)}
.card,.house,.tdcol,.envbar,.tdhist{border-radius:20px;background:linear-gradient(180deg,var(--surface2),var(--surface))}
.card{padding:16px}
.kpi,.kc,.prev div,.flist div{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px}
.cyc-card{background:rgba(255,255,255,.03);border-radius:16px}
.qin,.tin,.hin,.kin,.memo,.wfield input,.nfield input,.sfld,.nnote,.datebar input[type=date],.tdadd input,.fdt input,.fmemo textarea,.bk{background:var(--bg);color:var(--ink);border-color:var(--line);border-radius:12px}
.qin:focus,.tin:focus,.hin:focus,.kin:focus,.memo:focus,.sfld:focus,.wfield input:focus,.nfield input:focus,.tdadd input:focus{border-color:var(--accent)}
.falrow input{background:var(--bg);color:var(--ink);border-color:var(--accent)}
.datebar input[type=date]{height:50px;font-family:var(--font-display);font-weight:600}
.datebar .btn{min-width:50px}
.datebar .btn[data-act=prev],.datebar .btn[data-act=next]{font-size:26px;padding:0}

/* 입력 탭: 요약 알약 · 동 바로가기 · 동 카드 */
.sumline{gap:8px}
.sumline>span{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 6px;padding:8px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.sumline b{font-family:var(--font-display);font-size:18px}
.mm b{font-family:var(--font-display);font-size:20px}
.hjump{position:sticky;top:0;z-index:15;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px 0;background:var(--bg)}
.hjump button{min-height:56px;padding:4px 2px;border-radius:14px;border:1px solid var(--line);border-bottom:5px solid var(--hc,var(--accent));background:var(--surface2);color:var(--ink);cursor:pointer;display:grid;place-items:center;align-content:center;gap:0}
.hjump b{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1}
.hjump b i{font-style:normal;font-family:var(--font-body);font-size:14px;color:var(--muted);margin-left:1px}
.hjump small{font-size:12px;font-weight:600;color:var(--warn);min-height:15px;line-height:1.2}
.house{position:relative;overflow:hidden;padding:20px 14px 16px;scroll-margin-top:84px}
.house::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--hc,var(--accent))}
.house-head .hn{border-left:0;padding-left:0;font-family:var(--font-display);font-weight:700;font-size:58px;line-height:.9;color:var(--accent);letter-spacing:0}
.house-head .hn small{font-family:var(--font-body);font-size:23px;font-weight:700;color:var(--ink);margin-left:4px}
.house-now{font-size:14px}
.house-now b{font-size:30px}
.house .row{padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.house .row.r-dead{border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.07)}
.house .row.r-cull{border-color:rgba(255,165,61,.4);background:rgba(255,165,61,.07)}
.house .row.r-feed{border-color:rgba(217,179,108,.42);background:rgba(217,179,108,.08)}
.row-label span{font-size:18px}
.row-label .ico{--is:34px}
.row-label small{font-size:13px}
.qin{width:106px;height:54px;font-family:var(--font-display);font-size:23px;font-weight:600}
.sign{width:54px;height:54px;border-radius:14px;background:var(--surface2);color:var(--ink);font-size:28px}
.sign.neg{background:var(--bad);border-color:var(--bad);color:#2A0505}
.tin,.hin{height:52px;font-family:var(--font-display);font-weight:600}
.temps .tp .ico{--is:30px}
.temps .tp input{font-size:19px}
.ck{padding:4px 14px 4px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);min-height:50px;font-weight:600}
.ck input{width:26px;height:26px;accent-color:var(--good)}
.ck:has(input:checked){color:var(--good);border-color:rgba(69,217,138,.5);background:rgba(69,217,138,.1)}
.kin{height:50px;font-family:var(--font-display)}
.chip{background:var(--surface2);border:1px solid var(--line);font-size:14px}
.tdi{font-size:16px;gap:8px;padding:5px 0}
.tdi input{width:26px;height:26px}
.tdadd input{height:48px}
.tdadd .btn{min-height:48px}

/* 표 · 선택 버튼 · 그래프 */
.tbl td{font-size:16px}
.tbl.sum th:first-child,.tbl.sum td:first-child{background:#19252C}
.tbl.stmt tr.sec td{background:var(--surface2);color:var(--accent)}
.tbl.stmt tr.net td{background:rgba(217,179,108,.12);color:var(--accent)}
.tbl.stmt tr.net td:nth-child(3){color:var(--accent)}
.seg button{min-height:46px;padding:0 14px;border-radius:14px;background:var(--surface2);color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{color:var(--accent-ink)}
.lg{background:var(--surface2);min-height:44px}
.gsvg text{font-size:12px;font-family:var(--font-display)}
.gzoom{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.gzoom button{min-width:52px;height:50px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:22px;font-weight:700;cursor:pointer}
.gzoom button:active{transform:scale(.96)}
.gzoom button[disabled]{opacity:.35;cursor:default}
.gzoom button.wk{font-size:16px;color:var(--muted);min-width:48px}
.gzoom button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gzoom button.all{font-size:16px}
.gzoom .zr{flex-basis:100%;font-size:14px;color:var(--muted)}
.gzoom .zr b{color:var(--accent);font-family:var(--font-display);font-size:17px}
.ln{stroke-width:2.5}
.rotd{fill:var(--bg)}
.gtip{background:var(--surface2);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.datebtn{font-family:var(--font-display);font-size:17px}

/* 접었다 펴는 칸(새 입식 등록) */
.foldhead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:46px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.foldhead h2{margin:0}
.foldhead .caret{font-size:24px;color:var(--accent);transition:transform .15s}
.foldhead[aria-expanded=true] .caret{transform:rotate(180deg)}
.foldbody{display:flex;flex-direction:column;gap:12px}
.foldbody[hidden]{display:none}

/* 아래에 떠 있는 둥근 메뉴 */
.tabs{left:50%;right:auto;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(640px,calc(100% - 20px));gap:4px;padding:6px;border:1px solid var(--line);border-radius:24px;background:#131B1F;box-shadow:0 16px 36px -12px rgba(0,0,0,.75)}
.tab{border-top:0;border-radius:18px;min-height:62px;font-size:13.5px;padding:4px 0}
.tab .ico{--is:30px;opacity:.85;filter:none}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-top-color:transparent}
.toast{bottom:calc(104px + env(safe-area-inset-bottom,0px));border-radius:16px;padding:12px 20px;font-size:16px;text-align:center}
.signout button{background:var(--surface2);border-radius:12px;padding:8px 14px;font-size:14px}
@media (min-width:700px){.houses{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}}
.datebar{flex-wrap:nowrap;gap:6px}
.datebar input[type=date]{flex:1 1 0;font-size:16px;padding:0 8px}
.datebar .btn{min-width:46px;padding:0 10px}
.datebar .btn[data-act=today]{font-size:15px;padding:0 10px}
.datebar .btn[data-act=today] .ico{--is:22px !important;margin-right:4px}
.row-label span{font-size:17px;white-space:nowrap}
.row-label .ico{--is:30px}
.qin{width:96px}
/* v16: 사료 배분 제외 · 스마트팜(급수·급이) · 통계 나란히 보기 · 변화 찾기 */
.fdt .fx{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;white-space:nowrap}
.fdt .fx input{width:24px;height:24px;margin:0}
.fdt tr.off td:not(:nth-child(2)){opacity:.4}
.fdt tr.off .fx span{color:var(--muted)}
.tbl.fdt{min-width:0}
.fdt tr:not(.off) .fx span{display:none}
.fdt .fx span{font-size:12px}
.fdt td:nth-child(2),.fdt th:nth-child(2){width:46px;padding-left:0;padding-right:0}
.smart{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;padding:8px 12px;border-radius:14px;border:1px solid rgba(79,180,255,.35);background:rgba(79,180,255,.07)}
.smart[hidden]{display:none}
.smart b{font-family:var(--font-display);font-size:18px}
.smart small{color:var(--muted)}
.gpre{display:flex;flex-wrap:wrap;gap:6px}
.gpre button{min-height:48px;padding:0 14px;border-radius:14px;border:1px dashed var(--accent);background:rgba(217,179,108,.08);color:var(--ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center}
.gpre button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-style:solid}
.glab{font-size:13px;color:var(--muted);font-weight:700;margin:2px 0 -2px}
.gptl{font-size:13px;font-weight:700;fill:var(--ink) !important;font-family:var(--font-body) !important}
.gnone{font-size:13px;fill:var(--muted) !important}
.gmk{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 4;opacity:.75}

<script>
(function(){
'use strict';
var AREAS=[253,363,363,416,140];            /* 동별 면적: 배분 계산에만 사용, 화면에는 표시하지 않음 */
var SUM=AREAS.reduce(function(a,b){return a+b;},0);
var SERVICE=0.02;
var HOUSES=[1,2,3,4,5];
var FT=[{k:'crumble',label:'크럼블'},{k:'early',label:'전기'},{k:'late',label:'후기'}];
function ftLabel(k){var o=FT.filter(function(x){return x.k===k;})[0];return o?o.label:'';}
function ftKey(k){return ftLabel(k)?k:'none';}
var TYPES=[{k:'cull',label:'도태',int:true},{k:'dead',label:'폐사',int:true},{k:'feed',label:'사료 입고',int:false}];
var FIELDS=[{f:'tmax',w:'tmax',label:'최고'},{f:'tmin',w:'tmin',label:'최저'}];
var HFIELDS=[{f:'hmax',w:'tmax',label:'최고'},{f:'hmin',w:'tmin',label:'최저'}];
/* 예전(아침·점심·저녁) 기록: 값이 2개 이상이면 그중 큰 값=최고, 작은 값=최저로 대신 보여 준다 */
var LEGF={tmax:[['tm','tn','te'],1],tmin:[['tm','tn','te'],0],hmax:[['hm','hn','he'],1],hmin:[['hm','hn','he'],0]};
function thv(dd,f){
  if(!dd)return null;var v=dd[f];if(typeof v==='number'&&isFinite(v))return v;
  var l=LEGF[f];if(!l)return null;
  var a=l[0].map(function(k){return dd[k];}).filter(function(x){return typeof x==='number'&&isFinite(x);});
  return a.length>=2?(l[1]?Math.max.apply(null,a):Math.min.apply(null,a)):null;
}
var ALLF=FIELDS.concat(HFIELDS);
function fieldsFor(m){return m==='humi'?HFIELDS:FIELDS;}
function isEnv(m){return m==='temp'||m==='humi';}

function $(id){return document.getElementById(id);}
function fmt(n,d){return Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d||0,minimumFractionDigits:d||0});}
function fmtN(n){return fmt(n,Number.isInteger(Math.round(n*10)/10)&&Math.abs(n-Math.round(n))<0.05?0:1);}
function fmtT(v){return v==null?'–':v.toFixed(1);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function isNum(v){return typeof v==='number'&&isFinite(v);}
function mean(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
function todayStr(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});}
function dayNum(s){var p=s.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/86400000);}
function addDays(s,n){return new Date((dayNum(s)+n)*86400000).toISOString().slice(0,10);}
function dot(s){return String(s==null?'':s).replace(/^\d{2}(?=\d{2}-\d{2}-\d{2}$)/,'').replace(/-/g,'.');}
function ageOf(c,d){return dayNum(d)-dayNum(c.stockDate)+1;}

var S={db:null,user:null,uid:null,canWrite:true,cycles:[],ready:false,cid:null,date:todayStr(),tab:'home',editId:null,delId:null,restore:null,dl:null,settings:null,imp:null,stale:false,cyclesDef:false,sync:{e:true,d:true},g:{ship:{},shipPending:{},mode:'house',metric:'temp',win:'all',cum:false,off:{},table:false,scope:'all',sel:[],color:{},cache:{},pending:{},selInit:false,mets:['drate','temp'],mark:'rot',preset:'base'},
  entries:new Map(),days:new Map(),filter:'all',unsubs:[],inKey:null,avgKey:null,status:'저장소 연결 중…',step:'start',dbg:{}};
var VER='v18';
function dbgTxt(){var d=S.dbg,k,o=[VER];for(k in d)o.push(k+':'+d[k]);return o.join(' · ');}

function cyc(){for(var i=0;i<S.cycles.length;i++){if(S.cycles[i].id===S.cid)return S.cycles[i];}return null;}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

var toastTimer=null;
function IC(k,sz){return '<span class="ico i-'+k+'" aria-hidden="true"'+(sz?' style="--is:'+sz+'px"':'')+'></span>';}
function EM(ch){return '<span class="em" aria-hidden="true">'+ch+'</span>';}
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},1600);}
function notice(msg,bad){var n=$('notice');if(!msg){n.hidden=true;return;}n.textContent=msg;n.className='notice'+(bad?' bad':'');n.hidden=false;}
function handleErr(e){
  var code=e&&e.code;
  if(code==='invalid_argument'||code==='permission-denied'){S.canWrite=false;notice('이 계정으로는 입력할 수 없습니다. 관리자에게 계정 등록을 요청하세요.',true);updateRO();}
  else if(code==='quota_exceeded'){notice('저장 공간이 가득 찼습니다. 지난 입식 기록을 삭제한 뒤 다시 시도하세요.',true);}
  else if(code==='revoked'){notice('접근 권한이 바뀌어 더 이상 저장할 수 없습니다.',true);}
  else{toast('저장하지 못했습니다. 다시 시도하세요.');}
}

/* ---------- 입식 배분: 총 마릿수 × 1.02 를 동 면적 비례로 나눔 ---------- */
function allocate(total){
  var target=Math.round(total*(1+SERVICE));
  var raw=AREAS.map(function(a){return target*a/SUM;});
  var fl=raw.map(Math.floor);
  var rem=target-fl.reduce(function(a,b){return a+b;},0);
  var order=raw.map(function(r,i){return [r-fl[i],i];}).sort(function(a,b){return b[0]-a[0];});
  for(var k=0;k<rem;k++){fl[order[k][1]]++;}
  return fl;
}

/* ---------- 집계 ---------- */
function agg(){
  var out={tot:{},byDate:{},dates:new Set(),ft:{crumble:0,early:0,late:0,none:0}};
  HOUSES.forEach(function(h){out.tot[h]={cull:0,dead:0,feed:0};});
  S.entries.forEach(function(e){
    var h=e.h;if(!out.tot[h])return;var q=Number(e.q)||0;
    out.tot[h][e.t]+=q;
    if(e.t==='feed')out.ft[ftKey(e.ft)]+=q;
    var d=out.byDate[e.d]||(out.byDate[e.d]={});
    var x=d[h]||(d[h]={cull:0,dead:0,feed:0});x[e.t]+=q;out.dates.add(e.d);
  });
  S.days.forEach(function(v){if(v&&v.d)out.dates.add(v.d);});
  return out;
}
function dayDoc(cid,d,h){return S.days.get(cid+'_'+d+'_'+h)||null;}
function headsOf(c,h){return Number(c.heads&&c.heads[h])||0;}
/* 성적 계산 기준 = 서류 입식 마릿수(서비스 2% 제외). 전체 동이면 등록한 입식 마릿수, 일부 동이면 배분 마릿수 ÷ 1.02 */
function docOf(c,hs){
  var init=0;hs.forEach(function(h){init+=headsOf(c,h);});
  if(hs.length>=HOUSES.length&&Number(c.total)>0)return Number(c.total);
  var r=Number(c.serviceRate);if(!(r>=0))r=SERVICE;
  return init/(1+r);
}

/* ---------- 구독 ---------- */
function subscribeCycle(cid){
  S.unsubs.forEach(function(u){try{u();}catch(e){}});S.unsubs=[];
  S.entries=new Map();S.days=new Map();S.inKey=null;S.avgKey=null;S.settle=null;S.stKey=null;
  S.sync={e:false,d:false};
  if(!cid||!S.db)return;
  var onErr=function(e){handleErr(e);};
  /* 아직 확정되지 않은 빈 결과는 무시하고, 확정된 결과만 화면에 반영한다 */
  var apply=function(key,store){return function(s2){
    if(cid!==S.cid)return;
    if(s2.empty&&s2.metadata&&s2.metadata.fromCache)return;
    var m=new Map();s2.docs.forEach(function(d){m.set(d.id,d.data());});
    S[store]=m;S.sync[key]=true;render();
  };};
  var onE=apply('e','entries'),onD=apply('d','days');
  S.unsubs.push(S.db.collection('entries').where('c','==',cid).onSnapshot(onE,onErr));
  S.unsubs.push(S.db.collection('days').where('c','==',cid).onSnapshot(onD,onErr));
  var onS=function(sn){
    if(cid!==S.cid)return;
    if(!sn.exists&&sn.metadata&&sn.metadata.fromCache)return;
    S.settle=sn.exists?Object.assign({},sn.data()):null;
    if(S.tab==='settle')refreshSettle();else if(S.tab==='avg')renderAvg();else if(S.tab==='home')refreshAutoBk();else if(S.tab==='input'){var cx9=cyc();if(cx9&&S.date>inMaxDate(cx9))render();}
  };
  var gotS=false;
  if(isOwner()){S.unsubs.push(S.db.doc('settle/'+cid).onSnapshot(function(sn){if(sn.exists||!(sn.metadata&&sn.metadata.fromCache))gotS=true;onS(sn);},onErr));}
  /* 읽기 절약: 예전에는 실시간 구독과 직접 읽기를 매번 둘 다 해서 같은 기록을 두 번씩 읽었다.
     이제는 실시간 구독이 7초 안에 응답하지 않는 기기에서만 한 번 직접 읽는다. */
  var fb=setTimeout(function(){
    if(cid!==S.cid||!S.db)return;
    if(!S.sync.e)S.db.collection('entries').where('c','==',cid).get().then(onE).catch(function(){});
    if(!S.sync.d)S.db.collection('days').where('c','==',cid).get().then(onD).catch(function(){});
    if(isOwner()&&!gotS)S.db.doc('settle/'+cid).get().then(onS).catch(function(){});
  },7000);
  S.unsubs.push(function(){clearTimeout(fb);});
}
function selectCycle(cid){
  S.cid=cid;if(cid)lsSet('wl-cid',cid);
  subscribeCycle(cid);render();
}
function onCycles(snap,fromGet){
  /* 확정되지 않은 빈 목록은 "입식 없음"으로 보여주지 않는다
     (단, get() 으로 두 번 연속 비어 있다고 확인되면 정말 비어 있는 것) */
  if(snap.empty&&snap.metadata&&snap.metadata.fromCache){
    if(fromGet){S.emptyGets=(S.emptyGets||0)+1;}
    if(!(fromGet&&S.emptyGets>=2))return;
  }
  S.cycles=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;}).sort(function(a,b){return String(b.stockDate).localeCompare(String(a.stockDate));});
  S.ready=true;S.stale=false;S.cyclesDef=true;
  if(!isOwner()&&S.cycles.length&&S.cycles[0].id!==S.cid){selectCycle(S.cycles[0].id);}
  try{lsSet('wl-cyc',JSON.stringify(S.cycles.slice(0,30)));}catch(e){}
  if(!cyc()){
    var pref=lsGet('wl-cid');var next=null;
    for(var i=0;i<S.cycles.length;i++){if(S.cycles[i].id===pref){next=pref;break;}}
    if(!next&&S.cycles.length)next=S.cycles[0].id;
    selectCycle(next);
  }else{
    if(S.cid&&S.db&&!S.unsubs.length)subscribeCycle(S.cid);
    render();
  }
}
/* 입식 목록 색인: 컬렉션 조회가 응답하지 않는 기기에서도 문서 단위 읽기로 목록을 복구한다 */
function idxChange(fn){
  if(!S.db)return Promise.resolve();
  return S.db.doc('settings/index').get().then(function(sn){
    var ids=(sn.exists&&sn.data().ids)||[];ids=ids.slice();
    var next=fn(ids);
    return S.db.doc('settings/index').set({ids:next,updatedAt:Date.now()});
  }).catch(function(){});
}
function idxAdd(id){return idxChange(function(ids){if(ids.indexOf(id)<0)ids.push(id);return ids;});}
function idxDel(id){return idxChange(function(ids){return ids.filter(function(x){return x!==id;});});}
function loadIndex(){
  if(!S.db||S.cyclesDef)return;
  withTimeout(S.db.doc('settings/index').get(),8000).then(function(sn){
    if(sn===TO){S.dbg.색인='시간초과';return;}
    if(S.cyclesDef)return;
    if(!sn.exists){S.dbg.색인='없음';return;}
    var ids=sn.data().ids||[];S.dbg.색인=ids.length+'건';if(!ids.length)return;
    return Promise.all(ids.map(function(id){
      return withTimeout(S.db.doc('cycles/'+id).get(),8000).then(function(d){
        if(d===TO){S.dbg.문서='시간초과';return null;}if(!d.exists){S.dbg.문서='없음';return null;}var o=Object.assign({},d.data());o.id=d.id;return o;
      }).catch(function(){return null;});
    })).then(function(list){
      list=list.filter(Boolean);
      if(S.cyclesDef||!list.length)return;
      onCycles({empty:false,metadata:{fromCache:false},docs:list.map(function(o){var id=o.id;return {id:id,data:function(){var c=Object.assign({},o);delete c.id;return c;}};})},false);
    });
  }).catch(function(e){S.dbg.색인='오류 '+((e&&(e.code||e.message))||'?');});
}
function loadCycles(n){
  if(S.cyclesDef||!S.db)return;
  loadIndex();
  withTimeout(S.db.collection('cycles').get(),8000)

    .catch(function(e){S.dbg.목록='오류 '+((e&&(e.code||e.message))||'?');handleErr(e);})

var chain={},pend={},stamp={};
function saveDayField(h,f,val){
  if(!S.db||!S.cid||!S.canWrite)return;
  if(overAge()){toast('7주령(49일령)까지만 입력할 수 있습니다');return;}
  var date=S.date,cid=S.cid,key=cid+'_'+date+'_'+h;
  var base=Object.assign({c:cid,d:date,h:h},S.days.get(key)||{},pend[key]||{});
  base[f]=val;
  pend[key]=Object.assign({},pend[key]||{});pend[key][f]=val;
  var n=(stamp[key]=(stamp[key]||0)+1);

    .then(function(){if(stamp[key]===n)delete pend[key];toast('저장됨');})
    .catch(function(e){handleErr(e);});
}

/* ---- 할일 메모: 사장 → 직원 / 직원 → 사장 ---- */
var TD_KEEP=12*3600000; /* 완료 후 목록에 남는 시간: 12시간 */
var TODO_SIDES=[{k:'o2s',label:'사장 → 직원',em:'👔'},{k:'s2o',label:'직원 → 사장',em:'👷'}];
function todoMine(side){return isOwner()?side==='o2s':side==='s2o';}
function todoShell(){
  return '<div class="todowrap"><div class="todobox"><section class="tdcol" data-side="all"><div class="tdlist" data-tdlist="all"></div>'+
    '<div class="tdadd"><input class="tdin" id="tdIn_all" type="text" maxlength="200" autocomplete="off" placeholder="할 일 메모" aria-label="할 일 메모"><button type="button" class="btn" data-act="td-add" data-side="all">'+EM('➕')+'추가</button></div></section></div>'+
    '<div class="tdbar"><button type="button" class="btn" data-act="td-hist" id="tdHistBtn">'+EM('✅')+'완료한 메모 보기</button></div><div class="tdhist" id="tdHist" hidden></div></div>';
}
function tdDate(ms){var d=new Date(ms);return (d.getMonth()+1)+'.'+d.getDate();}
function renderTodos(){
  var list=S.todos||[],now=Date.now();
  var box=document.querySelector('[data-tdlist="all"]');if(!box)return;
  var items=list.filter(function(t){return !t.done||(t.doneAt&&now-t.doneAt<TD_KEEP);});
  items.sort(function(a,b){
    if(!!a.done!==!!b.done)return a.done?1:-1;
    return a.done?(b.doneAt||0)-(a.doneAt||0):(b.at||0)-(a.at||0);
  });
  box.innerHTML=items.length?items.map(function(t){
    var mine=todoMine(t.side),au=t.side==='o2s'?'사장':'직원';
    return '<div class="tdi'+(t.done?' done':'')+'"><input type="checkbox" data-td="'+esc(t.id)+'"'+(t.done?' checked':'')+' aria-label="완료 체크">'+
      '<span class="tdt">'+esc(t.text)+'<small>'+au+(t.at?' · '+tdDate(t.at):'')+(t.done&&t.doneAt?' · 완료 '+tdDate(t.doneAt):'')+'</small></span>'+
      ((mine||isOwner())?'<button type="button" class="tdx" data-act="td-del" data-id="'+esc(t.id)+'" aria-label="메모 삭제">×</button>':'')+'</div>';
  }).join(''):'<div class="tdempty">메모 없음</div>';
}
function mergeTodos(){
  var m=new Map();
  [S.todosU,S.todosR].forEach(function(mp){if(mp)mp.forEach(function(v,k){m.set(k,v);});});
  S.todos=Array.from(m.values());renderTodos();
}
function tdMap(sn){var m=new Map();sn.docs.forEach(function(d){var o=Object.assign({},d.data());o.id=d.id;m.set(d.id,o);});return m;}
function startTodos(){
  if(S.todoOn||!S.db)return;S.todoOn=true;S.todos=[];
  setInterval(renderTodos,5*60000); /* 켜 둔 채로도 12시간이 지나면 목록에서 빠지게 */
  /* 미완료 메모 + 완료 후 12시간 이내 메모만 불러온다(그보다 오래된 완료 메모는 '완료한 메모 보기'에서) */
  S.db.collection('todos').where('done','==',false).onSnapshot(function(sn){
    if(sn.empty&&sn.metadata&&sn.metadata.fromCache)return;
    S.todosU=tdMap(sn);mergeTodos();
  },function(e){});
  S.db.collection('todos').where('doneAt','>',Date.now()-TD_KEEP).onSnapshot(function(sn){
    if(sn.empty&&sn.metadata&&sn.metadata.fromCache)return;
    S.todosR=tdMap(sn);mergeTodos();
  },function(e){});
}
function addTodo(side){
  side=isOwner()?'o2s':'s2o';
  var inp=$('tdIn_all');if(!inp||!S.db)return;
  var tx=inp.value.trim();if(!tx)return;
  if(!todoMine(side))return;

    .then(function(){toast('메모를 남겼습니다');}).catch(handleErr);
  inp.value='';
}
function toggleTodo(id,v){
  if(!S.db)return;
  var all=(S.todos||[]).concat(S.todosDone||[]),item=all.filter(function(t){return t.id===id;})[0];
  S.db.doc('todos/'+id).update({done:!!v,doneAt:v?Date.now():null,doneBy:isOwner()?'owner':'staff'}).catch(handleErr);
  if(item){
    item.done=!!v;item.doneAt=v?Date.now():null;
    if(v){if(S.todosDone&&!S.todosDone.some(function(t){return t.id===id;}))S.todosDone.push(item);}
    else{S.todosDone=(S.todosDone||[]).filter(function(t){return t.id!==id;});if(!(S.todos||[]).some(function(t){return t.id===id;}))S.todos=(S.todos||[]).concat([item]);}
  }

function delTodo(id){

  if(S.todosU)S.todosU.delete(id);if(S.todosR)S.todosR.delete(id);
  S.todosDone=(S.todosDone||[]).filter(function(t){return t.id!==id;});renderTodos();renderTdHist();

/* ---- 외부 기상: days 문서 중 외부(h=0) 칸을 쓴다. 따로 읽지 않으므로 읽기 한도를 더 쓰지 않는다.
   라즈베리파이가 하루·며칠·1주·1파트 단위로 한꺼번에 넣어 주면 된다. 필드(모두 선택):
   wx 날씨(clear|partly|cloudy|rain|shower|snow|fog|storm|wind 또는 글씨), pr 강수량 mm(0보다 클 때만 표시),
   ws 하루 평균 풍속 m/s, wd 하루 평균 풍향(각도 0~360 또는 '북동' 같은 글씨), tmax·tmin 최고·최저 기온, hmax·hmin 최고·최저 습도
   1~5동은 같은 tmax·tmin·hmax·hmin 필드를 각 동 칸에 넣는다. */
var WX={clear:['☀️','맑음'],partly:['⛅','구름 조금'],cloudy:['☁️','흐림'],rain:['🌧️','비'],shower:['🌦️','소나기'],snow:['❄️','눈'],fog:['🌫️','안개'],storm:['⛈️','뇌우'],wind:['💨','바람 강함']};
var WDIR=['북','북북동','북동','동북동','동','동남동','남동','남남동','남','남남서','남서','서남서','서','서북서','북서','북북서'];
function wdName(v){if(typeof v==='number'&&isFinite(v))return WDIR[Math.round((((v%360)+360)%360)/22.5)%16]+'풍';if(typeof v==='string'&&v.trim())return v.trim().replace(/풍$/,'')+'풍';return '';}
function extMM(od){return {tmax:thv(od,'tmax'),tmin:thv(od,'tmin'),hmax:thv(od,'hmax'),hmin:thv(od,'hmin')};}
function mmTxt(o){
  var t=[];if(o.tmax!=null||o.tmin!=null)t.push('<span class="mm">'+IC('temp',26)+'<span>최고 <b>'+fmtT(o.tmax)+'</b>℃</span><span>최저 <b>'+fmtT(o.tmin)+'</b>℃</span></span>');
  if(o.hmax!=null||o.hmin!=null)t.push('<span class="mm">'+IC('humi',26)+'<span>최고 <b>'+fmtT(o.hmax)+'</b>%</span><span>최저 <b>'+fmtT(o.hmin)+'</b>%</span></span>');
  return t.join('');
}
function renderEnv(){
  var bar=$('envBar');if(!bar)return;
  var od=dayDoc(S.cid,S.date,0)||{},mm=extMM(od),a='';
  if(od.wx){var k=WX[od.wx];a+='<span class="wx">'+(k?k[0]+' '+k[1]:IC('weather',30)+esc(String(od.wx)))+'</span>';}
  if(isNum(od.pr)&&od.pr>0)a+='<span class="mm">'+EM('☔')+'강수 <b>'+od.pr.toFixed(1)+'</b> mm</span>';
  var wn=wdName(od.wd);
  if(isNum(od.ws)||wn)a+='<span class="mm">'+EM('💨')+(isNum(od.ws)?'<b>'+od.ws.toFixed(1)+'</b> m/s ':'')+esc(wn)+' <small class="hint">하루 평균</small></span>';
  var b=mmTxt(mm);
  if(!a&&!b){bar.innerHTML='';bar.hidden=true;return;}
  bar.innerHTML=(a?'<div class="envl">'+a+'</div>':'')+(b?'<div class="envl"><span class="lbl">외부</span>'+b+'</div>':'');bar.hidden=false;
}
function wxCell(d){
  var od=dayDoc(S.cid,d,0);if(!od)return '–';

  if(isNum(od.pr)&&od.pr>0)top+='<span>☔'+od.pr.toFixed(1)+'mm</span>';
  if(isNum(od.ws))top+='<span>💨'+od.ws.toFixed(1)+'m/s</span>';
  if(wdName(od.wd))top+='<small>'+esc(wdName(od.wd))+'</small>';
  if(mm.tmax!=null||mm.tmin!=null)sec.push(fmtT(mm.tmax)+'/'+fmtT(mm.tmin)+'℃');
  if(mm.hmax!=null||mm.hmin!=null)sec.push(fmtT(mm.hmax)+'/'+fmtT(mm.hmin)+'%');
  if(!top&&!sec.length)return '–';
  return (top?'<div class="wxc">'+top+'</div>':'')+(sec.length?'<div class="wxs">'+sec.join(' · ')+'</div>':'');
}

/* 사료 배분에서 뺄 동: 입식마다 이 기기에 기억(읽기 없음) */
function fexGet(){
  if(S.fexCid!==S.cid){S.fexCid=S.cid;S.fex={};try{(JSON.parse(lsGet('wl-fex-'+S.cid)||'[]')||[]).forEach(function(h){S.fex[h]=true;});}catch(e){}}
  return S.fex;
}
function fexSet(h,off){var f=fexGet();if(off)f[h]=true;else delete f[h];lsSet('wl-fex-'+S.cid,JSON.stringify(Object.keys(f).map(Number)));}
function fexSync(){
  var f=fexGet();
  HOUSES.forEach(function(h){
    var cb=document.querySelector('.fin[data-h="'+h+'"]'),tr=document.querySelector('[data-frow="'+h+'"]'),ri=document.querySelector('.frem[data-h="'+h+'"]');
    if(cb&&document.activeElement!==cb)cb.checked=!f[h];
    if(tr)tr.classList.toggle('off',!!f[h]);
    if(ri)ri.disabled=!!f[h]||!S.canWrite;
    var lb=cb&&cb.nextElementSibling;if(lb)lb.textContent=f[h]?'제외':'배분';
  });
}
function feedAlloc(){
  var qty=Number(($('fqIn').value||'').replace(/,/g,''));if(!isFinite(qty)||qty<0)qty=0;
  var fx=fexGet();
  var now={},rem={},act=HOUSES.filter(function(h){return (S.nowH&&S.nowH[h])>0&&!fx[h];}),al={};
  HOUSES.forEach(function(h){now[h]=(S.nowH&&S.nowH[h])||0;var r=Number((document.querySelector('.frem[data-h="'+h+'"]').value||'').replace(/,/g,''));rem[h]=isFinite(r)&&r>0?r:0;al[h]=0;});
  var guard=0;
  while(act.length&&guard++<10){
    var pool=qty,sn=0;act.forEach(function(h){pool+=rem[h];sn+=now[h];});
    var neg=act.filter(function(h){return pool*now[h]/sn-rem[h]<0;});
    if(!neg.length){act.forEach(function(h){al[h]=pool*now[h]/sn-rem[h];});break;}
    act=act.filter(function(h){return neg.indexOf(h)<0;});
  }
  var tot=0,fl={};HOUSES.forEach(function(h){fl[h]=Math.floor(al[h]);tot+=fl[h];});
  var left=Math.round(qty)-tot;
  HOUSES.slice().sort(function(a,b){return (al[b]-fl[b])-(al[a]-fl[a]);}).forEach(function(h){if(left>0&&al[h]>0){fl[h]+=1;left--;}});
  return fl;
}
function feedTags(){
  var t=S.ftSel&&ftLabel(S.ftSel)?ftLabel(S.ftSel):'';
  document.querySelectorAll('.fat').forEach(function(b){b.textContent=t;});
}
function feedSumRefresh(){
  var qty=Number(($('fqIn').value||'').replace(/,/g,''))||0,sm=0;
  document.querySelectorAll('.fal').forEach(function(i){sm+=Number((i.value||'').replace(/,/g,''))||0;});
  var el=$('fsum');if(!el)return;
  var ok=Math.abs(sm-qty)<0.5;
  el.innerHTML='배분 합계 <b>'+fmtN(sm)+'</b> kg / 입고 <b>'+fmtN(qty)+'</b> kg'+(ok?' '+EM('✅'):' <b style="color:var(--bad,#c0392b)">· 차이 '+fmtN(sm-qty)+' kg</b>');
}
function feedRecalc(){
  var fq=$('fqIn');if(!fq)return;
  var has=(Number((fq.value||'').replace(/,/g,''))||0)>0;
  fexSync();var fx=fexGet();
  $('fdet').hidden=!has;document.querySelectorAll('.falrow').forEach(function(r){var fi=r.querySelector('.fal');r.hidden=!has||!!(fi&&fx[Number(fi.dataset.h)]);});if(!has)return;
  HOUSES.forEach(function(h){var n=document.querySelector('[data-fn="'+h+'"]');if(n)n.textContent=fmt((S.nowH&&S.nowH[h])||0);});

function feedSave(h){

/* ---------- 스마트팜 자료(급수·급이): 나중에 라즈베리파이·농장관리앱이 넣어 준다 ----------
   동별 days 문서(id = 입식ID_날짜_동, h=1~5)에 아래 필드를 함께 넣으면 기록·집계·통계·엑셀에 바로 나온다.
     wat : 하루 급수량 (L)
     fdm : 하루 급이시간 (분, 급이기가 돈 시간 합계)
   이미 실시간으로 받고 있는 days 문서라서 읽기 한도를 따로 쓰지 않는다.
   읽기를 아끼려면 하루 한 번(또는 며칠치를 한꺼번에) 동마다 문서 1개씩 쓰고, 같은 날 여러 번 고쳐 쓰지 않는다.
   마리당 급수(mL) = 급수량 ÷ 그날 아침 마릿수(전날까지 도태·폐사를 뺀 수) — 앱이 계산한다. */
function smv(dd,f){return (dd&&typeof dd[f]==='number'&&isFinite(dd[f])&&dd[f]>=0)?dd[f]:null;}
function fmtMin(m){if(m==null||!isFinite(m))return '–';m=Math.round(m);var h=Math.floor(m/60),r=m%60;return h?h+'시간'+(r?' '+r+'분':''):r+'분';}
/* 날짜별 그날 아침 마릿수: res[날짜][동] */
function headsMap(c,entries){
  var lossBy={};
  entries.forEach(function(e){if(!e||!e.d||(e.t!=='dead'&&e.t!=='cull'))return;var o=lossBy[e.d]||(lossBy[e.d]={});o[e.h]=(o[e.h]||0)+(Number(e.q)||0);});
  var res={},run={};HOUSES.forEach(function(h){run[h]=0;});
  for(var n=dayNum(c.stockDate),n1=dayNum(maxDateOf(c));n<=n1;n++){
    var d=isoDay(n),o={};HOUSES.forEach(function(h){o[h]=headsOf(c,h)-run[h];});res[d]=o;
    var l=lossBy[d];if(l)HOUSES.forEach(function(h){run[h]+=l[h]||0;});
  }
  return res;
}
/* 하루 단위로 모은 자료(동 여러 개면 합치거나 평균): 통계·변화 찾기·집계가 같이 쓴다 */
function dayRows(c,src,hs,HM){
  HM=HM||headsMap(c,src.entries);
  var by={},get=function(d){return by[d]||(by[d]={dead:0,cull:0,feed:0,wat:null,watH:0,fdmL:[],tx:[],tn:[],rot:0,hk:0});};
  src.entries.forEach(function(e){
    if(!e||hs.indexOf(e.h)<0||!e.d||e.d<c.stockDate||(e.t!=='dead'&&e.t!=='cull'&&e.t!=='feed'))return;
    get(e.d)[e.t]+=Number(e.q)||0;
  });
  src.days.forEach(function(dd){
    if(!dd||!dd.d||dd.d<c.stockDate||hs.indexOf(dd.h)<0)return;
    var r=get(dd.d),w=smv(dd,'wat'),f=smv(dd,'fdm'),hh=HM[dd.d];
    if(w!=null){r.wat=(r.wat||0)+w;r.watH+=hh?(hh[dd.h]||0):0;}
    if(f!=null)r.fdmL.push(f);
    var tx=thv(dd,'tmax'),tn=thv(dd,'tmin');if(isNum(tx))r.tx.push(tx);if(isNum(tn))r.tn.push(tn);
    if(dd.rot===true)r.rot++;if(dd.hk===true)r.hk++;
  });
  Object.keys(by).forEach(function(d){
    var r=by[d];
    r.wpp=(r.wat!=null&&r.watH>0)?r.wat*1000/r.watH:null;
    r.fdm=r.fdmL.length?mean(r.fdmL):null;
    r.tmax=r.tx.length?mean(r.tx):null;r.tmin=r.tn.length?mean(r.tn):null;
  });
  return by;
}
/* 여러 날의 하루 평균(자료 있는 날만) */
function smartAvg(by,dates){
  var w=[],p=[],f=[],tot=0;
  (dates||Object.keys(by)).forEach(function(d){var r=by[d];if(!r)return;if(r.wat!=null){w.push(r.wat);tot+=r.wat;}if(r.wpp!=null)p.push(r.wpp);if(r.fdm!=null)f.push(r.fdm);});
  return {wat:w.length?mean(w):null,wpp:p.length?mean(p):null,fdm:f.length?mean(f):null,tot:w.length?tot:null,n:Math.max(w.length,f.length)};
}
function watTxt(v){return v==null?'–':fmt(Math.round(v));}
function wppTxt(v){return v==null?'–':fmt(Math.round(v));}

/* 작업(로터리·왕겨) 집계 */
function workTally(hs){
  var o={rot:0,hk:0,kg:0,by:{}};
  S.days.forEach(function(dd){
    if(!dd||dd.h===0||hs.indexOf(dd.h)<0)return;
    var b=o.by[dd.h]||(o.by[dd.h]={rot:0,hk:0,kg:0});
    if(dd.rot===true){o.rot++;b.rot++;}
    if(dd.hk===true){o.hk++;b.hk++;var k=Number(dd.hkg)||0;o.kg+=k;b.kg+=k;}
  });
  return o;
}
function workText(dd){
  if(!dd)return '';
  var a=[];if(dd.rot===true)a.push('로터리');
  if(dd.hk===true)a.push('왕겨'+(Number(dd.hkg)>0?' '+fmtN(Number(dd.hkg))+'kg':''));
  return a.join(', ');
}

/* 정산 기록 전체: 사장님 화면은 이미 실시간으로 받아 둔 것을 쓰고, 없을 때만 읽는다(읽기 절약) */
async function settleDocs(){

  return (await S.db.collection('settle').get()).docs;

async function prefillTerms(){
  if(!S.db||S.editId||!isOwner()||!S.defsLoaded)return;
  if(S.defs&&DEF_KEYS.some(function(x){return isNum(S.defs[x[1]]);})){fillFrom(S.defs);return;}
  try{
    var best=null;

      var x=d.data();if(!x||!x.terms)return;
      var oc=cycleById(d.id),sd=oc?oc.stockDate:'';

    var patch={stockDate:date,note:note};

    })

async function runChunks(items,fn,size,onProg){
  for(var i=0;i<items.length;i+=size){
    await Promise.all(items.slice(i,i+size).map(fn));
    if(onProg)onProg(Math.min(i+size,items.length),items.length);
  }
}
async function deleteCycle(cid){
  if(!cid||!S.db)return;
  try{
    toast('삭제하는 중…');
    var r=await Promise.all([S.db.collection('entries').where('c','==',cid).get(),S.db.collection('days').where('c','==',cid).get()]);
    await runChunks(r[0].docs,function(d){return S.db.doc('entries/'+d.id).delete();},8);
    await runChunks(r[1].docs,function(d){return S.db.doc('days/'+d.id).delete();},8);
    try{
      var sx=await S.db.doc('settle/'+cid).get(),sl=sx.exists&&Array.isArray(sx.data().files)?sx.data().files:[];
      await runChunks(sl,function(f){return f&&f.id?S.db.doc('sfiles/'+f.id).delete():null;},8);
    }catch(e){}
    try{await S.db.doc('settle/'+cid).delete();}catch(e){}
    await S.db.doc('cycles/'+cid).delete();
    idxDel(cid);lsDel('wl-g-'+cid);
    S.delId=null;
    if(cid===S.cid){lsSet('wl-cid','');S.cycles=S.cycles.filter(function(c){return c.id!==cid;});selectCycle(S.cycles.length?S.cycles[0].id:null);}

var MAXAGE=49;

function inShipDate(c){
  if(!c||!S.settle||c.id!==S.cid)return null;
  var sh=shipFrom(S.settle);
  if(!sh||!sh.date||!(sh.heads>0)||sh.date<c.stockDate)return null;
  var mx=maxDateOf(c);return sh.date>mx?mx:sh.date;
}
function inMaxDate(c){return inShipDate(c)||maxDateOf(c);}
function overAge(){var c=cyc();return !!(c&&ageOf(c,S.date)>MAXAGE);}
function nz(v){return isNum(v)?v:0;}
function numOrNull(v){var r=String(v==null?'':v).trim().replace(/,/g,'');if(r==='')return null;var n=Number(r);return isFinite(n)?n:NaN;}
function won(x){return fmt(Math.round(x))+'원';}
function sdoc(){return S.settle||{};}
var ASUB=[
  {k:'hot',name:'혹서기 사육관리비지원',rate:200,desc:'출하일이 7/1~8/31'},
  {k:'wfuel',name:'동절기 연료비지원',rate:150,desc:'입식일이 11/1~다음해 2/28, 이 기간 최대 2파트'},
  {k:'annual',name:'동절기 사육농가 연중사육비지원',rate:50,desc:'입식일이 3/1~10/31'}
];
function asubJudge(c,k,shipDate){
  var md=String(c.stockDate||'').slice(5),ok=null,why='';
  if(k==='hot'){
    if(!shipDate)return {ok:null,why:'출하일을 입력하면 판정합니다'};
    var sm=shipDate.slice(5);ok=sm>='07-01'&&sm<='08-31';
    why='출하일 '+dot(shipDate)+(ok?' → 7/1~8/31 해당':' → 7/1~8/31 아님');
  }else if(k==='wfuel'){
    var inW=md>='11-01'||md<='02-28';
    if(!inW){ok=false;why='입식일 '+dot(c.stockDate)+' → 11/1~2/28 아님';}
    else{
      var key=function(x){var y=Number(String(x).slice(0,4)),m=Number(String(x).slice(5,7));return m>=11?y:y-1;};
      var sk=key(c.stockDate);
      var peers=S.cycles.filter(function(o){var m2=String(o.stockDate).slice(5);return (m2>='11-01'||m2<='02-28')&&key(o.stockDate)===sk;})
        .sort(function(a,b){return String(a.stockDate).localeCompare(String(b.stockDate));});
      var rank=0;peers.forEach(function(o,i){if(o.id===c.id)rank=i+1;});
      ok=rank>=1&&rank<=2;
      why='이 동절기 '+rank+'번째 입식'+(ok?'':' (최대 2파트까지)');
    }
  }else{
    ok=md>='03-01'&&md<='10-31';
    why='입식일 '+dot(c.stockDate)+(ok?' → 3/1~10/31 해당':' → 3/1~10/31 아님');
  }
  return {ok:ok,why:why};
}
function subv(kind,n){var m=S.sub&&S.sub[kind];return m?m[n]:undefined;}
function monthKeys(c){
  var out=[],end=maxDateOf(c),cur=c.stockDate.slice(0,7);
  for(var i=0;i<4;i++){
    out.push(cur);
    var y=Number(cur.slice(0,4)),m=Number(cur.slice(5,7))+1;if(m>12){m=1;y++;}
    var nx=y+'-'+p2(m);if(nx+'-01'>end)break;cur=nx;
  }

function dimOf(mk){return new Date(Date.UTC(Number(mk.slice(0,4)),Number(mk.slice(5,7)),0)).getUTCDate();}
function periodDaysIn(mk,c,endDate){
  if(!endDate)return 0;
  var dim=dimOf(mk),a=c.stockDate>mk+'-01'?c.stockDate:mk+'-01',z=endDate<mk+'-'+p2(dim)?endDate:mk+'-'+p2(dim);
  var n=dayNum(z)-dayNum(a)+1;return n>0?n:0;
}
function calcSettle(c,ov){
  var d=sdoc(),sh=d.ship||{},tm=d.terms||{},r={};
  if(ov){sh=Object.assign({},sh,{heads:ov.heads,weights:[ov.W]});if(ov.date)sh.date=ov.date;}
  var ws=(Array.isArray(sh.weights)?sh.weights:[]).filter(isNum);
  r.W=ws.reduce(function(x,y){return x+y;},0);r.nVeh=ws.length;
  r.heads=isNum(sh.heads)&&sh.heads>0?sh.heads:null;
  r.shipDate=/^\d{4}-\d{2}-\d{2}$/.test(sh.date||'')&&sh.date>=c.stockDate?sh.date:null;
  r.age=r.shipDate?ageOf(c,r.shipDate):null;
  var A=agg(),feed=0;HOUSES.forEach(function(h){feed+=A.tot[h].feed;});
  r.ft=A.ft;r.feed=feed;r.total=Number(c.total)||0;
  r.surv=(r.heads&&r.total>0)?r.heads/r.total*100:null;
  r.avgW=(r.heads&&r.W>0)?r.W/r.heads:null;
  r.fph=r.heads?feed/r.heads:null;
  r.fcr=r.W>0?feed/r.W:null;
  r.live=r.W*nz(tm.live);
  r.eco=nz(tm.eco)*(r.heads||0);
  r.other=nz(tm.otherSub)*(r.heads||0);
  r.asub=ASUB.map(function(a){
    var j=asubJudge(c,a.k,r.shipDate),mode=(d.asub&&d.asub[a.k])||'auto',ok=j.ok,why=j.why;
    if(mode==='on'){ok=true;why+=' · 직접 적용으로 설정';}
    else if(mode==='off'){ok=false;why+=' · 직접 미적용으로 설정';}
    return {k:a.k,name:a.name,rate:a.rate,desc:a.desc,mode:mode,ok:ok,why:why,amt:ok?a.rate*(r.heads||0):0};
  });
  r.asubTotal=r.asub.reduce(function(x,a){return x+a.amt;},0);
  r.months=monthKeys(c).map(function(mk){
    var dim=dimOf(mk),days=periodDaysIn(mk,c,r.shipDate);
    var mn=Number(mk.slice(5,7)),gf=subv('fuel',mn),gl=subv('litter',mn);
    var fa=isNum(gf)?gf:nz(tm.fuel&&tm.fuel[mk]),la=isNum(gl)?gl:nz(tm.litter&&tm.litter[mk]);
    return {mk:mk,dim:dim,days:days,fa:fa,la:la,fp:0,lp:0};
  });
  r.pdays=r.months.reduce(function(x,m){return x+m.days;},0);
  r.months.forEach(function(m){m.fp=r.pdays>0?m.fa*m.days/r.pdays:0;m.lp=r.pdays>0?m.la*m.days/r.pdays:0;});
  r.fuelU=r.months.reduce(function(x,m){return x+m.fp;},0);
  r.litterU=r.months.reduce(function(x,m){return x+m.lp;},0);
  r.fuel=r.fuelU*(r.heads||0);
  r.litter=r.litterU*(r.heads||0);
  r.income=r.live+r.eco+r.other+r.asubTotal+r.fuel+r.litter;
  r.chick=r.total*nz(tm.chick);
  r.pEarly=nz(tm.feed);r.lateFall=!isNum(tm.feedLate);r.pLate=r.lateFall?r.pEarly:tm.feedLate;
  r.kgEarly=A.ft.crumble+A.ft.early;r.kgLate=A.ft.late;r.kgNone=A.ft.none;
  r.feedCost=(r.kgEarly+r.kgNone)*r.pEarly+r.kgLate*r.pLate;
  var etc=Array.isArray(d.etc)?d.etc:[];
  r.etc=etc.reduce(function(x,e){return x+nz(e&&e.amt);},0);
  r.jajoMode=(d.fc&&d.fc.jajo)||'on';r.jajoRate=10;
  r.jajo=r.jajoMode==='off'?0:r.jajoRate*(r.heads||0);
  r.cost=r.chick+r.feedCost+r.jajo+r.etc;
  r.net=r.income-r.cost;
  r.netNoEtc=r.net+r.etc;
  return r;
}

function sfLoadImg(file){

async function sfPrepare(file){
  var type=file.type||'';
  if(type==='application/pdf'||/\.pdf$/i.test(file.name||'')){
    var du=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(new Error('read'));};r.readAsDataURL(file);});
    var b=String(du).split(',')[1]||'';

    return {type:'application/pdf',data:b,size:Math.round(b.length*0.75)};
  }
  if(type.indexOf('image/')!==0)throw new Error('type');
  var im=await sfLoadImg(file),W=im.naturalWidth||im.width,H=im.naturalHeight||im.height;
  var steps=[[1600,0.8],[1600,0.65],[1300,0.6],[1000,0.55],[800,0.5]],out=null;
  for(var i=0;i<steps.length;i++){
    var mx=steps[i][0],k=Math.min(1,mx/Math.max(W,H)),cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(W*k));cv.height=Math.max(1,Math.round(H*k));
    var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
    var u=cv.toDataURL('image/jpeg',steps[i][1]),b2=u.split(',')[1]||'';

  }

}
async function sfUpload(files){

  S.fbusy=true;var done=[],fail=0,perm=false;
  for(var i=0;i<list.length;i++){

      await S.db.doc('sfiles/'+id).set({c:cid,name:nm,type:pr.type,data:pr.data,size:pr.size,at:Date.now()});
      done.push({id:id,name:nm,type:pr.type,size:pr.size,at:Date.now()});
    }catch(e){
      fail++;
      if(e&&(e.code==='permission-denied'||/permission/i.test(e.message||'')))perm=true;
      else if(e&&e.message==='big')sfMsg('파일이 너무 큽니다. 사진으로 찍어 올려 주세요.');
      else if(e&&e.message==='type')sfMsg('사진 또는 PDF만 올릴 수 있습니다.');
      else if(e&&e.message==='img')sfMsg('이 사진 형식은 열 수 없습니다. 카메라로 다시 찍어 올려 주세요.');
    }
  }
  S.fbusy=false;
  if(done.length&&S.cid===cid)saveSettle(function(d){d.files=(Array.isArray(d.files)?d.files:[]).concat(done);});
  else refreshSettle();
  if(perm)sfMsg('서류 저장 권한이 없습니다. Firebase 보안 규칙에 sfiles 컬렉션을 추가해야 합니다.');
  else if(done.length&&!fail)sfMsg('');
  else if(done.length&&fail)sfMsg(done.length+'개 올림, '+fail+'개 실패');
}
function sfB64Blob(b64,type){
  var bin=atob(b64),n=bin.length,u=new Uint8Array(n);
  for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:type});
}

function cycTotals(c,src,hs){

/* ---------- 마리당 사료(일별) 계산 ----------
   동마다 따로 계산한 뒤 합친다(사료를 동마다 다른 날 넣거나, 어떤 동은 빼고 넣어도 맞게).
   한 동의 한 구간 = 입고한 날 ~ 다음 입고 전날
     그 구간에 먹은 양 = 이번 입고량 + 입고 때 남아 있던 재고 − 다음 입고 때 남아 있던 재고
     (남은 재고는 사료 입고 계산의 '남은 재고' 칸에 넣은 값. 안 넣었으면 0 = 다 비우고 넣은 것으로 본다)
     하루치 = 먹은 양 ÷ 구간 날수
   마지막 구간(다음 입고가 아직 없음):
     출하했으면 출하일까지, 남은 재고 0으로 계산
     사육 중이면 오늘까지, 앞 구간들의 마리당 하루 섭취량 추세로 '예상'해서 그린다 */
function feedHouseDays(c,src,h,si){
  var q={},rem={},out={};
  src.entries.forEach(function(e){if(e&&e.h===h&&e.t==='feed'&&e.d&&e.d>=c.stockDate){q[e.d]=(q[e.d]||0)+(Number(e.q)||0);}});
  src.days.forEach(function(dd){if(dd&&dd.h===h&&dd.d&&typeof dd.rem==='number'&&isFinite(dd.rem)&&dd.rem>0)rem[dd.d]=dd.rem;});
  var endShip=(si&&si.date)?si.date:null;
  var fd=Object.keys(q).filter(function(d){return q[d]>0&&(!endShip||d<=endShip);}).sort();
  if(!fd.length)return out;
  var lossBy={};src.entries.forEach(function(e){if(e&&e.h===h&&(e.t==='dead'||e.t==='cull')&&e.d)lossBy[e.d]=(lossBy[e.d]||0)+(Number(e.q)||0);});
  var heads=function(n){var l=0;Object.keys(lossBy).forEach(function(d){if(dayNum(d)<n)l+=lossBy[d];});return headsOf(c,h)-l;};
  var rates=[];/* 끝난 구간의 [가운데 날, 마리당 하루 kg] */
  for(var i=0;i<fd.length;i++){
    var a=dayNum(fd[i]),qty=q[fd[i]]+(rem[fd[i]]||0),open=i+1>=fd.length,b,used;
    if(!open){
      b=dayNum(fd[i+1])-1;used=qty-(rem[fd[i+1]]||0);
      if(used<0)used=qty;/* 남은 재고를 잘못 넣은 경우: 다 먹은 것으로 */
    }else if(endShip){b=dayNum(endShip);used=qty;}
    else{
      b=Math.min(dayNum(todayStr()),dayNum(maxDateOf(c)));if(b<a)break;
      /* 예상: 끝난 구간들(최근 4개)의 마리당 하루 섭취량을 직선으로 이어 늘려 본다. 구간 하나가 튀어도 덜 흔들리게 */
      var rr=rates.slice(-4);
      for(var n=a;n<=b;n++){
        if(!rr.length)break;
        var r=Math.max(0,rr.length<2?rr[0][1]:linPred(rr,n));
        out[isoDay(n)]={kg:r*heads(n),est:true};
      }
      break;
    }
    if(b<a)b=a;
    var days=b-a+1,per=used/days,hsum=0;
    for(var m=a;m<=b;m++){out[isoDay(m)]={kg:per,est:false};hsum+=heads(m);}
    if(hsum>0)rates.push([(a+b)/2,used/hsum]);
  }
  return out;
}
function fppDaily(c,src,hs,si){
  var pts=[],sum={},est={},init=0;
  hs.forEach(function(h){
    init+=headsOf(c,h);
    var o=feedHouseDays(c,src,h,si);
    Object.keys(o).forEach(function(d){sum[d]=(sum[d]||0)+o[d].kg;if(o[d].est)est[d]=1;});
  });
  var ds=Object.keys(sum).sort();if(!ds.length)return pts;
  var loss={};src.entries.forEach(function(e){if(e&&hs.indexOf(e.h)>=0&&(e.t==='dead'||e.t==='cull')&&e.d)loss[e.d]=(loss[e.d]||0)+(Number(e.q)||0);});
  var lk=Object.keys(loss).sort(),li=0,run=0,cumF=0;
  for(var n=dayNum(ds[0]);n<=dayNum(ds[ds.length-1]);n++){
    var d=isoDay(n);
    while(li<lk.length&&lk[li]<=d){run+=loss[lk[li]];li++;}
    var now=init-run,kg=sum[d]||0;cumF+=kg;
    if(now>0&&sum[d]!=null){var a2=ageOf(c,d),pd=kg/now;pts.push({x:a2+0.5,y:cumF/now,s:pd,st:est[d]?pd.toFixed(3)+' 예상':null,d:d,a:a2,lab:''});}
  }
  return pts;
}
/* 폐사율(일별/누계): 서류 입식 마릿수 기준. (옛 설명) 일별 = 그날 폐사 ÷ 전일 마릿수, 누계 = 누적 폐사 ÷ 입식 마릿수. 선택하지 않은 쪽은 괄호(st)로 같이 보여 준다. */
function drPts(c,T,rotD,cum,d0,d1){
  var pts=[],ks=Object.keys(T.by).sort();
  if(!(T.init>0))return pts;
  if(!d0&&ks.length){d0=ks[0];d1=ks[ks.length-1];}
  if(!d0)return pts;
  var run={cull:0,dead:0};
  for(var n=dayNum(d0);n<=dayNum(d1);n++){
    var d=isoDay(n),o=T.by[d]||{cull:0,dead:0},prev=T.init-run.cull-run.dead;
    run.cull+=o.cull;run.dead+=o.dead;
    if(!(prev>0))continue;
    var base=T.doc>0?T.doc:T.init,dr=o.dead/base*100,cr=run.dead/base*100,a=ageOf(c,d);
    pts.push({x:a+0.5,y:cum?cr:dr,d:d,a:a,lab:'',rot:!!(rotD&&rotD[d]),st:cum?'당일 '+dr.toFixed(3)+'%':'누계 '+cr.toFixed(2)+'%'});
  }
  return pts;
}
function cycleSeriesPts(c,src,hs,g,hours){
  var pts=[];
  if(SMART.indexOf(g.metric)>=0)return smartPts(c,dayRows(c,src,hs),g);
  if(isEnv(g.metric)){
    var by={},FS=fieldsFor(g.metric);
    src.days.forEach(function(dd){
      if(!dd||!dd.d||dd.d<c.stockDate||hs.indexOf(dd.h)<0)return;
      FS.forEach(function(f){
        if(g.win!=='all'&&g.win!==f.w)return;
        var v=thv(dd,f.f);if(isNum(v)){var o=by[dd.d]||(by[dd.d]={});(o[f.f]=o[f.f]||[]).push(v);}
      });
    });
    Object.keys(by).forEach(function(d){FS.forEach(function(f){
      if(by[d][f.f])pts.push({x:ageOf(c,d)+(g.win==='all'?hours[f.w]/24:0.5),y:mean(by[d][f.f]),d:d,a:ageOf(c,d),lab:f.label});
    });});
    pts.sort(function(p,q){return p.x-q.x;});
    return pts;
  }
  var T=cycTotals(c,src,hs),dates=Object.keys(T.by).sort();
  if(!dates.length)return pts;
  var si=shipOf(c.id);
  if(g.metric==='fcr'){
    if(!si||!si.date||!(si.W>0))return pts;
    var fk=0;Object.keys(T.by).forEach(function(d){if(d<=si.date)fk+=T.by[d].feed;});
    if(fk>0)pts.push({x:ageOf(c,si.date)+0.5,y:fk/si.W,d:si.date,a:ageOf(c,si.date),lab:''});
    return pts;
  }
  if(g.metric==='fpp')return fppDaily(c,src,hs,si);
  var rotD={};src.days.forEach(function(dd){if(dd&&dd.rot&&dd.d&&hs.indexOf(dd.h)>=0)rotD[dd.d]=1;});
  if(g.metric==='drate')return drPts(c,T,rotD,!!g.cum);
  var run={cull:0,dead:0,feed:0};
  for(var n=dayNum(dates[0]);n<=dayNum(dates[dates.length-1]);n++){
    var d=isoDay(n),o=T.by[d]||{cull:0,dead:0,feed:0},a=ageOf(c,d),y=null;
    run.cull+=o.cull;run.dead+=o.dead;run.feed+=o.feed;
    var now=T.init-run.cull-run.dead;
    if(g.metric==='loss')y=g.cum?(run.dead+run.cull):(o.dead+o.cull);
    else y=g.cum?run[g.metric]:o[g.metric];
    if(y!=null)pts.push({x:a+0.5,y:y,d:d,a:a,lab:'',rot:!!rotD[d]});
  }
  return pts;
}

function niceTicks(lo,hi,n){
  if(!(hi>lo))hi=lo+1;
  var raw=(hi-lo)/n,pow=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/pow;
  var step=(f<=1?1:f<=2?2:f<=5?5:10)*pow;
  var dec=step<1?Math.ceil(-Math.log10(step)-1e-9):0,out=[];
  for(var v=Math.floor(lo/step)*step;v<=Math.ceil(hi/step)*step+step*1e-6;v+=step)out.push(Number(v.toFixed(dec)));
  return {ticks:out,dec:dec};
}
function gSub(p){return (p&&p.st!=null)?' ('+p.st+')':(p&&p.s!=null)?' ('+p.s.toFixed(3)+')':'';}
function gVal(m,v){
  if(m.k==='temp'||m.k==='humi')return v.toFixed(1);
  if(m.k==='drate')return v.toFixed(S.g.cum?2:3)+'%';
  if(m.k==='fpp'||m.k==='fcr')return v.toFixed(2);
  if(m.k==='fdm')return fmtMin(v);
  if(m.k==='wpp'||m.k==='water')return fmt(Math.round(v));
  return fmtN(v);
}
/* ---- 평소(앞 3일 평균)와 비교한 변화: 급이·급수는 %, 폐사·도태는 마릿수, 온도는 ℃, 폐사율은 몇 배 ---- */
var DKIND={fdm:'pct',water:'pct',wpp:'pct',dead:'abs',cull:'abs',loss:'abs',temp:'deg',tmin:'deg',humi:'abs',drate:'x'};
function chgCls(k,d,sig){
  if(!sig)return 'c0';
  if(k==='dead'||k==='cull'||k==='loss'||k==='drate')return d>0?'cb':'cg';
  if(k==='temp'||k==='tmin')return d>0?'cw':'cc';
  return d>0?'cc':'cw';
}
function chgOf(k,v,base){
  var kind=DKIND[k];if(!kind||v==null||base==null)return null;
  if(kind==='pct'){if(!(base>0))return null;var p=(v-base)/base*100;return {d:p,sig:Math.abs(p)>=5,t:Math.abs(p).toFixed(0)+'%'};}
  if(kind==='deg'){var t=v-base;return {d:t,sig:Math.abs(t)>=1,t:Math.abs(t).toFixed(1)+'℃'};}
  if(kind==='x'){
    if(!(base>0))return v>0?{d:1,sig:true,t:'(평소 0)'}:null;
    var r=v/base;return {d:r-1,sig:r>=1.5||r<=0.67,t:'평소 ×'+r.toFixed(1)};
  }
  var a=v-base;return {d:a,sig:Math.abs(a)>=1,t:fmtN(Math.abs(Math.round(a*10)/10))+(k==='humi'?'%':'수')};
}
/* 오리는 매일 커서 급이·급수가 날마다 늘어난다. 그래서 '평소'는 단순 평균이 아니라 앞뒤 흐름으로 예상한 값을 쓴다.
   lin: [[x,y],...] 로 직선을 맞춰 x0에서의 값을 구한다(점이 3개 미만이면 평균) */
function linPred(xy,x0){
  if(xy.length<2)return null;if(xy.length<3)return mean(xy.map(function(p){return p[1];}));
  var mx=mean(xy.map(function(p){return p[0];})),my=mean(xy.map(function(p){return p[1];})),sxx=0,sxy=0;
  xy.forEach(function(p){sxx+=(p[0]-mx)*(p[0]-mx);sxy+=(p[0]-mx)*(p[1]-my);});
  return sxx>0?my+sxy/sxx*(x0-mx):my;
}
function chgHTML(k,v,base,tag){
  var o=chgOf(k,v,base);if(!o)return '';
  var arrow=DKIND[k]==='x'?(o.d>0?'▲':'▼')+' '+o.t:(o.d>0?'▲':'▼')+o.t;
  return '<'+(tag||'small')+' class="'+chgCls(k,o.d,o.sig)+'">'+(o.sig?arrow:'≈ 평소')+'</'+(tag||'small')+'>';
}

function showDay(a){

    cur.setAttribute('x1',x.toFixed(1));cur.setAttribute('x2',x.toFixed(1));cur.style.display='';
    var dh='',right=x>G.L+G.pw*0.62;

      if(!pn.sy)return;

      pn.vis.forEach(function(s){s.pts.forEach(function(p){

      });});
      /* 누른 자리 숫자: 겹치지 않게 위아래로 조금씩 벌려서 점 옆에 쓴다 */

      for(var j=0;j<labs.length;j++){labs[j].ly=Math.max(labs[j].y+4,top+11);if(j&&labs[j].ly<labs[j-1].ly+gap)labs[j].ly=labs[j-1].ly+gap;}
      for(var k=labs.length-1;k>=0;k--){var lim=k===labs.length-1?bot-2:labs[k+1].ly-gap;if(labs[k].ly>lim)labs[k].ly=lim;}
      labs.forEach(function(l){
        var tx=right?l.cx-9:l.cx+9;
        dh+='<text class="gval" x="'+tx.toFixed(1)+'" y="'+l.ly.toFixed(1)+'" text-anchor="'+(right?'end':'start')+'" style="fill:'+l.c+'">'+esc(l.t)+'</text>';

function graphZoom(act,ctr){
  var G=GH,g=S.g;if(!G)return;
  var a=G.xmin,b=G.xmax,f0=G.fx0,f1=G.fx1,full=f1-f0,sp=b-a,c=ctr==null?(a+b)/2:ctr;
  g.zoomWk=null;
  if(act==='all'){g.zoom=null;}
  else if(act==='in'||act==='out'||typeof act==='number'){
    var ns=typeof act==='number'?sp/act:act==='in'?sp/2:sp*2;
    ns=Math.max(3,ns);
    if(ns>=full)g.zoom=null;
    else{var na=c-ns/2,nb=c+ns/2;if(na<f0){nb+=f0-na;na=f0;}if(nb>f1){na-=nb-f1;nb=f1;}g.zoom=[Math.max(f0,na),Math.min(f1,nb)];}
  }else if(act==='left'||act==='right'){
    var d=(act==='left'?-1:1)*sp/2,na2=a+d,nb2=b+d;
    if(na2<f0){nb2+=f0-na2;na2=f0;}if(nb2>f1){na2-=nb2-f1;nb2=f1;}
    g.zoom=[na2,nb2];
  }else if(/^w\d$/.test(act)){
    var n=Number(act.slice(1));g.zoom=[(n-1)*7+0.6,n*7+0.9];g.zoomWk=n;
  }
  renderGraph();
}
function bindGraphHover(){
  var svg=$('gsvg'),hit=$('ghit');
  if(!svg||!GH)return;
  var G=GH;
  function pick(e){
    if(!G.ages.length)return;
    var r=svg.getBoundingClientRect(),k=G.W/r.width;
    var px=(e.clientX-r.left)*k,xv=G.xmin+(px-G.L)/G.pw*(G.xmax-G.xmin)-0.5;
    var best=G.ages[0],bd=Infinity;
    G.ages.forEach(function(x){var d=Math.abs(x-xv);if(d<bd){bd=d;best=x;}});
    if(best!==S.g.dayA||!$('gday').innerHTML.trim())showDay(best);
  }
  /* 두 손가락 확대·축소: 손을 뗄 때 한 번만 다시 그린다(버벅임 방지) */
  var pts={},pin=null;
  function pdist(){var k=Object.keys(pts);if(k.length<2)return 0;return Math.abs(pts[k[0]].x-pts[k[1]].x);}
  function pmid(){var k=Object.keys(pts),r=svg.getBoundingClientRect();var px=((pts[k[0]].x+pts[k[1]].x)/2-r.left)*(G.W/r.width);return G.xmin+(px-G.L)/G.pw*(G.xmax-G.xmin);}
  hit.addEventListener('pointerdown',function(e){
    pts[e.pointerId]={x:e.clientX};
    if(Object.keys(pts).length===2){pin={d0:pdist(),c:pmid()};}
    else pick(e);
  });
  hit.addEventListener('pointermove',function(e){
    if(pts[e.pointerId])pts[e.pointerId].x=e.clientX;
    if(pin){var d=pdist();if(pin.d0>20&&d>0){svg.style.transformOrigin='center';svg.style.transform='scaleX('+Math.max(.4,Math.min(3,d/pin.d0)).toFixed(3)+')';}return;}
    if(e.pointerType==='mouse'||pts[e.pointerId])pick(e);
  });
  function end(e){
    if(pin){
      var d=pdist(),f=pin.d0>20?d/pin.d0:1,c=pin.c;svg.style.transform='';pin=null;pts={};
      if(f>1.15||f<0.87)graphZoom(f,c);
      return;
    }
    delete pts[e.pointerId];
  }
  hit.addEventListener('pointerup',end);
  hit.addEventListener('pointercancel',end);
  hit.addEventListener('pointerleave',function(e){if(!pin)delete pts[e.pointerId];});
}
