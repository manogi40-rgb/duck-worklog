<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e6b58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="작업일지">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>오리농장 작업일지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 손으로 쓰는 세로 화면. 위에 입식 제목, 가운데 동별 카드, 아래 고정 탭(입력·기록·평균) */
:root{
  --bg:#eef3f0; --surface:#ffffff; --surface2:#e3ece7; --ink:#14221d; --muted:#586b63; --line:#cbd8d1;
  --accent:#0e6b58; --accent-ink:#ffffff; --warn:#a9650c; --bad:#b4372e; --good:#1f7a3f;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-display:"Do Hyeon","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1614; --surface:#16211e; --surface2:#1f2e2a; --ink:#e4efea; --muted:#93a8a0; --line:#2b3d37;
    --accent:#52c7a8; --accent-ink:#06231b; --warn:#e0a24a; --bad:#f0857c; --good:#6fd08e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211e; --surface2:#1f2e2a; --ink:#e4efea; --muted:#93a8a0; --line:#2b3d37;
  --accent:#52c7a8; --accent-ink:#06231b; --warn:#e0a24a; --bad:#f0857c; --good:#6fd08e; color-scheme:dark;
}
/* 그래프 색: 범주형 1~5번 순서(검증된 팔레트), 외부 센서는 중립색 점선 */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--grid:#e1e0d9;--axis:#c3c2b7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--grid:#2c2c2a;--axis:#383835}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--grid:#2c2c2a;--axis:#383835}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:15px/1.5 var(--font-body);
  padding-block:0 92px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:980px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-direction:column;gap:10px;padding-top:14px;padding-bottom:12px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cyc{display:flex;align-items:baseline;gap:10px;min-width:0;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer}
.cyc-title{font-family:var(--font-display);font-size:clamp(20px,6vw,27px);line-height:1.15;white-space:nowrap}
.cyc-age{font-size:14px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 11px;white-space:nowrap}
.caret{color:var(--muted)}
.notice{margin:0;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.notice.bad{border-color:var(--bad)}

.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pane{display:flex;flex-direction:column;gap:14px}
.pane[hidden]{display:none}
.state{padding:28px 18px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.state h2{margin:0;color:var(--ink);font-family:var(--font-display);font-weight:400;font-size:22px}
.state p{margin:0;max-width:34ch}

.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar input[type=date]{flex:1 1 150px;min-width:0;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:17px}
.datebar .btn{padding:0 14px}
.sumline{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted)}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}

.houses{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.house{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.house-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.house-head h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:25px;line-height:1}
.house-now{text-align:right;color:var(--muted);font-size:13px;line-height:1.3}
.house-now b{display:block;font-family:var(--font-display);font-weight:400;font-size:25px;color:var(--ink);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-label{display:flex;flex-direction:column;min-width:0}
.row-label span{font-weight:700}
.row-label small{color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:flex;gap:6px;flex:0 0 auto}
.qin,.tin,.hin,.kin,.memo,.wfield input,.nfield input{border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:18px;padding:0 12px}
.qin{width:112px;height:46px;text-align:right;font-variant-numeric:tabular-nums}
.sign{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.sign.neg{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.temps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.temps label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.tin,.hin{width:100%;height:46px;text-align:right;font-variant-numeric:tabular-nums}
.hums{margin-top:8px}
.works{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:10px 0 4px}
.ck{display:flex;align-items:center;gap:8px;min-height:44px;font-size:16px}
.ck input{width:24px;height:24px;margin:0}
.hkl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.kin{width:96px;height:44px;text-align:right;font-variant-numeric:tabular-nums}
.kin:disabled{opacity:.45}
.memo{width:100%;min-height:68px;padding:10px 12px;resize:vertical;font-size:16px;line-height:1.45}
.memo-label{font-size:13px;color:var(--muted);margin-bottom:-6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.chip.neg{color:var(--bad)}
.chip small{color:var(--muted)}
.chip button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.wide{grid-column:1/-1}
.wfield{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.wfield span{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.wfield input{width:130px;height:46px;text-align:right;font-variant-numeric:tabular-nums}
.hint,.state p{white-space:pre-wrap;overflow-wrap:anywhere}
.hint{margin:0;color:var(--muted);font-size:13px}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:420px}
.tbl th,.tbl td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:13px;color:var(--muted);font-weight:500}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl td.memo-row{white-space:normal;text-align:left;color:var(--muted);font-size:13px;padding-top:0}
.datebtn{background:none;border:0;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;line-height:1.25;font-weight:700;color:var(--accent)}
.datebtn small{color:var(--muted);font-weight:400}
.bad{color:var(--bad)}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab[hidden]{display:none}
.tab{flex:1;min-width:0;min-height:60px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font-weight:700;font-size:15px;padding:0 2px;cursor:pointer}
.tab[aria-selected=true]{color:var(--accent);border-top-color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}
.sheet{position:fixed;inset:0;background:rgba(10,20,17,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:14px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px}
.panelhead{display:flex;justify-content:space-between;align-items:center}
.cyc-list{display:flex;flex-direction:column;gap:8px}
.cyc-item{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left}
.cyc-item[aria-current=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cyc-item span{color:var(--muted);font-size:13px}
.nform{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.nfield{display:flex;flex-direction:column;gap:4px;font-weight:700}
.nfield input{height:48px;font-weight:400}
.prev{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.prev div{background:var(--bg);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.prev div span{color:var(--muted)}
.err{margin:0;color:var(--bad);font-size:14px}
.tbl.sum{min-width:0}.tbl.sum th,.tbl.sum td{padding:8px 8px;white-space:nowrap}.tbl.sum th:first-child,.tbl.sum td:first-child{min-width:112px;font-size:13px;position:sticky;left:0;background:var(--surface)}
.nnote{width:100%;min-height:68px;padding:10px 12px;resize:vertical;font:400 16px/1.45 var(--font-body);border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.gctl{display:flex;flex-direction:column;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.lg[aria-pressed=false]{opacity:.45}
.sw{display:inline-block;width:16px;height:3px;border-radius:2px}
.gwrap{position:relative}
.gsvg{display:block;width:100%;height:auto;touch-action:pan-y}
.gsvg text{fill:var(--muted);font-size:11px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.gl{stroke:var(--grid);stroke-width:1}
.ga{stroke:var(--axis);stroke-width:1}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gcur{stroke:var(--axis);stroke-width:1}
.gtip{position:absolute;top:6px;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.18);min-width:128px;z-index:5}
.gtip b{display:block;margin-bottom:4px}
.gtip div{display:flex;align-items:center;gap:10px;justify-content:space-between;font-variant-numeric:tabular-nums}
.gtip span{display:flex;align-items:center;gap:6px}
.gtip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.srow b{font-family:var(--font-display);font-weight:400;font-size:20px}
.sin{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 8px;font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:0;text-transform:uppercase;width:100%;min-width:0}
.wrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wrow b{width:44px;font-family:var(--font-display);font-weight:400;font-size:20px}
.win{width:72px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.flist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.flist div{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.flist .ok{color:var(--good);font-weight:700}
.flist .no{color:var(--bad);font-weight:700}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;align-items:center;gap:10px;min-height:44px}
.radios input{width:22px;height:22px}
.mute{color:var(--muted)}
.tbl td small{display:block;color:var(--muted);font-size:11px}
.cyc-card{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cyc-card[aria-current=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cyc-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.cyc-main b{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cyc-main span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.badge{font-family:var(--font-body);font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 9px}
.cyc-btns{display:flex;gap:8px;flex-wrap:wrap}
.cyc-btns .btn{min-height:42px;padding:0 14px;flex:1 1 auto}
.confirm{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bk{width:100%;min-height:150px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink)}
.sd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;min-height:48px}
.sd-row .s{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.sfld{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0 10px;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.sd-row .sfld{width:150px}
.sfld.sm{width:104px}
select.sfld{text-align:left;padding-right:4px}
.vrow{display:flex;align-items:center;gap:8px}.vrow>span:first-child{width:56px;font-weight:700}.vrow .sfld{flex:1}.vrow .u{color:var(--muted)}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 112px auto;gap:8px;align-items:center}.erow .sfld:first-child{text-align:left}
.tbl.stmt{min-width:0}.tbl.stmt td:first-child{white-space:normal}.tbl.stmt td{vertical-align:top}
.tbl.stmt tr.sec td{background:var(--surface2);font-weight:700;color:var(--ink);padding:6px 8px}
.tbl.stmt tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.tbl.stmt tr.net td{font-weight:700;font-size:18px;background:var(--bg)}
.tbl.mon{min-width:520px}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.seg button{transition:background .12s,color .12s}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="titlebar">
      <button type="button" class="cyc" id="cycBtn" aria-haspopup="dialog">
        <span class="cyc-title" id="cycTitle">작업일지</span>
        <span class="cyc-age" id="cycAge" hidden></span>
        <span class="caret" aria-hidden="true">▾</span>
      </button>
      <button type="button" class="btn" id="newBtn">새 입식</button>
    </div>
    <p class="notice" id="notice" hidden></p>
    <p class="notice" id="syncNote" hidden>기록을 불러오는 중입니다. 잠시 후 숫자가 갱신됩니다.</p>
  </header>
  <main>
    <section id="pane-home" class="pane" role="tabpanel" aria-label="입식"></section>
    <section id="pane-input" class="pane" role="tabpanel" aria-label="입력" hidden></section>
    <section id="pane-log" class="pane" role="tabpanel" aria-label="기록" hidden></section>
    <section id="pane-avg" class="pane" role="tabpanel" aria-label="평균" hidden></section>
    <section id="pane-graph" class="pane" role="tabpanel" aria-label="그래프" hidden></section>
    <section id="pane-sensor" class="pane" role="tabpanel" aria-label="센서" hidden></section>
    <section id="pane-settle" class="pane" role="tabpanel" aria-label="정산" hidden></section>
  </main>
</div>

<nav class="tabs" role="tablist" aria-label="화면 선택">
  <button type="button" class="tab" role="tab" data-tab="home" aria-selected="true">입식</button>
  <button type="button" class="tab" role="tab" data-tab="input" aria-selected="false">입력</button>
  <button type="button" class="tab" role="tab" data-tab="log" aria-selected="false">기록</button>
  <button type="button" class="tab" role="tab" data-tab="avg" aria-selected="false">평균</button>
  <button type="button" class="tab" role="tab" data-tab="graph" aria-selected="false">그래프</button>
  <button type="button" class="tab" role="tab" data-tab="sensor" aria-selected="false">센서</button>
  <button type="button" class="tab" role="tab" data-tab="settle" aria-selected="false">정산</button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<style>
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login[hidden]{display:none}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
var AREAS=[253,363,363,416,140];            /* 동별 면적: 배분 계산에만 사용, 화면에는 표시하지 않음 */
var SUM=AREAS.reduce(function(a,b){return a+b;},0);
var SERVICE=0.02;
var HOUSES=[1,2,3,4,5];
var TYPES=[{k:'cull',label:'도태',int:true},{k:'dead',label:'폐사',int:true},{k:'feed',label:'사료 입고',int:false}];
var FIELDS=[{f:'tm',w:'tm',label:'아침'},{f:'tn',w:'tn',label:'점심'},{f:'te',w:'te',label:'저녁'}];
var HFIELDS=[{f:'hm',w:'tm',label:'아침'},{f:'hn',w:'tn',label:'점심'},{f:'he',w:'te',label:'저녁'}];
var ALLF=FIELDS.concat(HFIELDS);
function fieldsFor(m){return m==='humi'?HFIELDS:FIELDS;}
function isEnv(m){return m==='temp'||m==='humi';}

function $(id){return document.getElementById(id);}
function fmt(n,d){return Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d||0,minimumFractionDigits:d||0});}
function fmtN(n){return fmt(n,Number.isInteger(Math.round(n*10)/10)&&Math.abs(n-Math.round(n))<0.05?0:1);}
function fmtT(v){return v==null?'–':v.toFixed(1);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function isNum(v){return typeof v==='number'&&isFinite(v);}
function mean(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
function todayStr(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});}
function dayNum(s){var p=s.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/86400000);}
function addDays(s,n){return new Date((dayNum(s)+n)*86400000).toISOString().slice(0,10);}
function dot(s){return s.replace(/-/g,'.');}
function ageOf(c,d){return dayNum(d)-dayNum(c.stockDate)+1;}

var S={db:null,user:null,uid:null,canWrite:true,cycles:[],ready:false,cid:null,date:todayStr(),tab:'home',editId:null,delId:null,restore:null,dl:null,settings:null,imp:null,stale:false,cyclesDef:false,sync:{e:true,d:true},g:{mode:'house',metric:'temp',win:'all',cum:false,off:{},table:false,scope:'all',sel:[],color:{},cache:{},pending:{},selInit:false},
  entries:new Map(),days:new Map(),filter:'all',unsubs:[],inKey:null,avgKey:null,status:'저장소 연결 중…',step:'start',dbg:{}};
var VER='v14';
function dbgTxt(){var d=S.dbg,k,o=[VER];for(k in d)o.push(k+':'+d[k]);return o.join(' · ');}

function cyc(){for(var i=0;i<S.cycles.length;i++){if(S.cycles[i].id===S.cid)return S.cycles[i];}return null;}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

var toastTimer=null;
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},1600);}
function notice(msg,bad){var n=$('notice');if(!msg){n.hidden=true;return;}n.textContent=msg;n.className='notice'+(bad?' bad':'');n.hidden=false;}
function handleErr(e){
  var code=e&&e.code;
  if(code==='invalid_argument'||code==='permission-denied'){S.canWrite=false;notice('이 계정으로는 입력할 수 없습니다. 관리자에게 계정 등록을 요청하세요.',true);updateRO();}
  else if(code==='quota_exceeded'){notice('저장 공간이 가득 찼습니다. 지난 입식 기록을 삭제한 뒤 다시 시도하세요.',true);}
  else if(code==='revoked'){notice('접근 권한이 바뀌어 더 이상 저장할 수 없습니다.',true);}
  else{toast('저장하지 못했습니다. 다시 시도하세요.');}
}

/* ---------- 입식 배분: 총 마릿수 × 1.02 를 동 면적 비례로 나눔 ---------- */
function allocate(total){
  var target=Math.round(total*(1+SERVICE));
  var raw=AREAS.map(function(a){return target*a/SUM;});
  var fl=raw.map(Math.floor);
  var rem=target-fl.reduce(function(a,b){return a+b;},0);
  var order=raw.map(function(r,i){return [r-fl[i],i];}).sort(function(a,b){return b[0]-a[0];});
  for(var k=0;k<rem;k++){fl[order[k][1]]++;}
  return fl;
}

/* ---------- 집계 ---------- */
function agg(){
  var out={tot:{},byDate:{},dates:new Set()};
  HOUSES.forEach(function(h){out.tot[h]={cull:0,dead:0,feed:0};});
  S.entries.forEach(function(e){
    var h=e.h;if(!out.tot[h])return;var q=Number(e.q)||0;
    out.tot[h][e.t]+=q;
    var d=out.byDate[e.d]||(out.byDate[e.d]={});
    var x=d[h]||(d[h]={cull:0,dead:0,feed:0});x[e.t]+=q;out.dates.add(e.d);
  });
  S.days.forEach(function(v){if(v&&v.d)out.dates.add(v.d);});
  return out;
}
function dayDoc(cid,d,h){return S.days.get(cid+'_'+d+'_'+h)||null;}
function headsOf(c,h){return Number(c.heads&&c.heads[h])||0;}

/* ---------- 구독 ---------- */
function subscribeCycle(cid){
  S.unsubs.forEach(function(u){try{u();}catch(e){}});S.unsubs=[];
  S.entries=new Map();S.days=new Map();S.inKey=null;S.avgKey=null;S.settle=null;S.stKey=null;
  S.sync={e:false,d:false};
  if(!cid||!S.db)return;
  var onErr=function(e){handleErr(e);};
  /* 아직 확정되지 않은 빈 결과는 무시하고, 확정된 결과만 화면에 반영한다 */
  var apply=function(key,store){return function(s2){
    if(cid!==S.cid)return;
    if(s2.empty&&s2.metadata&&s2.metadata.fromCache)return;
    var m=new Map();s2.docs.forEach(function(d){m.set(d.id,d.data());});
    S[store]=m;S.sync[key]=true;render();
  };};
  var onE=apply('e','entries'),onD=apply('d','days');
  S.unsubs.push(S.db.collection('entries').where('c','==',cid).onSnapshot(onE,onErr));
  S.unsubs.push(S.db.collection('days').where('c','==',cid).onSnapshot(onD,onErr));
  var onS=function(sn){
    if(cid!==S.cid)return;
    if(!sn.exists&&sn.metadata&&sn.metadata.fromCache)return;
    S.settle=sn.exists?Object.assign({},sn.data()):null;
    if(S.tab==='settle')refreshSettle();
  };
  if(isOwner()){S.unsubs.push(S.db.doc('settle/'+cid).onSnapshot(onS,onErr));
  S.db.doc('settle/'+cid).get().then(onS).catch(function(){});}
  S.db.collection('entries').where('c','==',cid).get().then(onE).catch(function(){});
  S.db.collection('days').where('c','==',cid).get().then(onD).catch(function(){});
}
function selectCycle(cid){
  S.cid=cid;if(cid)lsSet('wl-cid',cid);
  subscribeCycle(cid);render();
}
function onCycles(snap,fromGet){
  /* 확정되지 않은 빈 목록은 "입식 없음"으로 보여주지 않는다
     (단, get() 으로 두 번 연속 비어 있다고 확인되면 정말 비어 있는 것) */
  if(snap.empty&&snap.metadata&&snap.metadata.fromCache){
    if(fromGet){S.emptyGets=(S.emptyGets||0)+1;}
    if(!(fromGet&&S.emptyGets>=2))return;
  }
  S.cycles=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;}).sort(function(a,b){return String(b.stockDate).localeCompare(String(a.stockDate));});
  S.ready=true;S.stale=false;S.cyclesDef=true;
  try{lsSet('wl-cyc',JSON.stringify(S.cycles.slice(0,30)));}catch(e){}
  if(!cyc()){
    var pref=lsGet('wl-cid');var next=null;
    for(var i=0;i<S.cycles.length;i++){if(S.cycles[i].id===pref){next=pref;break;}}
    if(!next&&S.cycles.length)next=S.cycles[0].id;
    selectCycle(next);
  }else{
    if(S.cid&&S.db&&!S.unsubs.length)subscribeCycle(S.cid);
    render();
  }
}
/* 입식 목록 색인: 컬렉션 조회가 응답하지 않는 기기에서도 문서 단위 읽기로 목록을 복구한다 */
function idxChange(fn){
  if(!S.db)return Promise.resolve();
  return S.db.doc('settings/index').get().then(function(sn){
    var ids=(sn.exists&&sn.data().ids)||[];ids=ids.slice();
    var next=fn(ids);
    return S.db.doc('settings/index').set({ids:next,updatedAt:Date.now()});
  }).catch(function(){});
}
function idxAdd(id){return idxChange(function(ids){if(ids.indexOf(id)<0)ids.push(id);return ids;});}
function idxDel(id){return idxChange(function(ids){return ids.filter(function(x){return x!==id;});});}
function loadIndex(){
  if(!S.db||S.cyclesDef)return;
  withTimeout(S.db.doc('settings/index').get(),8000).then(function(sn){
    if(sn===TO){S.dbg.색인='시간초과';return;}
    if(S.cyclesDef)return;
    if(!sn.exists){S.dbg.색인='없음';return;}
    var ids=sn.data().ids||[];S.dbg.색인=ids.length+'건';if(!ids.length)return;
    return Promise.all(ids.map(function(id){
      return withTimeout(S.db.doc('cycles/'+id).get(),8000).then(function(d){
        if(d===TO){S.dbg.문서='시간초과';return null;}if(!d.exists){S.dbg.문서='없음';return null;}var o=Object.assign({},d.data());o.id=d.id;return o;
      }).catch(function(){return null;});
    })).then(function(list){
      list=list.filter(Boolean);
      if(S.cyclesDef||!list.length)return;
      onCycles({empty:false,metadata:{fromCache:false},docs:list.map(function(o){var id=o.id;return {id:id,data:function(){var c=Object.assign({},o);delete c.id;return c;}};})},false);
    });
  }).catch(function(e){S.dbg.색인='오류 '+((e&&(e.code||e.message))||'?');});
}
function loadCycles(n){
  if(S.cyclesDef||!S.db)return;
  loadIndex();
  withTimeout(S.db.collection('cycles').get(),8000)
    .then(function(snap){if(snap===TO){S.dbg.목록='시간초과';}else{S.dbg.목록=snap.docs.length+'건'+(snap.metadata&&snap.metadata.fromCache?'(캐시)':'');onCycles(snap,true);}})
    .catch(function(e){S.dbg.목록='오류 '+((e&&(e.code||e.message))||'?');handleErr(e);})
    .then(function(){
      if(S.cyclesDef)return;
      if(n<10)setTimeout(function(){loadCycles(n+1);},4000);
      else if(!S.ready){S.status='저장소에 연결하지 못했습니다. 인터넷 연결을 확인하고 화면을 새로고침하세요.';render();}
    });
}

/* ---------- 쓰기 ---------- */
function addEntry(h,t,q,inp,raw){
  if(!S.db||!S.cid||!S.canWrite)return;
  if(overAge()){toast('7주령(49일령)까지만 입력할 수 있습니다');if(inp&&!inp.value)inp.value=raw;return;}
  S.db.collection('entries').add({c:S.cid,d:S.date,h:h,t:t,q:q,by:S.uid||null,at:Date.now()})
    .then(function(){toast('저장됨');})
    .catch(function(e){if(inp&&!inp.value)inp.value=raw;handleErr(e);});
}
var chain={},pend={},stamp={};
function saveDayField(h,f,val){
  if(!S.db||!S.cid||!S.canWrite)return;
  if(overAge()){toast('7주령(49일령)까지만 입력할 수 있습니다');return;}
  var date=S.date,cid=S.cid,key=cid+'_'+date+'_'+h;
  var base=Object.assign({c:cid,d:date,h:h},S.days.get(key)||{},pend[key]||{});
  base[f]=val;
  pend[key]=Object.assign({},pend[key]||{});pend[key][f]=val;
  var n=(stamp[key]=(stamp[key]||0)+1);
  chain[key]=(chain[key]||Promise.resolve()).then(function(){return S.db.doc('days/'+key).set(base);})
    .then(function(){if(stamp[key]===n)delete pend[key];toast('저장됨');})
    .catch(function(e){handleErr(e);});
}

/* ---------- 화면 ---------- */
function emptyHTML(loading){
  if(loading)return '<div class="state"><p>'+esc(S.status)+'</p></div>';
  if(!S.db)return '<div class="state"><h2>저장소에 연결되지 않았습니다</h2><p>인터넷 연결을 확인하고 앱을 다시 열어 주세요.</p></div>';
  return '<div class="state"><h2>입식 기록이 없습니다</h2><p>입식일과 총 마릿수를 넣으면 동별 마릿수가 자동으로 나뉘고, 도태·폐사·사료·온도 입력을 시작할 수 있습니다.</p><button type="button" class="btn primary" data-act="new">첫 입식 등록</button></div>';
}
function renderHeader(){
  var c=cyc();
  var sn=$('syncNote');if(sn)sn.hidden=!(S.cid&&S.ready&&(S.stale||(S.db&&!(S.sync.e&&S.sync.d))));
  if(!c){$('cycTitle').textContent=S.ready?'입식을 등록하세요':'작업일지';$('cycAge').hidden=true;return;}
  $('cycTitle').textContent=dot(c.stockDate)+' 입식';
  var a=ageOf(c,S.date);
  $('cycAge').hidden=a<1;$('cycAge').textContent=a+'일령';
}
function render(){
  if(!isOwner()&&(S.tab==='sensor'||S.tab==='settle'))S.tab='home';
  var cc0=cyc();if(cc0&&S.date>maxDateOf(cc0))S.date=maxDateOf(cc0);
  renderHeader();
  ['home','input','log','avg','graph','sensor','settle'].forEach(function(t){$('pane-'+t).hidden=S.tab!==t;});
  document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===S.tab?'true':'false');b.hidden=!isOwner()&&(b.dataset.tab==='sensor'||b.dataset.tab==='settle');});
  if(S.tab==='home'){renderHome();updateRO();return;}
  if(S.tab==='sensor'){renderSensor();return;}
  if(S.tab==='settle'){renderSettle();return;}
  if(S.tab==='graph'){renderGraph();return;}
  var pane=$('pane-'+S.tab),c=cyc();
  if(!S.ready||!c){
    pane.innerHTML=emptyHTML(!S.ready);S.inKey=null;S.avgKey=null;return;
  }
  if(S.tab==='input')renderInput();else if(S.tab==='log')renderLog();else renderAvg();
  updateRO();
}
function updateRO(){
  var ro=!S.canWrite;
  document.querySelectorAll('#pane-input input,#pane-input textarea,#pane-input .sign,#pane-avg #wIn').forEach(function(e){
    if(e.id==='dateIn')return;e.disabled=ro;
  });
  var ns=$('nSave');if(ns)ns.disabled=ro;
}

/* 입력 탭 */
function cardHTML(h){
  var rows=TYPES.map(function(t){
    return '<div class="row"><div class="row-label"><span>'+t.label+'</span><small data-sum="'+t.k+'"></small></div>'+
      '<div class="qty"><input class="qin" type="text" inputmode="'+(t.int?'numeric':'decimal')+'" autocomplete="off" placeholder="수량" data-h="'+h+'" data-t="'+t.k+'" aria-label="'+h+'동 '+t.label+' 수량">'+
      '<button type="button" class="sign" data-sign aria-pressed="false" aria-label="'+h+'동 '+t.label+' 더하기/빼기 전환">+</button></div></div>';
  }).join('');
  var temps=FIELDS.map(function(x){
    return '<label>'+x.label+' ℃<input class="tin" type="text" inputmode="decimal" autocomplete="off" data-h="'+h+'" data-f="'+x.f+'" placeholder="–"></label>';
  }).join('');
  var hums=HFIELDS.map(function(x){
    return '<label>'+x.label+' %<input class="hin" type="text" inputmode="decimal" autocomplete="off" data-h="'+h+'" data-f="'+x.f+'" placeholder="–" aria-label="'+h+'동 '+x.label+' 습도"></label>';
  }).join('');
  return '<section class="house" data-h="'+h+'"><div class="house-head"><h3>'+h+'동</h3>'+
    '<div class="house-now"><b data-now>0</b>남은 수 · 입식 <span data-init>0</span></div></div>'+rows+
    '<div class="temps">'+temps+'</div>'+
    '<div class="temps hums">'+hums+'</div>'+
    '<div class="works"><label class="ck"><input type="checkbox" data-h="'+h+'" data-f="rot" aria-label="'+h+'동 로터리 작업">로터리</label>'+
    '<label class="ck"><input type="checkbox" data-h="'+h+'" data-f="hk" aria-label="'+h+'동 왕겨 작업">왕겨</label>'+
    '<label class="hkl">kg<input class="kin" type="text" inputmode="decimal" autocomplete="off" data-h="'+h+'" data-f="hkg" placeholder="kg" aria-label="'+h+'동 왕겨 kg" disabled></label></div>'+
    '<div class="memo-label">비고</div><textarea class="memo" data-h="'+h+'" data-f="memo" aria-label="'+h+'동 비고" placeholder="오늘 특이사항"></textarea>'+
    '<div class="chips" data-chips></div></section>';
}
function renderInput(){
  var key=S.cid+'|'+S.date;
  if(S.inKey!==key||!$('houses')){
    $('pane-input').innerHTML=
      '<div class="datebar"><button type="button" class="btn" data-act="prev" aria-label="전날">‹</button>'+
      '<input type="date" id="dateIn" value="'+S.date+'" min="'+cyc().stockDate+'" max="'+maxDateOf(cyc())+'" aria-label="날짜">'+
      '<button type="button" class="btn" data-act="next" aria-label="다음날">›</button>'+
      '<button type="button" class="btn" data-act="today">오늘</button></div>'+
      '<div class="sumline" id="sumline"></div><div class="houses" id="houses">'+HOUSES.map(cardHTML).join('')+'</div>';
    S.inKey=key;
  }
  refreshInput();
}
function setVal(inp,v){
  if(!inp||document.activeElement===inp)return;
  var s=v==null?'':String(v);if(inp.value!==s)inp.value=s;
}
function refreshInput(){
  var c=cyc(),A=agg(),pane=$('pane-input');
  /* 선택한 날짜까지(입식일~그날)만 누적: 이후 날짜의 입력은 제외 */
  var CUM={};HOUSES.forEach(function(h){CUM[h]={cull:0,dead:0,feed:0};});
  S.entries.forEach(function(e){
    if(!e||!CUM[e.h]||!CUM[e.h].hasOwnProperty(e.t)||String(e.d)>S.date)return;
    CUM[e.h][e.t]+=Number(e.q)||0;
  });
  var nowAll=0,initAll=0,tdC=0,tdD=0,tdF=0;
  HOUSES.forEach(function(h){
    var card=pane.querySelector('.house[data-h="'+h+'"]');if(!card)return;
    var init=headsOf(c,h),tot=CUM[h],now=init-tot.cull-tot.dead;
    nowAll+=now;initAll+=init;
    card.querySelector('[data-now]').textContent=fmt(now);
    card.querySelector('[data-init]').textContent=fmt(init);
    var day=(A.byDate[S.date]||{})[h]||{cull:0,dead:0,feed:0};
    tdC+=day.cull;tdD+=day.dead;tdF+=day.feed;
    TYPES.forEach(function(t){

/* 작업(로터리·왕겨) 집계 */
function workTally(hs){
  var o={rot:0,hk:0,kg:0,by:{}};
  S.days.forEach(function(dd){
    if(!dd||dd.h===0||hs.indexOf(dd.h)<0)return;
    var b=o.by[dd.h]||(o.by[dd.h]={rot:0,hk:0,kg:0});
    if(dd.rot===true){o.rot++;b.rot++;}
    if(dd.hk===true){o.hk++;b.hk++;var k=Number(dd.hkg)||0;o.kg+=k;b.kg+=k;}
  });
  return o;
}
function workText(dd){
  if(!dd)return '';
  var a=[];if(dd.rot===true)a.push('로터리');
  if(dd.hk===true)a.push('왕겨'+(Number(dd.hkg)>0?' '+fmtN(Number(dd.hkg))+'kg':''));
  return a.join(', ');
}

function weekHTML(c,A){
  var hs=selHouses();
  var maxAge=Math.max(1,ageOf(c,todayStr()));
  A.dates.forEach(function(d){var a=ageOf(c,d);if(a>=1)maxAge=Math.max(maxAge,a);});
  var nW=Math.min(7,Math.ceil(maxAge/7));
  var rows=[];
  for(var wk=1;wk<=nW;wk++){
    var lo=(wk-1)*7+1,hi=wk*7,cull=0,dead=0,feed=0,has=false,T={tm:[],tn:[],te:[],hm:[],hn:[],he:[]};
    A.dates.forEach(function(d){
      var a=ageOf(c,d);if(a<lo||a>hi)return;
      hs.forEach(function(h){
        var x=(A.byDate[d]||{})[h];if(x){cull+=x.cull;dead+=x.dead;feed+=x.feed;has=true;}
        var dd=dayDoc(S.cid,d,h);
        if(dd)ALLF.forEach(function(f){if(isNum(dd[f.f])){T[f.f].push(dd[f.f]);has=true;}});
      });
    });
    rows.push('<tr><td>'+wk+'주차<br><small class="hint">'+lo+'~'+hi+'일령</small></td>'+
      (has?'<td>'+fmtN(cull)+'</td><td>'+fmtN(dead)+'</td><td><b>'+fmtN(cull+dead)+'</b></td><td>'+fmtN(feed)+'</td><td>'+fmtT(mean(T.tm))+' · '+fmtT(mean(T.tn))+' · '+fmtT(mean(T.te))+'</td><td>'+fmtT(mean(T.hm))+' · '+fmtT(mean(T.hn))+' · '+fmtT(mean(T.he))+'</td>':'<td>–</td><td>–</td><td>–</td><td>–</td><td>–</td><td>–</td>')+'</tr>');
  }
  return '<table class="tbl"><thead><tr><th>주차</th><th>도태</th><th>폐사</th><th>합산</th><th>사료 입고(kg)</th><th>온도 평균 아·점·저</th><th>습도 평균 %</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>';
}

function readTerms(){
  var out={},bad=false;
  var one=function(id,k){var v=numOrNull($(id).value);if(v!==null&&(!isFinite(v)||v<0)){bad=true;return;}if(v!==null)out[k]=v;};
  one('nLive','live');one('nChick','chick');one('nFeed','feed');one('nEco','eco');
  var fu={},li={};
  document.querySelectorAll('#nMon [data-nm]').forEach(function(e){
    var m=e.dataset.nm.split(':'),v=numOrNull(e.value);
    if(v!==null&&(!isFinite(v)||v<0)){bad=true;return;}
    if(v!==null)(m[0]==='fuel'?fu:li)[m[1]]=v;
  });
  if(Object.keys(fu).length)out.fuel=fu;if(Object.keys(li).length)out.litter=li;
  return {terms:out,bad:bad};
}
function clearTerms(){
  ['nLive','nChick','nFeed','nEco'].forEach(function(id){var e=$(id);if(e)e.value='';});
  var tb=$('nMon');if(tb)tb.innerHTML='';renderNMonths();
}
function fillTerms(t){
  t=t||{};
  [['nLive','live'],['nChick','chick'],['nFeed','feed'],['nEco','eco']].forEach(function(x){var e=$(x[0]);if(e)e.value=isNum(t[x[1]])?String(t[x[1]]):'';});
  renderNMonths();
  ['fuel','litter'].forEach(function(f){
    var m=t[f]||{};Object.keys(m).forEach(function(k){var e=document.querySelector('#nMon [data-nm="'+f+':'+k+'"]');if(e&&isNum(m[k]))e.value=String(m[k]);});
  });
}
async function prefillTerms(){
  if(!S.db||S.editId||!isOwner())return;
  try{
    var r=await S.db.collection('settle').get(),best=null;
    r.docs.forEach(function(d){
      var x=d.data();if(!x||!x.terms)return;
      var oc=cycleById(d.id),sd=oc?oc.stockDate:'';
      if(!best||sd>best.sd)best={sd:sd,t:x.terms};
    });
    if(!best||S.editId)return;
    [['nLive','live'],['nChick','chick'],['nFeed','feed'],['nEco','eco']].forEach(function(x){
      var e=$(x[0]);if(e&&e.value===''&&isNum(best.t[x[1]]))e.value=String(best.t[x[1]]);
    });
  }catch(e){}
}
async function saveTermsFor(cid,terms){
  var sn=await S.db.doc('settle/'+cid).get();
  var d=sn.exists?Object.assign({},sn.data()):{};
  d.c=cid;d.terms=terms;
  await S.db.doc('settle/'+cid).set(d);
}

  if(!S.db){err.textContent='저장소에 연결되지 않았습니다. 인터넷 연결을 확인하세요.';err.hidden=false;return;}
  var tr=readTerms();if(tr.bad){err.textContent='정산 단가는 0 이상의 숫자로 입력하세요.';err.hidden=false;return;}
  if(S.editId){
    var old=cycleById(S.editId);if(!old){cancelEdit();return;}
    var patch={stockDate:date,note:note};
    if(t!==Number(old.total)){var al=allocate(t),hh={};al.forEach(function(n,i){hh[i+1]=n;});patch.total=t;patch.heads=hh;}

      .then(function(){return isOwner()&&Object.keys(tr.terms).length?S.db.doc('settle/'+id).set({c:id,terms:tr.terms}):null;});

      idxAdd(id);S.ready=true;
      $('nTotal').value='';$('nNote').value='';updatePrev();clearTerms();S.prefilled=false;S.date=date>todayStr()?date:todayStr();

    })
    .catch(function(e){
      if(e&&e.code==='dup'){err.textContent='같은 입식일과 마릿수의 입식이 이미 등록되어 있습니다. 목록에서 선택하세요.';err.hidden=false;return;}
      err.textContent='등록하지 못했습니다. 권한을 확인하고 다시 시도하세요.';err.hidden=false;handleErr(e);
    })
    .then(function(){btn.disabled=!S.canWrite;});
}
async function runChunks(items,fn,size,onProg){
  for(var i=0;i<items.length;i+=size){
    await Promise.all(items.slice(i,i+size).map(fn));
    if(onProg)onProg(Math.min(i+size,items.length),items.length);
  }
}

/* ---------- 정산 ---------- */
var MAXAGE=49;
function maxDateOf(c){return addDays(c.stockDate,MAXAGE-1);}
function overAge(){var c=cyc();return !!(c&&ageOf(c,S.date)>MAXAGE);}
function nz(v){return isNum(v)?v:0;}
function numOrNull(v){var r=String(v==null?'':v).trim().replace(/,/g,'');if(r==='')return null;var n=Number(r);return isFinite(n)?n:NaN;}
function won(x){return fmt(Math.round(x))+'원';}
function sdoc(){return S.settle||{};}
function monthKeys(c){
  var out=[],end=maxDateOf(c),cur=c.stockDate.slice(0,7);
  for(var i=0;i<4;i++){
    out.push(cur);
    var y=Number(cur.slice(0,4)),m=Number(cur.slice(5,7))+1;if(m>12){m=1;y++;}
    var nx=y+'-'+p2(m);if(nx+'-01'>end)break;cur=nx;
  }
  return out;
}
function dimOf(mk){return new Date(Date.UTC(Number(mk.slice(0,4)),Number(mk.slice(5,7)),0)).getUTCDate();}
function periodDaysIn(mk,c,endDate){
  if(!endDate)return 0;
  var dim=dimOf(mk),a=c.stockDate>mk+'-01'?c.stockDate:mk+'-01',z=endDate<mk+'-'+p2(dim)?endDate:mk+'-'+p2(dim);
  var n=dayNum(z)-dayNum(a)+1;return n>0?n:0;
}
function calcSettle(c){
  var d=sdoc(),sh=d.ship||{},tm=d.terms||{},r={};
  var ws=(Array.isArray(sh.weights)?sh.weights:[]).filter(isNum);
  r.W=ws.reduce(function(x,y){return x+y;},0);r.nVeh=ws.length;
  r.heads=isNum(sh.heads)&&sh.heads>0?sh.heads:null;
  r.shipDate=/^\d{4}-\d{2}-\d{2}$/.test(sh.date||'')&&sh.date>=c.stockDate?sh.date:null;

/* 파일 읽기 */
function readBuf(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsArrayBuffer(file);});}
function parseTs(x){
  if(typeof x==='number'&&typeof XLSX!=='undefined'&&XLSX.SSF){
    var o=XLSX.SSF.parse_date_code(x);if(!o)return null;
    return {d:o.y+'-'+p2(o.m)+'-'+p2(o.d),m:o.H*60+o.M};
  }
  var m=String(x==null?'':x).match(/^\s*(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})[ T]+(\d{1,2}):(\d{2})/);
  if(!m)return null;
  return {d:m[1]+'-'+p2(m[2])+'-'+p2(m[3]),m:Number(m[4])*60+Number(m[5])};
}
function parseSheet(buf){
  if(typeof XLSX==='undefined')throw new Error('nolib');
  var wb=XLSX.read(buf,{type:'array'});
  var ws=wb.Sheets[wb.SheetNames[0]];
  var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  var out=[];
  rows.forEach(function(r){
    var t=parseTs(r[0]);if(!t)return;
    if(r[1]===null||r[1]==='')return;
    var v=Number(r[1]);if(!isFinite(v))return;
    var hv=(r[2]===null||r[2]===''||r[2]===undefined)?null:Number(r[2]);
    if(hv!==null&&(!isFinite(hv)||hv<0||hv>100))hv=null;
    out.push({d:t.d,m:t.m,v:v,hv:hv});
  });
  return out;
}
/* 집계: 동별·날짜별로 시간대 평균. 구간의 70% 미만만 기록된 시간대는 건너뜀 */
function aggregateRows(rows,win,minDate){
  var seen={},by={};
  rows.forEach(function(r){
    if(r.h==null)return;
    var k=r.id+'|'+r.d+'|'+r.m;if(seen[k])return;seen[k]=1;
    var hh=by[r.h]||(by[r.h]={}),dd=hh[r.d]||(hh[r.d]={ids:{},pts:[]});
    dd.ids[r.id]=1;dd.pts.push(r);
  });
  var out=[];
  Object.keys(by).forEach(function(h){Object.keys(by[h]).forEach(function(d){
    if(d<minDate)return;
    var dd=by[h][d],nS=Object.keys(dd.ids).length,vals={},cov={};
    ['m','n','e'].forEach(function(k){
      var st=win[k][0]*60,en=win[k][1]*60;
      var pts=dd.pts.filter(function(p){return p.m>=st&&p.m<en;});
      var need=(en-st)*nS,c=need>0?pts.length/need:0;cov[k]=c;
      vals[WKEY[k]]=(c>=0.7&&pts.length)?Math.round(mean(pts.map(function(p){return p.v;}))*10)/10:null;
      var hp=pts.filter(function(p){return p.hv!=null;});
      vals[HKEY[k]]=(need>0&&hp.length/need>=0.7)?Math.round(mean(hp.map(function(p){return p.hv;}))*10)/10:null;
    });
    out.push({d:d,h:Number(h),vals:vals,cov:cov,ns:nS});
  });});
  out.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:(a.h||9)-(b.h||9);});
  return out;
}
async function handleImpFiles(files){

    var f=files[i],m=String(f.name).toUpperCase().match(/[0-9A-F]{12}/),id=m?m[0]:null;

/* ---------- 그래프 탭: 동·외부 겹쳐보기 / 입식(파트)별 겹쳐보기 ---------- */
var SER_ORDER=[1,2,3,4,5,0];
var MET={temp:{k:'temp',label:'온도',unit:'℃'},humi:{k:'humi',label:'습도',unit:'%'},dead:{k:'dead',label:'폐사',unit:'마리'},cull:{k:'cull',label:'도태',unit:'마리'},
  loss:{k:'loss',label:'폐사+도태',unit:'마리'},
  feed:{k:'feed',label:'사료 입고',unit:'kg'},fpp:{k:'fpp',label:'마리당 사료',unit:'kg/마리'},drate:{k:'drate',label:'폐사율',unit:'%'},fcr:{k:'fcr',label:'요구율',unit:''}};
var MET_H=['temp','humi','dead','cull','loss','feed'],MET_C=['temp','humi','dead','cull','loss','feed','fpp','drate','fcr'];
function lossOf(o){return (o?(Number(o.dead)||0)+(Number(o.cull)||0):0);}
var GH=null;
function gColor(h){return h===0?'var(--muted)':'var(--s'+h+')';}
function gSwatch(h){return h===0?'repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 8px)':'var(--s'+h+')';}
function winHours(){var st=settingsNow();return {tm:(st.win.m[0]+st.win.m[1])/2,tn:(st.win.n[0]+st.win.n[1])/2,te:(st.win.e[0]+st.win.e[1])/2};}
function isoDay(n){return new Date(n*86400000).toISOString().slice(0,10);}

/* 동·외부 겹쳐보기: 현재 선택한 입식 */
function houseSeries(c){
  var g=S.g,hours=winHours(),series=[];
  if(isEnv(g.metric)){
    SER_ORDER.forEach(function(h){
      var pts=[];
      S.days.forEach(function(dd){
        if(dd.h!==h||!dd.d)return;
        var a=ageOf(c,dd.d);if(a<1)return;
        fieldsFor(g.metric).forEach(function(f){
          if(g.win!=='all'&&g.win!==f.w)return;
          if(isNum(dd[f.f]))pts.push({x:a+(g.win==='all'?hours[f.w]/24:0.5),y:dd[f.f],d:dd.d,a:a,lab:f.label});
        });
      });
      pts.sort(function(p,q){return p.x-q.x;});
      series.push({key:String(h),name:hl(h),color:gColor(h),dash:h===0,sw:gSwatch(h),pts:pts});
    });
  }else{
    var A=agg(),dates=Array.from(A.dates).filter(function(d){return d>=c.stockDate;}).sort();
    [1,2,3,4,5].forEach(function(h){
      var pts=[],run=0;
      if(dates.length){
        for(var n=dayNum(dates[0]);n<=dayNum(dates[dates.length-1]);n++){
          var d=isoDay(n),ho=((A.byDate[d]||{})[h])||{},v=g.metric==='loss'?lossOf(ho):(ho[g.metric]||0);run+=v;
          pts.push({x:ageOf(c,d)+0.5,y:g.cum?run:v,d:d,a:ageOf(c,d),lab:''});
        }
      }
      series.push({key:String(h),name:hl(h),color:gColor(h),dash:false,sw:gSwatch(h),pts:pts});
    });
  }

}
/* 입식(파트)별 겹쳐보기 */
function cycLabel(c){return c.stockDate.slice(2).replace(/-/g,'.')+' 입식';}
function cycSrc(cid){
  if(cid===S.cid)return {entries:Array.from(S.entries.values()),days:Array.from(S.days.values())};
  return S.g.cache[cid]||null;
}
function scopeHs(){return S.g.scope==='all'?HOUSES:[Number(S.g.scope)];}
function cycTotals(c,src,hs){
  var init=0,by={},tot={cull:0,dead:0,feed:0},last=null;
  hs.forEach(function(h){init+=headsOf(c,h);});
  src.entries.forEach(function(e){
    if(!e||hs.indexOf(e.h)<0||!e.d||e.d<c.stockDate||tot[e.t]===undefined)return;
    var q=Number(e.q)||0,o=by[e.d]||(by[e.d]={cull:0,dead:0,feed:0});
    o[e.t]+=q;tot[e.t]+=q;if(!last||e.d>last)last=e.d;
  });
  return {init:init,by:by,tot:tot,last:last};
}
function cycleSeriesPts(c,src,hs,g,hours){
  var pts=[];
  if(isEnv(g.metric)){
    var by={},FS=fieldsFor(g.metric);
    src.days.forEach(function(dd){
      if(!dd||!dd.d||dd.d<c.stockDate||hs.indexOf(dd.h)<0)return;
      FS.forEach(function(f){
        if(g.win!=='all'&&g.win!==f.w)return;
        if(isNum(dd[f.f])){var o=by[dd.d]||(by[dd.d]={});(o[f.f]=o[f.f]||[]).push(dd[f.f]);}
      });
    });
    Object.keys(by).forEach(function(d){FS.forEach(function(f){
      if(by[d][f.f])pts.push({x:ageOf(c,d)+(g.win==='all'?hours[f.w]/24:0.5),y:mean(by[d][f.f]),d:d,a:ageOf(c,d),lab:f.label});
    });});
    pts.sort(function(p,q){return p.x-q.x;});
    return pts;
  }
  var T=cycTotals(c,src,hs),dates=Object.keys(T.by).sort();
  if(!dates.length)return pts;
  var run={cull:0,dead:0,feed:0};
  for(var n=dayNum(dates[0]);n<=dayNum(dates[dates.length-1]);n++){
    var d=isoDay(n),o=T.by[d]||{cull:0,dead:0,feed:0},a=ageOf(c,d),y=null;
    run.cull+=o.cull;run.dead+=o.dead;run.feed+=o.feed;
    var now=T.init-run.cull-run.dead;
    if(g.metric==='fpp')y=now>0?run.feed/now:null;
    else if(g.metric==='drate')y=T.init>0?run.dead/T.init*100:null;
    else if(g.metric==='fcr'){var w=Number(c.expectedWeight)||0;y=(now>0&&w>0)?run.feed/(now*w):null;}
    else if(g.metric==='loss')y=g.cum?(run.dead+run.cull):(o.dead+o.cull);
    else y=g.cum?run[g.metric]:o[g.metric];
    if(y!=null)pts.push({x:a+0.5,y:y,d:d,a:a,lab:''});
  }
  return pts;
}
function cycleSeries(){
  var g=S.g,hs=scopeHs(),hours=winHours(),out=[];
  g.sel.forEach(function(cid){
    var c=cycleById(cid),src=cycSrc(cid);if(!c)return;
    var col='var(--s'+g.color[cid]+')';
    out.push({key:cid,name:cycLabel(c),color:col,dash:false,sw:col,loading:!src,pts:src?cycleSeriesPts(c,src,hs,g,hours):[]});
  });
  return out;
}
function ensureCmp(){
  var g=S.g;if(g.mode!=='cycle'||!S.db)return;
  g.sel.forEach(function(cid){
    if(cid===S.cid||g.cache[cid]||g.pending[cid])return;
    g.pending[cid]=true;
    Promise.all([S.db.collection('entries').where('c','==',cid).get(),S.db.collection('days').where('c','==',cid).get()])
      .then(function(r){g.cache[cid]={entries:r[0].docs.map(function(d){return d.data();}),days:r[1].docs.map(function(d){return d.data();})};})
      .catch(function(){g.cache[cid]={entries:[],days:[],err:true};})
      .then(function(){delete g.pending[cid];if(S.tab==='graph')renderGraph();});
  });
}
function cmpPrepare(){
  var g=S.g,have={};S.cycles.forEach(function(c){have[c.id]=1;});
  g.sel=g.sel.filter(function(cid){return have[cid];});
  Object.keys(g.color).forEach(function(k){if(g.sel.indexOf(k)<0)delete g.color[k];});
  if(!g.sel.length&&!g.selInit){
    var ids=[];if(S.cid)ids.push(S.cid);
    S.cycles.forEach(function(c){if(ids.indexOf(c.id)<0)ids.push(c.id);});
    ids.slice(0,2).forEach(function(cid){cmpAdd(cid);});
    g.selInit=true;
  }

function niceTicks(lo,hi,n){
  if(!(hi>lo))hi=lo+1;
  var raw=(hi-lo)/n,pow=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/pow;
  var step=(f<=1?1:f<=2?2:f<=5?5:10)*pow;
  var dec=step<1?Math.ceil(-Math.log10(step)-1e-9):0,out=[];
  for(var v=Math.floor(lo/step)*step;v<=Math.ceil(hi/step)*step+step*1e-6;v+=step)out.push(Number(v.toFixed(dec)));
  return {ticks:out,dec:dec};
}

function bindGraphHover(){
  var svg=$('gsvg'),hit=$('ghit'),cur=$('gcur'),dots=$('gdots'),tip=$('gtip'),wrap=$('gwrap');
  if(!svg||!GH)return;
  var G=GH,xsU=[],seen={};
  G.vis.forEach(function(s){s.pts.forEach(function(p){var k=p.x.toFixed(4);if(!seen[k]){seen[k]=1;xsU.push(p.x);}});});
  function move(e){
    var r=svg.getBoundingClientRect(),k=G.W/r.width;
    var px=(e.clientX-r.left)*k,xv=G.xmin+(px-G.L)/G.pw*(G.xmax-G.xmin);
    var best=xsU[0],bd=Infinity;
    xsU.forEach(function(x){var d=Math.abs(x-xv);if(d<bd){bd=d;best=x;}});
    var rows=[],head=null,dh='';
    G.vis.forEach(function(s){
      for(var i=0;i<s.pts.length;i++){
        var p=s.pts[i];
        if(Math.abs(p.x-best)<1e-9){
          rows.push({s:s,p:p});if(!head)head=p;
          dh+='<circle cx="'+G.sx(p.x).toFixed(1)+'" cy="'+G.sy(p.y).toFixed(1)+'" r="4.5" style="fill:'+s.color+';stroke:var(--surface);stroke-width:2"/>';
          break;
        }
      }
    });
    if(!head)return;
    var cx=G.sx(best);
    cur.setAttribute('x1',cx.toFixed(1));cur.setAttribute('x2',cx.toFixed(1));cur.style.display='';
    dots.innerHTML=dh;
    tip.innerHTML='<b>'+head.a+'일령'+(G.cm?'':' · '+head.d.slice(5).replace('-','.'))+(head.lab?' '+head.lab:'')+'</b>'+
      rows.map(function(x){return '<div><span><i style="background:'+x.s.sw+'"></i>'+x.s.name+'</span><span>'+gVal(G.m,x.p.y)+' '+G.m.unit+'</span></div>';}).join('');
    tip.style.display='';
    var cssX=cx/k,tw=tip.offsetWidth,left=cssX+12;
    if(left+tw>wrap.clientWidth)left=cssX-12-tw;
    tip.style.left=Math.max(0,left)+'px';
  }
  function leave(){cur.style.display='none';dots.innerHTML='';tip.style.display='none';}
  hit.addEventListener('pointermove',move);
  hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',leave);
}

function xlTotals(c,data,hs){
  var tot={cull:0,dead:0,feed:0},init=0;
  hs.forEach(function(h){init+=headsOf(c,h);});
  data.entries.forEach(function(e){
    if(hs.indexOf(e.h)<0||!e.d||e.d<c.stockDate||tot[e.t]===undefined)return;
    tot[e.t]+=Number(e.q)||0;
  });
  var now=init-tot.cull-tot.dead,w=Number(c.expectedWeight)||0,r2=function(v){return Math.round(v*100)/100;};
  return {init:init,cull:tot.cull,dead:tot.dead,feed:tot.feed,now:now,w:w,
    rate:init>0?r2(tot.dead/init*100):null,fpp:now>0?r2(tot.feed/now):null,fcr:(now>0&&w>0)?r2(tot.feed/(now*w)):null};
}

function xlBuild(cycles,datas,opt){

    var rows=cycles.map(function(c){

    var rows2=cycles.map(function(c,i){var t=xlTotals(c,datas[i],hs);return [c.stockDate,t.init,t.cull,t.dead,t.rate,t.now,t.feed,t.fpp,t.w||null,t.fcr];});
    sheets.push({name:'입식 비교',aoa:[head2].concat(rows2)});
  }
  cycles.forEach(function(c,i){

      if(opt.count)data.entries.forEach(function(e){

      });

      var rows4=hs.map(function(h){var t=xlTotals(c,data,[h]);return [hl(h),t.init,t.cull,t.dead,t.rate,t.now,t.feed,t.fpp,t.w||null,t.fcr];});
      if(hs.length>1){var ta=xlTotals(c,data,hs);rows4.push(['선택한 동 전체',ta.init,ta.cull,ta.dead,ta.rate,ta.now,ta.feed,ta.fpp,ta.w||null,ta.fcr]);}
      sheets.push({name:'동별 요약 '+tag,aoa:[head4].concat(rows4)});

  });

}
async function doExport(){
  var err=$('xErr');err.hidden=true;
  var fail=function(m){err.textContent=m;err.hidden=false;};
  var ids=xlChecked('xc'),what=xlChecked('xw'),houses=xlChecked('xh').map(Number);
  var opt={info:what.indexOf('info')>=0,count:what.indexOf('count')>=0,temp:what.indexOf('temp')>=0,note:what.indexOf('note')>=0,sum:what.indexOf('sum')>=0,houses:houses};
  if(!ids.length)return fail('내보낼 입식을 하나 이상 선택하세요.');
  if(!what.length)return fail('포함할 내용을 하나 이상 선택하세요.');
  if(opt.count||opt.note||opt.sum){
    if(!houses.some(function(h){return h>0;})&&!opt.temp&&!opt.info)return fail('동을 하나 이상 선택하세요.');
  }
  if(!houses.length&&(opt.count||opt.temp||opt.note||opt.sum))return fail('동을 하나 이상 선택하세요.');
  if(typeof XLSX==='undefined')return fail('엑셀 파일을 만드는 도구를 불러오지 못했습니다. 화면을 새로고침한 뒤 다시 시도하세요.');
  if(!S.dl)return fail('이 기기에서는 파일 저장을 사용할 수 없습니다.');
  var btn=document.querySelector('#bkBox [data-act="xl-go"]');if(btn)btn.disabled=true;
  try{
    toast('엑셀 만드는 중…');
    var cycles=S.cycles.filter(function(c){return ids.indexOf(c.id)>=0;}).sort(function(a,b){return a.stockDate<b.stockDate?-1:1;});
    var datas=[];for(var i=0;i<cycles.length;i++){datas.push(await xlGetData(cycles[i].id));}
    var sheets=xlBuild(cycles,datas,opt);
    if(!sheets.length)return fail('선택한 조건에 맞는 내용이 없습니다. 내용이나 동을 다시 선택하세요.');
    var wb=XLSX.utils.book_new(),used={};
    sheets.forEach(function(sh){
      var nm=xlSheetName(sh.name),k=nm,n=2;while(used[k]){k=xlSheetName(nm.slice(0,28)+' '+n);n++;}used[k]=1;
      var ws=XLSX.utils.aoa_to_sheet(sh.aoa);
      ws['!cols']=sh.aoa[0].map(function(h,ci){var w=String(h).length*2+2;sh.aoa.slice(1,40).forEach(function(r){var l=String(r[ci]==null?'':r[ci]).length;if(l>w)w=l;});return {wch:Math.min(Math.max(w,8),40)};});
      XLSX.utils.book_append_sheet(wb,ws,k);
    });
    var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    var name=cycles.length===1?'worklog_'+cycles[0].stockDate+'.xlsx':'worklog_'+cycles.length+'cycles_'+todayStr()+'.xlsx';
    try{await S.dl.save({filename:name,data:out});toast('엑셀 파일을 저장했습니다');$('bkBox').innerHTML='';}
    catch(e){if(!(e&&e.code==='declined'))fail('파일을 저장하지 못했습니다. 다시 시도하세요.');}
  }catch(e){fail('엑셀을 만들지 못했습니다. 다시 시도하세요.');handleErr(e);}
  finally{if(btn)btn.disabled=false;}
}

      if(act==='restore-cancel'){S.restore=null;$('bkBox').innerHTML='';return;}

      var gid=gcy.dataset.gcy,ix=S.g.sel.indexOf(gid);

var TO='__timeout__';
function withTimeout(p,ms){
  return Promise.race([Promise.resolve(p),new Promise(function(r){setTimeout(function(){r(TO);},ms);})]);
}
function giveUp(msg){

async function init(){

        S.status='사용자 확인 중…';render();

        try{var dl=await withTimeout(cl.use('downloads'),3000);S.dl=(dl===TO)?null:dl;}catch(e){S.dl=null;}
        if(S.user){
          try{var id=await withTimeout(S.user.id(),3000);if(id!==TO)S.uid=id;}catch(e){}
          try{var cw=await withTimeout(S.user.can&&S.user.can('data.write'),3000);if(cw===false)S.canWrite=false;}catch(e){}
        }
      }
    }
  }catch(e){S.db=null;}
  if(!S.db){S.ready=true;render();return;}
  if(!S.canWrite)notice('이 계정은 입력 권한이 없습니다. 관리자에게 문의하세요.',false);
  S.status='입식 목록 불러오는 중…';render();

    S.db.doc('settings/main').onSnapshot(function(d){
      S.settings=d.exists?d.data():null;
      if(S.tab==='sensor'){refreshSensor();renderImp();}
    },function(e){});
  }catch(e){}
  try{
    S.db.collection('cycles').onSnapshot(function(sn){S.dbg.실시간=sn.docs.length+'건'+(sn.metadata&&sn.metadata.fromCache?'(캐시)':'');onCycles(sn);},function(e){S.dbg.실시간='오류 '+((e&&(e.code||e.message))||'?');handleErr(e);});
  }catch(e){handleErr(e);}
  loadCycles(0);
  setTimeout(function(){
    if(!S.ready){S.status='저장소 응답이 늦습니다. 자동으로 다시 시도하는 중…';render();}
  },8000);
  var tick=setInterval(function(){
    if(S.ready){clearInterval(tick);return;}
    S.status='저장소 응답이 늦습니다. 자동으로 다시 시도하는 중…\n['+dbgTxt()+']';render();
  },3000);
}
window.__appInit=init;
